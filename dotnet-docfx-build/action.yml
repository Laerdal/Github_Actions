name: "📚 Generate DocFX Documentation"
description: "Generates documentation using DocFX .NET Global Tool"
author: "Francois Raminosona"

inputs:
  # Arguments passed to dotnet
  working-directory:
    description: "Working directory for the command"
    required: false
    default: "."
  global:
    description: "Install the DocFX .NET global tool if not already installed"
    required: false
    default: "false"
  show-summary:
    description: "Whether to show the action summary"
    required: false
    default: "false"

  # Arguments unique to DocFX
  config:
    description: "Path to the docfx configuration file (default: docfx.json)"
    required: false
    default: "docfx.json"
  output:
    description: "Specify the output base directory"
    required: false
    default: "_site"
  logLevel:
    description: "Set log level to error, warning, info, verbose or diagnostic"
    required: false
    default: "info"
  logFile:
    description: "Save log as structured JSON to the specified file"
    required: false
    default: ""
  verbose:
    description: "Set log level to verbose"
    required: false
    default: "false"
  warningsAsErrors:
    description: "Treats warnings as errors"
    required: false
    default: "false"
  metadata:
    description: "Global metadata in JSON format (e.g., {'_appTitle':'My App','_disableContribution':true})"
    required: false
    default: ""
  xref:
    description: "Comma-separated URLs of xrefmap used by content files"
    required: false
    default: ""
  template:
    description: "Specify the template name to apply"
    required: false
    default: ""
  theme:
    description: "Specify which theme to use (default: default)"
    required: false
    default: "default"
  debug:
    description: "Run in debug mode"
    required: false
    default: "false"
  debugOutput:
    description: "The output folder for files generated for debugging purpose"
    required: false
    default: ""
  exportRawModel:
    description: "Export raw model to .raw.model.json extension"
    required: false
    default: "false"
  rawModelOutputFolder:
    description: "Specify the output folder for the raw model"
    required: false
    default: ""
  exportViewModel:
    description: "Export view model to .view.model.json extension"
    required: false
    default: "false"
  viewModelOutputFolder:
    description: "Specify the output folder for the view model"
    required: false
    default: ""
  maxParallelism:
    description: "Set the max parallelism (0 is auto)"
    required: false
    default: "0"
  markdownEngineProperties:
    description: "Parameters for markdown engine in JSON format"
    required: false
    default: ""
  postProcessors:
    description: "Comma-separated order of post processors in plugins"
    required: false
    default: ""
  disableGitFeatures:
    description: "Disable fetching Git related information for articles"
    required: false
    default: "false"
  dryRun:
    description: "Template will not be actually applied to the documents"
    required: false
    default: "false"
  docfx-version:
    description: "Version of DocFX tool to install"
    required: false
    default: ""

outputs:
  exit-code:
    description: "Exit code of the dotnet command"
    value: ${{ steps.run-dotnet.outputs.exit-code }}
  executed-command:
    description: "The actual command that was executed"
    value: ${{ steps.run-dotnet.outputs.executed-command }}
  has-index:
    description: "Whether an index.html file was generated"
    value: ${{ steps.verify-build.outputs.has-index }}

runs:
  using: "composite"
  steps:

    # ================== ℹ️ ==================

    - name: "ℹ️ Gather environment information"
      shell: bash
      run: |
        echo "::debug::Operating System: $(uname -a)"
        echo "::debug::GitHub Runner OS: $RUNNER_OS"
        echo "::debug::GitHub Runner Version: $RUNNER_VERSION"
        echo "::debug::.NET SDK Version: $(dotnet --version || echo 'Not installed')"

    # ================== 🔒 ==================

    - name: "🔒 Mask sensitive data"
      shell: bash
      run: |
        # No sensitive inputs to mask in this action
        echo "✅ No sensitive data to mask"

    # ================== 📁 ==================

    - name: "📁 Normalize config"
      id: normalize-config
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.config }}

    - name: "📁 Normalize output"
      id: normalize-output
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.output }}

    - name: "📁 Normalize logFile"
      id: normalize-logfile
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.logFile }}

    - name: "📁 Normalize debugOutput"
      id: normalize-debugoutput
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.debugOutput }}

    - name: "📁 Normalize rawModelOutputFolder"
      id: normalize-rawmodeloutputfolder
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.rawModelOutputFolder }}

    - name: "📁 Normalize viewModelOutputFolder"
      id: normalize-viewmodeloutputfolder
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.viewModelOutputFolder }}
    # ================== ✅ ==================

    - name: "✅ Validate input : booleans"
      shell: bash
      run: |
        echo "::debug::Validating boolean inputs for DocFX documentation generation"

        for param in verbose warningsAsErrors debug exportRawModel exportViewModel disableGitFeatures dryRun; do
          case $param in
            verbose) value="${INPUT_VERBOSE}" ;;
            warningsAsErrors) value="${INPUT_WARNINGSASERRORS}" ;;
            debug) value="${INPUT_DEBUG}" ;;
            exportRawModel) value="${INPUT_EXPORTRAWMODEL}" ;;
            exportViewModel) value="${INPUT_EXPORTVIEWMODEL}" ;;
            disableGitFeatures) value="${INPUT_DISABLEGITFEATURES}" ;;
            dryRun) value="${INPUT_DRYRUN}" ;;
          esac
          if [ -n "$value" ] && [ "$value" != "true" ] && [ "$value" != "false" ]; then
            echo "::error::Parameter $param must be 'true' or 'false', got: $value"
            exit 1
          fi
        done

        echo "✅ Boolean input validation completed successfully"
      env:
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_WARNINGSASERRORS: ${{ inputs.warningsAsErrors }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_EXPORTRAWMODEL: ${{ inputs.exportRawModel }}
        INPUT_EXPORTVIEWMODEL: ${{ inputs.exportViewModel }}
        INPUT_DISABLEGITFEATURES: ${{ inputs.disableGitFeatures }}
        INPUT_DRYRUN: ${{ inputs.dryRun }}

    - name: "✅ Validate input : config"
      if: ${{ inputs.config != '' }}
      shell: bash
      run: |
        echo "::debug::Validating config input for DocFX documentation generation"

        if [ ! -f "${STEP_NORMALIZE_CONFIG_NORMALIZED}" ]; then
          echo "::error file=${STEP_NORMALIZE_CONFIG_NORMALIZED}::DocFX configuration file not found: ${STEP_NORMALIZE_CONFIG_NORMALIZED}"
          exit 1
        fi

        echo "✅ Config input validation completed successfully"
      env:
        STEP_NORMALIZE_CONFIG_NORMALIZED: ${{ steps.normalize-config.outputs.normalized }}

    - name: "✅ Validate input : logLevel"
      if: ${{ inputs.logLevel != '' && inputs.logLevel != 'info' }}
      shell: bash
      run: |
        echo "::debug::Validating logLevel input for DocFX documentation generation"

        case "${INPUT_LOGLEVEL}" in
          error|warning|info|verbose|diagnostic) ;;
          *) echo "::error::Invalid logLevel. Must be one of: error, warning, info, verbose, diagnostic"; exit 1 ;;
        esac

        echo "✅ Log-level input validation completed successfully"
      env:
        INPUT_LOGLEVEL: ${{ inputs.logLevel }}

    - name: "✅ Validate input : metadata"
      if: ${{ inputs.metadata != '' }}
      shell: bash
      run: |
        echo "::debug::Validating metadata input for DocFX documentation generation"

        if ! echo "${INPUT_METADATA}" | jq empty >/dev/null 2>&1; then
          echo "::error::Metadata must be a valid JSON string, got: ${INPUT_METADATA}"
          exit 1
        fi

        echo "✅ Metadata input validation completed successfully"
      env:
        INPUT_METADATA: ${{ inputs.metadata }}

    - name: "✅ Validate input : maxParallelism"
      if: ${{ inputs.maxParallelism != '' && inputs.maxParallelism != '0' }}
      shell: bash
      run: |
        echo "::debug::Validating maxParallelism input for DocFX documentation generation"

        if ! [[ "${INPUT_MAXPARALLELISM}" =~ ^[0-9]+$ ]]; then
          echo "::error::maxParallelism must be a non-negative integer, got: ${INPUT_MAXPARALLELISM}"
          exit 1
        fi

        echo "✅ Max-parallelism input validation completed successfully"
      env:
        INPUT_MAXPARALLELISM: ${{ inputs.maxParallelism }}

    - name: "✅ Validate input : postProcessors"
      if: ${{ inputs.postProcessors != '' }}
      shell: bash
      run: |
        echo "::debug::Validating postProcessors input for DocFX documentation generation"

        IFS=',' read -ra PROCESSORS <<< "${INPUT_POSTPROCESSORS}"
        for processor in "${PROCESSORS[@]}"; do
          if [[ -z "$processor" ]]; then
            echo "::error::Post-processors must be a comma-separated list of non-empty values, got: ${INPUT_POSTPROCESSORS}"
            exit 1
          fi
        done

        echo "✅ Post-processors input validation completed successfully"
      env:
        INPUT_POSTPROCESSORS: ${{ inputs.postProcessors }}

    - name: "✅ Validate input : docfx-version"
      if: ${{ inputs.docfx-version != '' }}
      shell: bash
      run: |
        echo "::debug::Validating docfx-version input for DocFX documentation generation"

        if ! [[ "${INPUT_DOCFX_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::warning::Version format may be invalid. Expected format: X.Y.Z, got: ${INPUT_DOCFX_VERSION}"
        fi

        echo "✅ docfx-version input validation completed successfully"
      env:
        INPUT_DOCFX_VERSION: ${{ inputs.docfx-version }}

    - name: "✅ Validate input : markdownEngineProperties"
      if: ${{ inputs.markdownEngineProperties != '' }}
      shell: bash
      run: |
        echo "::debug::Validating markdownEngineProperties input for DocFX documentation generation"

        if ! echo "${INPUT_MARKDOWNENGINEPROPERTIES}" | jq empty >/dev/null 2>&1; then
          echo "::error::markdownEngineProperties must be a valid JSON string, got: ${INPUT_MARKDOWNENGINEPROPERTIES}"
          exit 1
        fi

        echo "✅ markdownEngineProperties input validation completed successfully"
      env:
        INPUT_MARKDOWNENGINEPROPERTIES: ${{ inputs.markdownEngineProperties }}

    - name: "✅ Validate input : xref"
      if: ${{ inputs.xref != '' }}
      shell: bash
      run: |
        echo "::debug::Validating xref input for DocFX documentation generation"

        IFS=',' read -ra XREF_URLS <<< "${INPUT_XREF}"
        for url in "${XREF_URLS[@]}"; do
          if ! [[ "$url" =~ ^https?:// ]]; then
            echo "::error::Each xref URL must start with http:// or https://, got: $url"
            exit 1
          fi
        done

        echo "✅ Xref input validation completed successfully"
      env:
        INPUT_XREF: ${{ inputs.xref }}

    # ================== 🏗️  ==================

    - name: "🏗️ Build argument list"
      id: build-args
      shell: bash
      run: |
        echo "::debug::Building arguments for DocFX documentation generation"

        # Start with base command
        ARGS="run docfx build"

        # Add config file path
        if [ -n "${STEP_NORMALIZE_CONFIG_NORMALIZED}" ]; then
          ARGS="$ARGS '${STEP_NORMALIZE_CONFIG_NORMALIZED}'"
        fi

        # Boolean flags
        for param in verbose warningsAsErrors debug exportRawModel exportViewModel disableGitFeatures dryRun; do
          case $param in
            verbose) value="${INPUT_VERBOSE}" ;;
            warningsAsErrors) value="${INPUT_WARNINGSASERRORS}" ;;
            debug) value="${INPUT_DEBUG}" ;;
            exportRawModel) value="${INPUT_EXPORTRAWMODEL}" ;;
            exportViewModel) value="${INPUT_EXPORTVIEWMODEL}" ;;
            disableGitFeatures) value="${INPUT_DISABLEGITFEATURES}" ;;
            dryRun) value="${INPUT_DRYRUN}" ;;
          esac
          if [ "$value" = "true" ]; then
            ARGS="$ARGS --${param}"
          fi
        done

        # Key-value options (only add if not default values)
        for param in output template debugOutput rawModelOutputFolder viewModelOutputFolder markdownEngineProperties postProcessors log; do
          case $param in
            output) value="${STEP_NORMALIZE_OUTPUT_NORMALIZED}" ;;
            template) value="${INPUT_TEMPLATE}" ;;
            debugOutput) value="${STEP_NORMALIZE_DEBUGOUTPUT_NORMALIZED}" ;;
            rawModelOutputFolder) value="${STEP_NORMALIZE_RAWMODELOUTPUTFOLDER_NORMALIZED}" ;;
            viewModelOutputFolder) value="${STEP_NORMALIZE_VIEWMODELOUTPUTFOLDER_NORMALIZED}" ;;
            markdownEngineProperties) value="${INPUT_MARKDOWNENGINEPROPERTIES}" ;;
            postProcessors) value="${INPUT_POSTPROCESSORS}" ;;
            log) value="${STEP_NORMALIZE_LOG_NORMALIZED}" ;;
          esac
          if [ -n "$value" ]; then
            ARGS="$ARGS --$param '$value'"
          fi
        done

        # Handle parameters with meaningful defaults
        if [ "${INPUT_LOGLEVEL}" != "info" ]; then
          ARGS="$ARGS --logLevel '${INPUT_LOGLEVEL}'"
        fi

        if [ "${INPUT_THEME}" != "default" ]; then
          ARGS="$ARGS --theme '${INPUT_THEME}'"
        fi

        if [ "${INPUT_MAXPARALLELISM}" != "0" ]; then
          ARGS="$ARGS --maxParallelism '${INPUT_MAXPARALLELISM}'"
        fi

        # Special handling for metadata (JSON conversion)
        if [ -n "${INPUT_METADATA}" ]; then
          # Convert JSON object to key-value pairs for --metadata flags
          while IFS= read -r metadata_arg; do
            ARGS="$ARGS $metadata_arg"
          done < <(echo "${INPUT_METADATA}" | jq -r 'to_entries[] | "--metadata " + .key + "=\"" + (.value | tostring) + "\""')
        fi

        # Special handling for xref (comma-separated URLs)
        if [ -n "${INPUT_XREF}" ]; then
          IFS=',' read -ra XREF_URLS <<< "${INPUT_XREF}"
          for url in "${XREF_URLS[@]}"; do
            ARGS="$ARGS --xref '$url'"
          done
        fi

        echo "::debug::Generated arguments: $ARGS"
        echo "arguments=$ARGS" >> $GITHUB_OUTPUT
        echo "✅ Arguments built successfully"
      env:
        STEP_NORMALIZE_CONFIG_NORMALIZED: ${{ steps.normalize-config.outputs.normalized }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_WARNINGSASERRORS: ${{ inputs.warningsAsErrors }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_EXPORTRAWMODEL: ${{ inputs.exportRawModel }}
        INPUT_EXPORTVIEWMODEL: ${{ inputs.exportViewModel }}
        INPUT_DISABLEGITFEATURES: ${{ inputs.disableGitFeatures }}
        INPUT_DRYRUN: ${{ inputs.dryRun }}
        STEP_NORMALIZE_OUTPUT_NORMALIZED: ${{ steps.normalize-output.outputs.normalized }}
        INPUT_TEMPLATE: ${{ inputs.template }}
        STEP_NORMALIZE_DEBUGOUTPUT_NORMALIZED: ${{ steps.normalize-debugoutput.outputs.normalized }}
        STEP_NORMALIZE_RAWMODELOUTPUTFOLDER_NORMALIZED: ${{ steps.normalize-rawmodeloutputfolder.outputs.normalized }}
        STEP_NORMALIZE_VIEWMODELOUTPUTFOLDER_NORMALIZED: ${{ steps.normalize-viewmodeloutputfolder.outputs.normalized }}
        INPUT_MARKDOWNENGINEPROPERTIES: ${{ inputs.markdownEngineProperties }}
        INPUT_POSTPROCESSORS: ${{ inputs.postProcessors }}
        STEP_NORMALIZE_LOG_NORMALIZED: ${{ steps.normalize-log.outputs.normalized }}
        INPUT_LOGLEVEL: ${{ inputs.logLevel }}
        INPUT_THEME: ${{ inputs.theme }}
        INPUT_MAXPARALLELISM: ${{ inputs.maxParallelism }}
        INPUT_METADATA: ${{ inputs.metadata }}
        INPUT_XREF: ${{ inputs.xref }}

    # ================== 🚀 ==================

    - name: "📦 Install DocFX tool"
      uses: "laerdal/github_actions/dotnet-tool-install@main"
      with:
        tool-name: "docfx"
        global: ${{ inputs.global }}
        create-manifest-if-needed: "true"
        version: ${{ inputs.docfx-version }}

    - name: "📚 Generate documentation with DocFX"
      id: run-dotnet
      uses: "laerdal/github_actions/dotnet@main"
      with:
        command: "tool"
        working-directory: ${{ inputs.working-directory }}
        arguments: ${{ steps.build-args.outputs.arguments }}
        show-summary: "${{ inputs.show-summary }}"

    # ================== 🔍 ==================

    - name: "🔍 Verify documentation generation"
      id: verify-build
      shell: bash
      run: |
        echo "::debug::Verifying DocFX documentation generation..."

        OUTPUT_DIR="${STEP_NORMALIZE_OUTPUT_NORMALIZED}"

        # Check if output directory exists and has content
        if [ -d "$OUTPUT_DIR" ]; then
          FILE_COUNT=$(find "$OUTPUT_DIR" -type f | wc -l | tr -d ' ')
          echo "📁 Generated files: $FILE_COUNT"
          echo "files-generated=$FILE_COUNT" >> $GITHUB_OUTPUT

          # Check for common DocFX output files
          if [ -f "$OUTPUT_DIR/index.html" ]; then
            echo "✅ Main index.html found"
            echo "has-index=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No index.html found in output"
            echo "has-index=false" >> $GITHUB_OUTPUT
          fi

          echo "build-success=true" >> $GITHUB_OUTPUT
          echo "✅ Documentation generation verification completed"
        else
          echo "❌ Output directory not found: $OUTPUT_DIR"
          echo "files-generated=0" >> $GITHUB_OUTPUT
          echo "has-index=false" >> $GITHUB_OUTPUT
          echo "build-success=false" >> $GITHUB_OUTPUT
        fi
      env:
        STEP_NORMALIZE_OUTPUT_NORMALIZED: ${{ steps.normalize-output.outputs.normalized }}

    # ================== 📊 ==================

    - name: "📊 Action Summary"
      if: always() && inputs.show-summary == 'true'
      shell: bash
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        <details><summary>📄 DocFX Build</summary>

        ## 🔧 DocFX Configuration
        | Parameter | Value |
        |-----------|-------|
        | 📄 Config File | \`${STEP_NORMALIZE_CONFIG_NORMALIZED}\` |
        | 📁 Output Directory | \`${STEP_NORMALIZE_OUTPUT_NORMALIZED}\` |
        | 📊 Log Level | \`${INPUT_LOGLEVEL}\` |
        | 🎨 Template | \`${INPUT_TEMPLATE}\` |
        | 🎭 Theme | \`${INPUT_THEME}\` |
        | 🔧 Max Parallelism | \`${INPUT_MAXPARALLELISM}\` |
        | 🐛 Debug Mode | \`${INPUT_DEBUG}\` |
        | 🧪 Dry Run | \`${INPUT_DRYRUN}\` |
        | ⚠️ Warnings as Errors | \`${INPUT_WARNINGSASERRORS}\` |
        | 📝 Verbose Logging | \`${INPUT_VERBOSE}\` |

        ## 📊 Export Settings
        | Setting | Value |
        |---------|-------|
        | 🔍 Export Raw Model | \`${INPUT_EXPORTRAWMODEL}\` |
        | 📄 Export View Model | \`${INPUT_EXPORTVIEWMODEL}\` |
        | 🚫 Disable Git Features | \`${INPUT_DISABLEGITFEATURES}\` |

        ## ⚙️ Process Details
        | Step | Status |
        |------|--------|
        | ✅ Input Validation | \`✅ Completed\` |
        | 📦 Tool Installation | \`✅ Completed\` |
        | 🔧 Argument Building | \`${STEP_BUILD_ARGS_OUTCOME_LABEL}\` |
        | 📚 Documentation Generation | \`${STEP_RUN_DOTNET_OUTCOME_LABEL}\` |
        | 🔍 Build Verification | \`${STEP_VERIFY_BUILD_OUTCOME_LABEL}\` |

        ## 📤 Execution Results
        | Metric | Value |
        |--------|-------|
        | ✅ Exit Code | \`${STEP_RUN_DOTNET_EXIT_CODE}\` |
        | 📁 Files Generated | \`${STEP_VERIFY_BUILD_FILES_GENERATED}\` |
        | 🏠 Has Index Page | \`${STEP_VERIFY_BUILD_HAS_INDEX}\` |
        | ✅ Build Success | \`${STEP_VERIFY_BUILD_BUILD_SUCCESS}\` |
        | 🚀 Executed Command | \`${STEP_RUN_DOTNET_EXECUTED_COMMAND}\` |

        </details>
        EOF
      env:
        STEP_NORMALIZE_CONFIG_NORMALIZED: ${{ steps.normalize-config.outputs.normalized }}
        STEP_NORMALIZE_OUTPUT_NORMALIZED: ${{ steps.normalize-output.outputs.normalized }}
        INPUT_LOGLEVEL: ${{ inputs.logLevel }}
        INPUT_TEMPLATE: ${{ inputs.template || 'none' }}
        INPUT_THEME: ${{ inputs.theme }}
        INPUT_MAXPARALLELISM: ${{ inputs.maxParallelism }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_DRYRUN: ${{ inputs.dryRun }}
        INPUT_WARNINGSASERRORS: ${{ inputs.warningsAsErrors }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_EXPORTRAWMODEL: ${{ inputs.exportRawModel }}
        INPUT_EXPORTVIEWMODEL: ${{ inputs.exportViewModel }}
        INPUT_DISABLEGITFEATURES: ${{ inputs.disableGitFeatures }}
        STEP_BUILD_ARGS_OUTCOME_LABEL: ${{ steps.build-args.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_RUN_DOTNET_OUTCOME_LABEL: ${{ steps.run-dotnet.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_VERIFY_BUILD_OUTCOME_LABEL: ${{ steps.verify-build.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_RUN_DOTNET_EXIT_CODE: ${{ steps.run-dotnet.outputs.exit-code }}
        STEP_VERIFY_BUILD_FILES_GENERATED: ${{ steps.verify-build.outputs.files-generated }}
        STEP_VERIFY_BUILD_HAS_INDEX: ${{ steps.verify-build.outputs.has-index }}
        STEP_VERIFY_BUILD_BUILD_SUCCESS: ${{ steps.verify-build.outputs.build-success }}
        STEP_RUN_DOTNET_EXECUTED_COMMAND: ${{ steps.run-dotnet.outputs.executed-command }}

branding:
  icon: "book-open"
  color: "blue"

# dotnet docfx build --help
# USAGE:
#     docfx build [config] [OPTIONS]

# ARGUMENTS:
#     [config]    Path to docfx.json

# OPTIONS:
#     -h, --help                         Prints help information
#     -l, --log                          Save log as structured JSON to the specified file
#         --logLevel                     Set log level to error, warning, info, verbose or diagnostic
#         --verbose                      Set log level to verbose
#         --warningsAsErrors             Treats warnings as errors
#     -o, --output                       Specify the output base directory
#     -m, --metadata                     Specify a list of global metadata in key value pairs (e.g. --metadata _appTitle="My App" --metadata _disableContribution)
#     -x, --xref                         Specify the urls of xrefmap used by content files
#     -t, --template                     Specify the template name to apply to. If not specified, output YAML file will not be transformed
#         --theme                        Specify which theme to use. By default 'default' theme is offered
#     -s, --serve                        Host the generated documentation to a website
#     -n, --hostname                     Specify the hostname of the hosted website (e.g., 'localhost' or '*')
#     -p, --port                         Specify the port of the hosted website
#         --open-browser                 Open a web browser when the hosted website starts
#         --open-file <RELATIVE_PATH>     Open a file in a web browser when the hosted website starts
#         --debug                        Run in debug mode. With debug mode, raw model and view model will be exported automatically when it encounters error when applying templates. If not specified, it is false
#         --debugOutput                  The output folder for files generated for debugging purpose when in debug mode. If not specified, it is ${TempPath}/docfx
#         --exportRawModel               If set to true, data model to run template script will be extracted in .raw.model.json extension
#         --rawModelOutputFolder         Specify the output folder for the raw model. If not set, the raw model will be generated to the same folder as the output documentation
#         --viewModelOutputFolder        Specify the output folder for the view model. If not set, the view model will be generated to the same folder as the output documentation
#         --exportViewModel              If set to true, data model to apply template will be extracted in .view.model.json extension
#         --dryRun                       If set to true, template will not be actually applied to the documents. This option is always used with --exportRawModel or --exportViewModel is set so that only raw model files or view model files are generated
#         --maxParallelism               Set the max parallelism, 0 is auto
#         --markdownEngineProperties     Set the parameters for markdown engine, value should be a JSON string
#         --postProcessors               Set the order of post processors in plugins
#         --disableGitFeatures           Disable fetching Git related information for articles. By default it is enabled and may have side effect on performance when the repo is large
