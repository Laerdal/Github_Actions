name: "📄 Generate DocFX PDF"
description: "Generates PDF documentation using DocFX .NET Global Tool"
author: "Francois Raminosona"

inputs:
  # Arguments passed to dotnet
  working-directory:
    description: "Working directory for the command"
    required: false
    default: "."
  global:
    description: "Install the DocFX .NET global tool if not already installed"
    required: false
    default: "false"
  show-summary:
    description: "Whether to show the action summary"
    required: false
    default: "false"

  # Arguments unique to DocFX PDF
  config:
    description: "Path to the docfx configuration file (default: docfx.json)"
    required: false
    default: "docfx.json"
  output:
    description: "Specify the output base directory"
    required: false
    default: "_site"
  logLevel:
    description: "Set log level to error, warning, info, verbose or diagnostic"
    required: false
    default: "info"
  logFile:
    description: "Save log as structured JSON to the specified file"
    required: false
    default: ""
  verbose:
    description: "Set log level to verbose"
    required: false
    default: "false"
  warningsAsErrors:
    description: "Treats warnings as errors"
    required: false
    default: "false"
  docfx-version:
    description: "Version of DocFX tool to install"
    required: false
    default: ""

outputs:
  exit-code:
    description: "Exit code of the dotnet command"
    value: ${{ steps.run-dotnet.outputs.exit-code }}
  executed-command:
    description: "The actual command that was executed"
    value: ${{ steps.run-dotnet.outputs.executed-command }}
  output-path:
    description: "Full path to the generated PDF output directory"
    value: ${{ steps.build-args.outputs.output-path }}
  config-path:
    description: "Path to the DocFX configuration file used"
    value: ${{ steps.build-args.outputs.config-path }}
  pdf-files:
    description: "List of generated PDF files"
    value: ${{ steps.analyze.outputs.pdf-files }}
  files-count:
    description: "Number of PDF files generated"
    value: ${{ steps.analyze.outputs.files-count }}
  output-size:
    description: "Total size of the output directory in bytes"
    value: ${{ steps.analyze.outputs.output-size }}

runs:
  using: "composite"
  steps:

    # ================== ℹ️ ==================

    - name: "ℹ️ Gather environment information"
      shell: bash
      run: |
        echo "::debug::Operating System: $(uname -a)"
        echo "::debug::GitHub Runner OS: $RUNNER_OS"
        echo "::debug::GitHub Runner Version: $RUNNER_VERSION"
        echo "::debug::.NET SDK Version: $(dotnet --version || echo 'Not installed')"

    # ================== 🔒 ==================

    - name: "🔒 Mask sensitive data"
      shell: bash
      run: |
        # No sensitive inputs to mask in this action
        echo "✅ No sensitive data to mask"

    # ================== 📁 ==================

    - name: "📁 Normalize config path"
      id: normalize-config
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.config }}

    - name: "📁 Normalize output path"
      id: normalize-output
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.output }}

    # ================== ✅ ==================

    - name: "✅ Validate input : booleans"
      shell: bash
      run: |
        echo "::debug::Validating boolean inputs for DocFX PDF generation"

        for param in verbose warningsAsErrors; do
          case $param in
            verbose) value="${INPUT_VERBOSE}" ;;
            warningsAsErrors) value="${INPUT_WARNINGSASERRORS}" ;;
          esac
          if [ -n "$value" ] && [ "$value" != "true" ] && [ "$value" != "false" ]; then
            echo "::error::Parameter $param must be 'true' or 'false', got: $value"
            exit 1
          fi
        done

        echo "✅ Boolean input validation completed successfully"
      env:
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_WARNINGSASERRORS: ${{ inputs.warningsAsErrors }}

    - name: "✅ Validate input : config"
      if: ${{ inputs.config != '' }}
      shell: bash
      run: |
        echo "::debug::Validating config input for DocFX PDF generation"

        if [ ! -f "${STEP_NORMALIZE_CONFIG_NORMALIZED}" ]; then
          echo "::error file=${STEP_NORMALIZE_CONFIG_NORMALIZED}::DocFX configuration file not found: ${STEP_NORMALIZE_CONFIG_NORMALIZED}"
          exit 1
        fi

        echo "✅ Config input validation completed successfully"
      env:
        STEP_NORMALIZE_CONFIG_NORMALIZED: ${{ steps.normalize-config.outputs.normalized }}

    - name: "✅ Validate input : logLevel"
      if: ${{ inputs.logLevel != '' && inputs.logLevel != 'info' }}
      shell: bash
      run: |
        echo "::debug::Validating logLevel input for DocFX PDF generation"

        case "${INPUT_LOGLEVEL}" in
          error|warning|info|verbose|diagnostic) ;;
          *) echo "::error::Invalid logLevel. Must be one of: error, warning, info, verbose, diagnostic"; exit 1 ;;
        esac

        echo "✅ Log-level input validation completed successfully"
      env:
        INPUT_LOGLEVEL: ${{ inputs.logLevel }}

    - name: "✅ Validate input : docfx-version"
      if: ${{ inputs.docfx-version != '' }}
      shell: bash
      run: |
        echo "::debug::Validating docfx-version input for DocFX PDF generation"

        if ! [[ "${INPUT_DOCFX_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::warning::Version format may be invalid. Expected format: X.Y.Z, got: ${INPUT_DOCFX_VERSION}"
        fi

        echo "✅ docfx-version input validation completed successfully"
      env:
        INPUT_DOCFX_VERSION: ${{ inputs.docfx-version }}

    # ================== 🏗️ ==================

    - name: "🔧 Build arguments"
      id: build-args
      shell: bash
      run: |
        echo "::debug::Building arguments for DocFX PDF generation"

        # Start with base command
        ARGS="run docfx pdf"

        # Add config file path
        if [ -n "${STEP_NORMALIZE_CONFIG_NORMALIZED}" ]; then
          ARGS="$ARGS '${STEP_NORMALIZE_CONFIG_NORMALIZED}'"
        fi
        CONFIG_PATH="${STEP_NORMALIZE_CONFIG_NORMALIZED}"
        echo "config-path=$CONFIG_PATH" >> $GITHUB_OUTPUT

        # Add output directory
        if [ -n "${STEP_NORMALIZE_OUTPUT_NORMALIZED}" ]; then
          ARGS="$ARGS --output '${STEP_NORMALIZE_OUTPUT_NORMALIZED}'"
        fi
        OUTPUT_PATH="${STEP_NORMALIZE_OUTPUT_NORMALIZED}"
        echo "output-path=$OUTPUT_PATH" >> $GITHUB_OUTPUT

        # Boolean flags
        for param in verbose warningsAsErrors; do
          case $param in
            verbose) value="${INPUT_VERBOSE}" ;;
            warningsAsErrors) value="${INPUT_WARNINGSASERRORS}" ;;
          esac
          if [ "$value" == "true" ]; then
            ARGS="$ARGS --${param}"
          fi
        done

        # Handle parameters with meaningful defaults
        if [ "${INPUT_LOGLEVEL}" != "info" ]; then
          ARGS="$ARGS --logLevel '${INPUT_LOGLEVEL}'"
        fi

        # Log file
        if [ -n "${INPUT_LOGFILE}" ]; then
          ARGS="$ARGS --log '${INPUT_LOGFILE}'"
        fi

        echo "::debug::Generated arguments: $ARGS"
        echo "arguments=$ARGS" >> $GITHUB_OUTPUT
        echo "✅ Arguments built successfully"
      env:
        STEP_NORMALIZE_CONFIG_NORMALIZED: ${{ steps.normalize-config.outputs.normalized }}
        STEP_NORMALIZE_OUTPUT_NORMALIZED: ${{ steps.normalize-output.outputs.normalized }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_WARNINGSASERRORS: ${{ inputs.warningsAsErrors }}
        INPUT_LOGLEVEL: ${{ inputs.logLevel }}
        INPUT_LOGFILE: ${{ inputs.logFile }}

    # ================== 🚀 ==================

    - name: "📦 Install DocFX tool"
      uses: "laerdal/github_actions/dotnet-tool-install@main"
      with:
        tool-name: "docfx"
        global: ${{ inputs.global }}
        create-manifest-if-needed: "true"
        version: ${{ inputs.docfx-version }}

    - name: "📄 Generate PDF with DocFX"
      id: run-dotnet
      uses: "laerdal/github_actions/dotnet@main"
      with:
        command: "tool"
        working-directory: ${{ inputs.working-directory }}
        arguments: ${{ steps.build-args.outputs.arguments }}
        show-summary: "${{ inputs.show-summary }}"

    # ================== 🔍 ==================

    - name: "📊 Analyze generated PDF files"
      id: analyze
      shell: bash
      run: |
        echo "📊 Analyzing generated PDF files..."

        OUTPUT_DIR="${STEP_BUILD_ARGS_OUTPUT_PATH}"

        if [ -d "$OUTPUT_DIR" ]; then
          # Find PDF files
          PDF_FILES=$(find "$OUTPUT_DIR" -name "*.pdf" -type f)
          FILES_COUNT=$(echo "$PDF_FILES" | grep -c . || echo "0")

          echo "📄 PDF files generated: $FILES_COUNT"
          echo "files-count=$FILES_COUNT" >> $GITHUB_OUTPUT

          # Create comma-separated list of PDF files
          if [ -n "$PDF_FILES" ]; then
            PDF_LIST=$(echo "$PDF_FILES" | tr '\n' ',')
            PDF_LIST=${PDF_LIST%,}  # Remove trailing comma
            echo "pdf-files=$PDF_LIST" >> $GITHUB_OUTPUT
          else
            echo "pdf-files=" >> $GITHUB_OUTPUT
          fi

          # Calculate total size
          if command -v du >/dev/null 2>&1; then
            if du -sb "$OUTPUT_DIR" >/dev/null 2>&1; then
              # GNU du
              OUTPUT_SIZE=$(du -sb "$OUTPUT_DIR" | cut -f1)
            else
              # BSD du (macOS)
              OUTPUT_SIZE=$(du -sk "$OUTPUT_DIR" | cut -f1)
              OUTPUT_SIZE=$((OUTPUT_SIZE * 1024))
            fi
          else
            OUTPUT_SIZE="unknown"
          fi

          echo "📏 Total output size: $OUTPUT_SIZE bytes"
          echo "output-size=$OUTPUT_SIZE" >> $GITHUB_OUTPUT

          # List PDF files with sizes
          if [ -n "$PDF_FILES" ]; then
            echo "📋 Generated PDF files:"
            echo "$PDF_FILES" | while read -r file; do
              if [ -f "$file" ]; then
                SIZE=$(wc -c < "$file" 2>/dev/null || echo "unknown")
                echo "  📄 $file ($SIZE bytes)"
              fi
            done
          else
            echo "::warning::No PDF files were generated"
          fi

        else
          echo "::error::Output directory not found: $OUTPUT_DIR"
          echo "files-count=0" >> $GITHUB_OUTPUT
          echo "output-size=0" >> $GITHUB_OUTPUT
          echo "pdf-files=" >> $GITHUB_OUTPUT
        fi
      env:
        STEP_BUILD_ARGS_OUTPUT_PATH: ${{ steps.build-args.outputs.output-path }}

    # ================== 📊 ==================

    - name: "📊 Action Summary"
      if: always() && inputs.show-summary == 'true'
      shell: bash
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        <details><summary>📄 DocFX PDF</summary>

        ## 🔧 Input Parameters
        | Parameter | Value |
        |-----------|-------|
        | 📋 Config File | \`${STEP_NORMALIZE_CONFIG_NORMALIZED}\` |
        | 📁 Output Directory | \`${STEP_NORMALIZE_OUTPUT_NORMALIZED}\` |
        | 📊 Log Level | \`${INPUT_LOGLEVEL}\` |

        ## 📤 Generation Results
        | Metric | Value |
        |--------|-------|
        | 📁 Output Path | \`${STEP_BUILD_ARGS_OUTPUT_PATH}\` |
        | 📋 Config Path | \`${STEP_BUILD_ARGS_CONFIG_PATH}\` |
        | 📄 PDF Files Generated | \`${STEP_ANALYZE_FILES_COUNT}\` |
        | 📏 Total Size | \`${STEP_ANALYZE_OUTPUT_SIZE} bytes\` |

        ## 📄 Generated PDF Files
        | File | Status |
        |------|--------|
        ${STEP_ANALYZE_PDF_FILES_LABEL}

        ## ⚙️ Configuration Options
        | Option | Status |
        |--------|--------|
        | 🔍 Verbose Logging | \`${INPUT_VERBOSE}\` |
        | ⚠️ Warnings as Errors | \`${INPUT_WARNINGSASERRORS}\` |

        ## 🔧 Process Details
        | Step | Status |
        |------|--------|
        | ✅ Input Validation | \`✅ Completed\` |
        | 📦 Tool Installation | \`✅ Completed\` |
        | � Argument Building | \`${STEP_BUILD_ARGS_OUTCOME_LABEL}\` |
        | �📄 PDF Generation | \`${STEP_RUN_DOTNET_OUTCOME_LABEL}\` |
        | 📊 Output Analysis | \`${STEP_ANALYZE_OUTCOME_LABEL}\` |

        </details>
        EOF
      env:
        STEP_NORMALIZE_CONFIG_NORMALIZED: ${{ steps.normalize-config.outputs.normalized }}
        STEP_NORMALIZE_OUTPUT_NORMALIZED: ${{ steps.normalize-output.outputs.normalized }}
        INPUT_LOGLEVEL: ${{ inputs.logLevel }}
        STEP_BUILD_ARGS_OUTPUT_PATH: ${{ steps.build-args.outputs.output-path }}
        STEP_BUILD_ARGS_CONFIG_PATH: ${{ steps.build-args.outputs.config-path }}
        STEP_ANALYZE_FILES_COUNT: ${{ steps.analyze.outputs.files-count }}
        STEP_ANALYZE_OUTPUT_SIZE: ${{ steps.analyze.outputs.output-size }}
        STEP_ANALYZE_PDF_FILES_LABEL: ${{ steps.analyze.outputs.pdf-files != '' && steps.analyze.outputs.pdf-files || '| No PDF files generated | ❌ |' }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_WARNINGSASERRORS: ${{ inputs.warningsAsErrors }}
        STEP_BUILD_ARGS_OUTCOME_LABEL: ${{ steps.build-args.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_RUN_DOTNET_OUTCOME_LABEL: ${{ steps.run-dotnet.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_ANALYZE_OUTCOME_LABEL: ${{ steps.analyze.outcome == 'success' && '✅ Completed' || '❌ Failed' }}

branding:
  icon: "file-text"
  color: "blue"
