name: "📦 Pack .NET Project"
description: "Pack .NET projects into NuGet packages with comprehensive configuration options"
author: "Francois Raminosona"

inputs:
  # Arguments passed to dotnet
  path:
    description: "Path to the project file, solution file, or directory to operate on"
    required: false
    default: ""
  arguments:
    description: "Additional arguments to pass to the dotnet command"
    required: false
    default: ""
  working-directory:
    description: "Working directory for the command"
    required: false
    default: "."
  verbosity:
    description: "Force a specific verbosity level (overrides auto-detection)"
    required: false
    default: ""
  nologo:
    description: "Suppress the Microsoft logo and startup information"
    required: false
    default: "true"
  no-restore:
    description: "Skip automatic restore"
    required: false
    default: "false"
  no-build:
    description: "Skip building the project before packing"
    required: false
    default: "false"
  configuration:
    description: "Build configuration to use (e.g., 'Debug', 'Release')"
    required: false
    default: "Release"
  output:
    description: "Output directory to place built packages in"
    required: false
    default: ""
  artifacts-path:
    description: "The artifacts path. All output from the project, including build, publish, and pack output, will go in subfolders under the specified path."
    required: false
    default: ""
  show-summary:
    description: "Whether to show the action summary"
    required: false
    default: "false"

  # Arguments unique to pack command
  include-symbols:
    description: "Include packages with symbols in addition to regular packages in output directory"
    required: false
    default: "false"
  include-source:
    description: "Include PDBs and source files. Source files go into the 'src' folder in the resulting nuget package"
    required: false
    default: "false"
  serviceable:
    description: "Set the serviceable flag in the package"
    required: false
    default: "false"
  version-suffix:
    description: "Set the value of the $(VersionSuffix) property to use when building the project"
    required: false
    default: ""
  disable-build-servers:
    description: "Force ignoring any persistent build servers"
    required: false
    default: "false"
  use-current-runtime:
    description: "Use current runtime as the target runtime"
    required: false
    default: "false"

outputs:
  exit-code:
    description: "Exit code of the dotnet pack command"
    value: ${{ steps.run-dotnet.outputs.exit-code }}
  executed-command:
    description: "The actual command that was executed"
    value: ${{ steps.run-dotnet.outputs.executed-command }}
  packages:
    description: "Semicolon-separated list of generated package files"
    value: ${{ steps.find-packages.outputs.packages }}
  package-count:
    description: "Number of packages generated"
    value: ${{ steps.find-packages.outputs.package-count }}
  output-directory:
    description: "Directory where packages were generated"
    value: ${{ steps.find-packages.outputs.output-directory }}

runs:
  using: "composite"
  steps:

    # ================== ℹ️ ==================

    - name: "ℹ️ Gather environment information"
      shell: bash
      run: |
        echo "::debug::Operating System: $(uname -a)"
        echo "::debug::GitHub Runner OS: $RUNNER_OS"
        echo "::debug::GitHub Runner Version: $RUNNER_VERSION"
        echo "::debug::.NET SDK Version: $(dotnet --version || echo 'Not installed')"

    # ================== 🔒 ==================

    - name: "🔒 Mask sensitive data"
      shell: bash
      run: |
        # No sensitive inputs to mask in this action
        echo "✅ No sensitive data to mask"

    # ================== 📁 ==================

    - name: "💯 Normalize arguments"
      id: normalize-arguments
      uses: laerdal/github_actions/normalize-arguments@main
      with:
        arguments: ${{ inputs.arguments }}

    - name: "📁 Normalize path"
      id: normalize-path
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.path }}

    - name: "📁 Normalize output"
      id: normalize-output
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.output }}

    - name: "📁 Normalize artifacts-path"
      id: normalize-artifacts
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.artifacts-path }}

    # ================== ✅ ==================

    - name: "✅ Validate input : path"
      if: ${{ inputs.path != '' }}
      shell: bash
      run: |
        echo "::debug::Validating path input: ${STEP_NORMALIZE_PATH_NORMALIZED}"

        if [ "${STEP_NORMALIZE_PATH_EXISTS}" != "true" ]; then
          echo "::error file=${STEP_NORMALIZE_PATH_NORMALIZED}::Specified path does not exist: ${STEP_NORMALIZE_PATH_NORMALIZED}"
          exit 1
        fi

        echo "✅ Path validation completed successfully"
      env:
        STEP_NORMALIZE_PATH_NORMALIZED: ${{ steps.normalize-path.outputs.normalized }}
        STEP_NORMALIZE_PATH_EXISTS: ${{ steps.normalize-path.outputs.exists }}

    - name: "✅ Validate input : booleans"
      shell: bash
      run: |
        echo "::debug::Validating boolean inputs..."
        for param in include-symbols include-source serviceable disable-build-servers use-current-runtime; do
          case $param in
            include-symbols) value="${INPUT_INCLUDE_SYMBOLS}" ;;
            include-source) value="${INPUT_INCLUDE_SOURCE}" ;;
            serviceable) value="${INPUT_SERVICEABLE}" ;;
            disable-build-servers) value="${INPUT_DISABLE_BUILD_SERVERS}" ;;
            use-current-runtime) value="${INPUT_USE_CURRENT_RUNTIME}" ;;
          esac
          if [ -n "$value" ] && [ "$value" != "true" ] && [ "$value" != "false" ]; then
            echo "::error::Parameter $param must be 'true' or 'false', got: $value"
            exit 1
          fi
        done

        echo "✅ Boolean inputs validation completed successfully"
      env:
        INPUT_INCLUDE_SYMBOLS: ${{ inputs.include-symbols }}
        INPUT_INCLUDE_SOURCE: ${{ inputs.include-source }}
        INPUT_SERVICEABLE: ${{ inputs.serviceable }}
        INPUT_DISABLE_BUILD_SERVERS: ${{ inputs.disable-build-servers }}
        INPUT_USE_CURRENT_RUNTIME: ${{ inputs.use-current-runtime }}

    - name: "✅ Validate input : version-suffix"
      if: ${{ inputs.version-suffix != '' }}
      shell: bash
      run: |
        echo "::debug::Validating version-suffix input: ${INPUT_VERSION_SUFFIX}"

        # Version suffix should not contain spaces or special characters that could break versioning
        if [[ "${INPUT_VERSION_SUFFIX}" =~ [[:space:]] ]]; then
          echo "::error::Version suffix cannot contain spaces: ${INPUT_VERSION_SUFFIX}"
          exit 1
        fi

        # Version suffix should start with alphanumeric character
        if [[ ! "${INPUT_VERSION_SUFFIX}" =~ ^[a-zA-Z0-9] ]]; then
          echo "::error::Version suffix should start with alphanumeric character: ${INPUT_VERSION_SUFFIX}"
          exit 1
        fi

        echo "✅ Version suffix validation completed successfully"
      env:
        INPUT_VERSION_SUFFIX: ${{ inputs.version-suffix }}

    # ================== 🏗️ ==================

    - name: "🏗️ Build argument list"
      id: build-args
      shell: bash
      run: |
        echo "::debug::Building argument list..."

        # Start with base arguments
        ARGUMENTS=""

        # Boolean flags
        for param in include-symbols include-source serviceable disable-build-servers use-current-runtime; do
          case $param in
            include-symbols) value="${INPUT_INCLUDE_SYMBOLS}" ;;
            include-source) value="${INPUT_INCLUDE_SOURCE}" ;;
            serviceable) value="${INPUT_SERVICEABLE}" ;;
            disable-build-servers) value="${INPUT_DISABLE_BUILD_SERVERS}" ;;
            use-current-runtime) value="${INPUT_USE_CURRENT_RUNTIME}" ;;
          esac
          if [ "$value" = "true" ]; then
            case $param in
              use-current-runtime) ARGUMENTS="$ARGUMENTS --ucr" ;;
              *) ARGUMENTS="$ARGUMENTS --$param" ;;
            esac
          fi
        done

        # Key-value options
        for param in version-suffix; do
          case $param in
            version-suffix) value="${INPUT_VERSION_SUFFIX}" ;;
          esac
          if [ -n "$value" ]; then
            ARGUMENTS="$ARGUMENTS --$param '$value'"
          fi
        done

        # Add normalized arguments
        if [ -n "${STEP_NORMALIZE_ARGUMENTS_NORMALIZED}" ]; then
          NORMALIZED_ARGS="${STEP_NORMALIZE_ARGUMENTS_NORMALIZED}"
          echo "::debug::Original arguments: ${INPUT_ARGUMENTS}"
          echo "::debug::Normalized arguments: $NORMALIZED_ARGS"
          ARGUMENTS="$ARGUMENTS $NORMALIZED_ARGS"
        fi

        # Trim leading space
        ARGUMENTS="${ARGUMENTS# }"

        # Output the final argument list
        echo "arguments=$ARGUMENTS" >> $GITHUB_OUTPUT

        echo "✅ Argument list built successfully: $ARGUMENTS"
      env:
        INPUT_INCLUDE_SYMBOLS: ${{ inputs.include-symbols }}
        INPUT_INCLUDE_SOURCE: ${{ inputs.include-source }}
        INPUT_SERVICEABLE: ${{ inputs.serviceable }}
        INPUT_DISABLE_BUILD_SERVERS: ${{ inputs.disable-build-servers }}
        INPUT_USE_CURRENT_RUNTIME: ${{ inputs.use-current-runtime }}
        INPUT_VERSION_SUFFIX: ${{ inputs.version-suffix }}
        STEP_NORMALIZE_ARGUMENTS_NORMALIZED: ${{ steps.normalize-arguments.outputs.normalized }}
        INPUT_ARGUMENTS: ${{ inputs.arguments }}

    # ================== 🚀 ==================

    - name: "📦 Run .NET pack"
      id: run-dotnet
      uses: "laerdal/github_actions/dotnet@main"
      with:
        command: "pack"
        path: ${{ steps.normalize-path.outputs.normalized }}
        artifacts-path: ${{ steps.normalize-artifacts.outputs.normalized }}
        output: ${{ steps.normalize-output.outputs.normalized }}
        arguments: ${{ steps.build-args.outputs.arguments }}
        working-directory: ${{ inputs.working-directory }}
        verbosity: ${{ inputs.verbosity }}
        nologo: ${{ inputs.nologo }}
        no-restore: ${{ inputs.no-restore }}
        no-build: ${{ inputs.no-build }}
        configuration: ${{ inputs.configuration }}
        show-summary: ${{ inputs.show-summary }}

    # ================== 🔍 ==================

    - name: "🔍 Find generated packages"
      id: find-packages
      shell: bash
      run: |
        echo "::debug::Searching for generated NuGet packages..."

        # Determine the search directory based on inputs
        SEARCH_DIR="${INPUT_WORKING_DIRECTORY}"
        if [ -n "${STEP_NORMALIZE_OUTPUT_NORMALIZED}" ]; then
          SEARCH_DIR="${STEP_NORMALIZE_OUTPUT_NORMALIZED}"
        elif [ -n "${STEP_NORMALIZE_ARTIFACTS_NORMALIZED}" ]; then
          SEARCH_DIR="${STEP_NORMALIZE_ARTIFACTS_NORMALIZED}"
        fi

        echo "::debug::Searching in directory: $SEARCH_DIR"

        # Find all .nupkg files (including symbol packages)
        PACKAGES=""
        PACKAGE_COUNT=0

        if [ -d "$SEARCH_DIR" ]; then
          # Use find to locate .nupkg files recursively
          while IFS= read -r -d '' package; do
            if [ -z "$PACKAGES" ]; then
              PACKAGES="$package"
            else
              PACKAGES="$PACKAGES;$package"
            fi
            PACKAGE_COUNT=$((PACKAGE_COUNT + 1))
            echo "📦 Found package: $package"
          done < <(find "$SEARCH_DIR" -name "*.nupkg" -type f -print0 2>/dev/null)
        fi

        # Set outputs
        echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
        echo "package-count=$PACKAGE_COUNT" >> $GITHUB_OUTPUT
        echo "output-directory=$SEARCH_DIR" >> $GITHUB_OUTPUT

        if [ $PACKAGE_COUNT -eq 0 ]; then
          echo "::warning::No NuGet packages found in $SEARCH_DIR"
        else
          echo "✅ Found $PACKAGE_COUNT NuGet package(s)"
        fi

        echo "✅ Package discovery completed successfully"
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        STEP_NORMALIZE_OUTPUT_NORMALIZED: ${{ steps.normalize-output.outputs.normalized }}
        STEP_NORMALIZE_ARTIFACTS_NORMALIZED: ${{ steps.normalize-artifacts.outputs.normalized }}

    # ================== 📊 ==================

    - name: "📊 Action Summary"
      if: always() && inputs.show-summary == 'true'
      shell: bash
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        <details><summary>📦 .NET Pack : ${STEP_FIND_PACKAGES_PACKAGE_COUNT} package(s)</summary>

        ## 🔧 Input Parameters
        | Parameter | Value |
        |-----------|-------|
        | � Path | \`${STEP_NORMALIZE_PATH_NORMALIZED}\` |
        | 📁 Working Directory | \`${INPUT_WORKING_DIRECTORY}\` |
        | ⚙️ Configuration | \`${INPUT_CONFIGURATION}\` |
        | 🔧 Arguments | \`${STEP_NORMALIZE_ARGUMENTS_NORMALIZED}\` |
        | 📤 Output Path | \`${STEP_NORMALIZE_OUTPUT_NORMALIZED}\` |
        | 🗂️ Artifacts Path | \`${STEP_NORMALIZE_ARTIFACTS_NORMALIZED}\` |
        | �🔢 Version Suffix | \`${INPUT_VERSION_SUFFIX}\` |
        | 🔍 Include Symbols | \`${INPUT_INCLUDE_SYMBOLS}\` |
        | 📝 Include Source | \`${INPUT_INCLUDE_SOURCE}\` |
        | ⚙️ Serviceable | \`${INPUT_SERVICEABLE}\` |
        | 🏃 Use Current Runtime | \`${INPUT_USE_CURRENT_RUNTIME}\` |
        | 🚫 Disable Build Servers | \`${INPUT_DISABLE_BUILD_SERVERS}\` |

        ## 📦 Generated Packages
        | Metric | Value |
        |--------|-------|
        | 📊 Package Count | \`${STEP_FIND_PACKAGES_PACKAGE_COUNT}\` |
        | 📂 Output Directory | \`${STEP_FIND_PACKAGES_OUTPUT_DIRECTORY}\` |
        | ✅ Exit Code | \`${STEP_RUN_DOTNET_EXIT_CODE}\` |

        ## 📋 Package List
        EOF

        # Add package list to summary
        if [ -n "${STEP_FIND_PACKAGES_PACKAGES}" ]; then
          IFS=';' read -ra PACKAGES <<< "${STEP_FIND_PACKAGES_PACKAGES}"
          for package in "${PACKAGES[@]}"; do
            package_name=$(basename "$package")
            echo "| 📦 | \`$package_name\` |" >> $GITHUB_STEP_SUMMARY
          done
        else
          echo "| ⚠️ | No packages generated |" >> $GITHUB_STEP_SUMMARY
        fi

        cat >> $GITHUB_STEP_SUMMARY << EOF

        ## ⚙️ Process Details
        | Step | Status |
        |------|--------|
        | ✅ Input Validation | \`✅ Completed\` |
        | 🏗️ Argument Building | \`${STEP_BUILD_ARGS_OUTCOME_LABEL}\` |
        | 📦 Pack Execution | \`${STEP_RUN_DOTNET_OUTCOME_LABEL}\` |
        | 🔍 Package Discovery | \`${STEP_FIND_PACKAGES_OUTCOME_LABEL}\` |

        </details>
        EOF
      env:
        STEP_FIND_PACKAGES_PACKAGE_COUNT: ${{ steps.find-packages.outputs.package-count }}
        STEP_NORMALIZE_PATH_NORMALIZED: ${{ steps.normalize-path.outputs.normalized || 'none' }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_CONFIGURATION: ${{ inputs.configuration }}
        STEP_NORMALIZE_ARGUMENTS_NORMALIZED: ${{ steps.normalize-arguments.outputs.normalized || 'none' }}
        STEP_NORMALIZE_OUTPUT_NORMALIZED: ${{ steps.normalize-output.outputs.normalized || 'none' }}
        STEP_NORMALIZE_ARTIFACTS_NORMALIZED: ${{ steps.normalize-artifacts.outputs.normalized || 'none' }}
        INPUT_VERSION_SUFFIX: ${{ inputs.version-suffix || 'none' }}
        INPUT_INCLUDE_SYMBOLS: ${{ inputs.include-symbols }}
        INPUT_INCLUDE_SOURCE: ${{ inputs.include-source }}
        INPUT_SERVICEABLE: ${{ inputs.serviceable }}
        INPUT_USE_CURRENT_RUNTIME: ${{ inputs.use-current-runtime }}
        INPUT_DISABLE_BUILD_SERVERS: ${{ inputs.disable-build-servers }}
        STEP_FIND_PACKAGES_OUTPUT_DIRECTORY: ${{ steps.find-packages.outputs.output-directory }}
        STEP_RUN_DOTNET_EXIT_CODE: ${{ steps.run-dotnet.outputs.exit-code }}
        STEP_FIND_PACKAGES_PACKAGES: ${{ steps.find-packages.outputs.packages }}
        STEP_BUILD_ARGS_OUTCOME_LABEL: ${{ steps.build-args.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_RUN_DOTNET_OUTCOME_LABEL: ${{ steps.run-dotnet.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_FIND_PACKAGES_OUTCOME_LABEL: ${{ steps.find-packages.outcome == 'success' && '✅ Completed' || '❌ Failed' }}

branding:
  icon: "package"
  color: "blue"
