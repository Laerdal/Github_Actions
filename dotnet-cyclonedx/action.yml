name: "📄 Generate CycloneDX SBOM"
description: "Generates Software Bill of Materials (SBOM) using CycloneDX .NET Global Tool"
author: "Francois Raminosona"

inputs:
  # Arguments passed to dotnet
  path:
    description: "Path to .sln, .slnf, .slnx, .csproj, .fsproj, .vbproj, .xsproj, packages.config file or directory"
    required: false
    default: ""
  working-directory:
    description: "Working directory for the command"
    required: false
    default: "."
  framework:
    description: "Target framework to use (e.g., 'net8.0'). If not defined, all will be aggregated"
    required: false
    default: ""
  runtime:
    description: "Runtime to use (e.g., 'win-x64'). If not defined, all will be aggregated"
    required: false
    default: ""
  output:
    description: "Directory to write the BOM"
    required: false
    default: ""
  global:
    description: "Install the CycloneDX .NET global tool if not already installed"
    required: false
    default: "false"
  show-summary:
    description: "Whether to show the action summary"
    required: false
    default: "false"

  # Arguments unique to CycloneDX
  filename:
    description: "Filename for the BOM (default: bom.xml or bom.json)"
    required: false
    default: ""
  output-format:
    description: "BOM output format (Auto, Json, UnsafeJson, Xml)"
    required: false
    default: "Auto"
  exclude-dev:
    description: "Exclude development dependencies from the BOM"
    required: false
    default: "false"
  exclude-test-projects:
    description: "Exclude test projects from the BOM"
    required: false
    default: "false"
  url:
    description: "Alternative NuGet repository URL"
    required: false
    default: ""
  baseUrlUsername:
    description: "Alternative NuGet repository username"
    required: false
    default: ""
  baseUrlUserPassword:
    description: "Alternative NuGet repository password/apikey"
    required: false
    default: ""
  isBaseUrlPasswordClearText:
    description: "Alternative NuGet repository password is cleartext"
    required: false
    default: "false"
  recursive:
    description: "Recursively scan project references of the supplied project file"
    required: false
    default: "false"
  no-serial-number:
    description: "Omit the serial number from the resulting BOM"
    required: false
    default: "false"
  github-username:
    description: "GitHub username for license resolution"
    required: false
    default: ""
  github-token:
    description: "GitHub personal access token for license resolution"
    required: false
    default: ""
  github-bearer-token:
    description: "GitHub bearer token for license resolution (useful in GitHub actions)"
    required: false
    default: ""
  enable-github-licenses:
    description: "Enable GitHub license resolution"
    required: false
    default: "false"
  disable-package-restore:
    description: "Disable package restore"
    required: false
    default: "false"
  disable-hash-computation:
    description: "Disable hash computation for packages"
    required: false
    default: "false"
  dotnet-command-timeout:
    description: "dotnet command timeout in milliseconds (default: 300000)"
    required: false
    default: "300000"
  base-intermediate-output-path:
    description: "Folder for customized build environment (required if 'obj' folder is relocated)"
    required: false
    default: ""
  import-metadata-path:
    description: "Metadata template path with project specific details"
    required: false
    default: ""
  include-project-references:
    description: "Include project references as components (only for project files)"
    required: false
    default: "false"
  set-name:
    description: "Override the autogenerated BOM metadata component name"
    required: false
    default: ""
  set-version:
    description: "Override the default BOM metadata component version (defaults to 0.0.0)"
    required: false
    default: ""
  set-type:
    description: "Override the default BOM metadata component type"
    required: false
    default: "Application"
  set-nuget-purl:
    description: "Override the default BOM metadata component bom ref and PURL as NuGet package"
    required: false
    default: "false"
  spec-version:
    description: "Which version of the CycloneDX spec to use (1.0, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7) - if not set, the CycloneDX tool default is used"
    required: false
    default: ""
  exclude-filter:
    description: "Comma separated list of dependencies to exclude (e.g., 'name1@version1,name2@version2')"
    required: false
    default: ""

outputs:
  exit-code:
    description: "Exit code of the dotnet command"
    value: ${{ steps.run-dotnet.outputs.exit-code }}
  executed-command:
    description: "The actual command that was executed"
    value: ${{ steps.run-dotnet.outputs.executed-command }}
  sbom-generated:
    description: "Whether the SBOM file was successfully generated"
    value: ${{ steps.verify-sbom.outputs.sbom-generated }}
  sbom-file:
    description: "Path to the generated SBOM file"
    value: ${{ steps.verify-sbom.outputs.sbom-file }}
  sbom-size:
    description: "Size of the generated SBOM file in bytes"
    value: ${{ steps.verify-sbom.outputs.sbom-size }}
  sbom-valid:
    description: "Whether the generated SBOM appears to be valid"
    value: ${{ steps.verify-sbom.outputs.sbom-valid }}

runs:
  using: "composite"
  steps:

    # ================== ℹ️ ==================

    - name: "ℹ️ Gather environment information"
      shell: bash
      run: |
        echo "::debug::Operating System: $(uname -a)"
        echo "::debug::GitHub Runner OS: $RUNNER_OS"
        echo "::debug::GitHub Runner Version: $RUNNER_VERSION"
        echo "::debug::.NET SDK Version: $(dotnet --version || echo 'Not installed')"

    # ================== 🔒 ==================

    - name: "🔒 Mask sensitive data"
      shell: bash
      run: |
        if [ -n "${INPUT_BASEURLUSERPASSWORD}" ]; then
          echo "::add-mask::${INPUT_BASEURLUSERPASSWORD}"
        fi
        if [ -n "${INPUT_BASEURLUSERNAME}" ]; then
          echo "::add-mask::${INPUT_BASEURLUSERNAME}"
        fi
        if [ -n "${INPUT_GITHUB_TOKEN}" ]; then
          echo "::add-mask::${INPUT_GITHUB_TOKEN}"
        fi
        if [ -n "${INPUT_GITHUB_BEARER_TOKEN}" ]; then
          echo "::add-mask::${INPUT_GITHUB_BEARER_TOKEN}"
        fi

        echo "✅ Masked sensitive inputs"
      env:
        INPUT_BASEURLUSERPASSWORD: ${{ inputs.baseUrlUserPassword }}
        INPUT_BASEURLUSERNAME: ${{ inputs.baseUrlUsername }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_GITHUB_BEARER_TOKEN: ${{ inputs.github-bearer-token }}

    # ================== 📁 ==================

    - name: "📁 Normalize path"
      id: normalize-path
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.path }}

    - name: "📁 Normalize filename"
      id: normalize-filename
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.filename }}

    - name: "📁 Normalize output-base-intermediate-path"
      id: normalize-base-intermediate-output-path
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.base-intermediate-output-path }}

    - name: "📁 Normalize import-metadata-path"
      id: normalize-import-metadata-path
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.import-metadata-path }}

    # ================== ✅ ==================

    - name: "✅ Validate input : booleans"
      shell: bash
      run: |
        echo "::debug::Validating boolean inputs..."
        for param in exclude-dev exclude-test-projects isBaseUrlPasswordClearText recursive no-serial-number enable-github-licenses disable-package-restore disable-hash-computation include-project-references set-nuget-purl; do
          case $param in
            exclude-dev) value="${INPUT_EXCLUDE_DEV}" ;;
            exclude-test-projects) value="${INPUT_EXCLUDE_TEST_PROJECTS}" ;;
            isBaseUrlPasswordClearText) value="${INPUT_ISBASEURLPASSWORDCLEARTEXT}" ;;
            recursive) value="${INPUT_RECURSIVE}" ;;
            no-serial-number) value="${INPUT_NO_SERIAL_NUMBER}" ;;
            enable-github-licenses) value="${INPUT_ENABLE_GITHUB_LICENSES}" ;;
            disable-package-restore) value="${INPUT_DISABLE_PACKAGE_RESTORE}" ;;
            disable-hash-computation) value="${INPUT_DISABLE_HASH_COMPUTATION}" ;;
            include-project-references) value="${INPUT_INCLUDE_PROJECT_REFERENCES}" ;;
            set-nuget-purl) value="${INPUT_SET_NUGET_PURL}" ;;
          esac
          if [ -n "$value" ] && [ "$value" != "true" ] && [ "$value" != "false" ]; then
            echo "::error::Parameter $param must be 'true' or 'false', got: $value"
            exit 1
          fi
        done

        echo "✅ Boolean inputs validation completed successfully"
      env:
        INPUT_EXCLUDE_DEV: ${{ inputs.exclude-dev }}
        INPUT_EXCLUDE_TEST_PROJECTS: ${{ inputs.exclude-test-projects }}
        INPUT_ISBASEURLPASSWORDCLEARTEXT: ${{ inputs.isBaseUrlPasswordClearText }}
        INPUT_RECURSIVE: ${{ inputs.recursive }}
        INPUT_NO_SERIAL_NUMBER: ${{ inputs.no-serial-number }}
        INPUT_ENABLE_GITHUB_LICENSES: ${{ inputs.enable-github-licenses }}
        INPUT_DISABLE_PACKAGE_RESTORE: ${{ inputs.disable-package-restore }}
        INPUT_DISABLE_HASH_COMPUTATION: ${{ inputs.disable-hash-computation }}
        INPUT_INCLUDE_PROJECT_REFERENCES: ${{ inputs.include-project-references }}
        INPUT_SET_NUGET_PURL: ${{ inputs.set-nuget-purl }}

    - name: "✅ Validate input : output-format"
      shell: bash
      run: |
        echo "::debug::Validating output-format input: ${INPUT_OUTPUT_FORMAT}"

        case "${INPUT_OUTPUT_FORMAT}" in
          Auto|Json|UnsafeJson|Xml) ;;
          *) echo "::error::Invalid output format. Must be one of: Auto, Json, UnsafeJson, Xml"; exit 1 ;;
        esac

        echo "✅ Output format validation completed successfully"
      env:
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}

    - name: "✅ Validate input : set-type"
      id: formatted-set-type
      shell: bash
      run: |
        echo "::debug::Validating set-type input: ${INPUT_SET_TYPE}"

        case "${INPUT_SET_TYPE}" in
          Application|Container|Cryptographic_Asset|Data|Device|Device_Driver|File|Firmware|Framework|Library|Machine_Learning_Model|Null|Operating_System|Platform) ;;
          *) echo "::error::Invalid component type. Must be one of: Application, Container, Cryptographic_Asset, Data, Device, Device_Driver, File, Firmware, Framework, Library, Machine_Learning_Model, Null, Operating_System, Platform"; exit 1 ;;
        esac

        echo "✅ Component type validation completed successfully"
      env:
        INPUT_SET_TYPE: ${{ inputs.set-type }}

    - name: "✅ Validate input : spec-version"
      if: ${{ inputs.spec-version != '' }}
      shell: bash
      run: |
        echo "::debug::Validating spec-version input: ${INPUT_SPEC_VERSION}"

        case "${INPUT_SPEC_VERSION}" in
          1.0|1.1|1.2|1.3|1.4|1.5|1.6|1.7) ;;
          *) echo "::error::Invalid spec-version. Must be one of: 1.0, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7"; exit 1 ;;
        esac

        echo "✅ Spec version validation completed successfully"
      env:
        INPUT_SPEC_VERSION: ${{ inputs.spec-version }}

    - name: "✅ Validate input : exclude-filter"
      if: ${{ inputs.exclude-filter != '' }}
      shell: bash
      run: |
        echo "::debug::Validating exclude-filter input: ${INPUT_EXCLUDE_FILTER}"

        IFS=',' read -ra FILTERS <<< "${INPUT_EXCLUDE_FILTER}"
        for filter in "${FILTERS[@]}"; do
          if ! [[ "$filter" =~ ^[^@]+@[^@]+$ ]]; then
            echo "::error::Invalid exclude-filter format. Each filter must be in the form 'name@version'. Invalid filter: $filter"
            exit 1
          fi
        done

        echo "✅ Exclude filter validation completed successfully"
      env:
        INPUT_EXCLUDE_FILTER: ${{ inputs.exclude-filter }}

    - name: "✅ Validate input : url"
      if: ${{ inputs.url != '' }}
      shell: bash
      run: |
        echo "::debug::Validating URL input: ${INPUT_URL}"

        if ! [[ "${INPUT_URL}" =~ ^https?:// ]]; then
          echo "::error::Invalid URL format. Must start with http:// or https://: ${INPUT_URL}"
          exit 1
        fi

        echo "✅ URL validation completed successfully"
      env:
        INPUT_URL: ${{ inputs.url }}

    - name: "✅ Validate input : dotnet-command-timeout"
      if: ${{ inputs.dotnet-command-timeout != '' && inputs.dotnet-command-timeout != '300000' }}
      shell: bash
      run: |
        echo "::debug::Validating dotnet-command-timeout input: ${INPUT_DOTNET_COMMAND_TIMEOUT}"

        if ! [[ "${INPUT_DOTNET_COMMAND_TIMEOUT}" =~ ^[0-9]+$ ]]; then
          echo "::error::Timeout must be a positive number: ${INPUT_DOTNET_COMMAND_TIMEOUT}"
          exit 1
        fi

        echo "✅ Timeout validation completed successfully"
      env:
        INPUT_DOTNET_COMMAND_TIMEOUT: ${{ inputs.dotnet-command-timeout }}

    # Skipping checks for now
    # - name: "✅ Validate input : set-version"
    #   if: ${{ inputs.set-version != '' }}
    #   shell: bash
    #   run: |
    #     echo "::debug::Validating set-version input: ${{ inputs.set-version }}"

    #     if ! [[ "${{ inputs.set-version }}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
    #       echo "::error::Version must be in the format 'X.Y.Z' where X, Y, and Z are numbers: ${{ inputs.set-version }}"
    #       exit 1
    #     fi

    #     echo "✅ Version validation completed successfully"


    - name: "✅ Validate input : github-authentication"
      shell: bash
      run: |
        echo "::debug::Validating GitHub authentication inputs"

        # Check GitHub username/token combination
        if [ -n "${INPUT_GITHUB_USERNAME}" ] && [ -z "${INPUT_GITHUB_TOKEN}" ]; then
          echo "::error::GitHub token must be provided when GitHub username is specified"
          exit 1
        fi

        if [ -n "${INPUT_GITHUB_TOKEN}" ] && [ -z "${INPUT_GITHUB_USERNAME}" ]; then
          echo "::error::GitHub username must be provided when GitHub token is specified"
          exit 1
        fi

        # Bearer token is standalone
        if [ -n "${INPUT_GITHUB_BEARER_TOKEN}" ] && [ -n "${INPUT_GITHUB_USERNAME}" ]; then
          echo "::warning::GitHub bearer token will be used instead of username/token combination"
        fi

        echo "✅ GitHub authentication validation completed successfully"
      env:
        INPUT_GITHUB_USERNAME: ${{ inputs.github-username }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_GITHUB_BEARER_TOKEN: ${{ inputs.github-bearer-token }}

    - name: "✅ Validate input : import-metadata-path"
      if: ${{ inputs.import-metadata-path != '' }}
      shell: bash
      run: |
        echo "::debug::Validating import-metadata-path input: ${STEP_NORMALIZE_IMPORT_METADATA_PATH_NORMALIZED}"

        if [ ! -f "${STEP_NORMALIZE_IMPORT_METADATA_PATH_NORMALIZED}" ]; then
          echo "::error file=${STEP_NORMALIZE_IMPORT_METADATA_PATH_NORMALIZED}::Import metadata file not found: ${STEP_NORMALIZE_IMPORT_METADATA_PATH_NORMALIZED}"
          exit 1
        fi

        echo "✅ Import metadata path validation completed successfully"
      env:
        STEP_NORMALIZE_IMPORT_METADATA_PATH_NORMALIZED: ${{ steps.normalize-import-metadata-path.outputs.normalized }}

    - name: "✅ Validate input : base-intermediate-output-path"
      if: ${{ inputs.base-intermediate-output-path != '' }}
      shell: bash
      run: |
        echo "::debug::Validating base-intermediate-output-path input: ${STEP_NORMALIZE_BASE_INTERMEDIATE_OUTPUT_PATH_NORMALIZED}"

        if [ ! -d "${STEP_NORMALIZE_BASE_INTERMEDIATE_OUTPUT_PATH_NORMALIZED}" ]; then
          echo "::error file=${STEP_NORMALIZE_BASE_INTERMEDIATE_OUTPUT_PATH_NORMALIZED}::Base intermediate output path not found: ${STEP_NORMALIZE_BASE_INTERMEDIATE_OUTPUT_PATH_NORMALIZED}"
          exit 1
        fi

        echo "✅ Base intermediate output path validation completed successfully"
      env:
        STEP_NORMALIZE_BASE_INTERMEDIATE_OUTPUT_PATH_NORMALIZED: ${{ steps.normalize-base-intermediate-output-path.outputs.normalized }}

    # ================== 🏗️  ==================

    - name: "🏗️ Build argument list"
      id: build-args
      shell: bash
      run: |
        echo "::debug::Building argument list for CycloneDX..."

        ARGUMENTS="run dotnet-cyclonedx"

        # Start with path argument if provided
        if [ -n "${STEP_NORMALIZE_PATH_NORMALIZED}" ]; then
          ARGUMENTS="$ARGUMENTS '${STEP_NORMALIZE_PATH_NORMALIZED}'"
        fi

        # Key-value options
        for param in filename url baseUrlUsername baseUrlUserPassword dotnet-command-timeout base-intermediate-output-path import-metadata-path set-name set-version spec-version exclude-filter; do
          case $param in
            filename) value="${STEP_NORMALIZE_FILENAME_NORMALIZED}" ;;
            url) value="${INPUT_URL}" ;;
            baseUrlUsername) value="${INPUT_BASEURLUSERNAME}" ;;
            baseUrlUserPassword) value="${INPUT_BASEURLUSERPASSWORD}" ;;
            dotnet-command-timeout) value="${INPUT_DOTNET_COMMAND_TIMEOUT}" ;;
            base-intermediate-output-path) value="${STEP_NORMALIZE_BASE_INTERMEDIATE_OUTPUT_PATH_NORMALIZED}" ;;
            import-metadata-path) value="${STEP_NORMALIZE_IMPORT_METADATA_PATH_NORMALIZED}" ;;
            set-name) value="${INPUT_SET_NAME}" ;;
            set-version) value="${INPUT_SET_VERSION}" ;;
            spec-version) value="${INPUT_SPEC_VERSION}" ;;
            exclude-filter) value="${INPUT_EXCLUDE_FILTER}" ;;
          esac
          if [ -n "$value" ] ; then
            ARGUMENTS="$ARGUMENTS --$param '$value'"
          fi
        done

        # Output format (only if not Auto)
        if [ "${INPUT_OUTPUT_FORMAT}" != "Auto" ]; then
          ARGUMENTS="$ARGUMENTS --output-format '${INPUT_OUTPUT_FORMAT}'"
        fi

        # Component type (only if not Application)
        if [ "${INPUT_SET_TYPE}" != "Application" ]; then
          ARGUMENTS="$ARGUMENTS --set-type '${INPUT_SET_TYPE}'"
        fi

        # GitHub authentication
        if [ -n "${INPUT_GITHUB_BEARER_TOKEN}" ]; then
          ARGUMENTS="$ARGUMENTS --github-bearer-token '${INPUT_GITHUB_BEARER_TOKEN}'"
        elif [ -n "${INPUT_GITHUB_USERNAME}" ] && [ -n "${INPUT_GITHUB_TOKEN}" ]; then
          ARGUMENTS="$ARGUMENTS --github-username '${INPUT_GITHUB_USERNAME}' --github-token '${INPUT_GITHUB_TOKEN}'"
        fi

        # Boolean flags
        for param in exclude-dev exclude-test-projects isBaseUrlPasswordClearText recursive no-serial-number enable-github-licenses disable-package-restore disable-hash-computation include-project-references set-nuget-purl; do
          case $param in
            exclude-dev) value="${INPUT_EXCLUDE_DEV}" ;;
            exclude-test-projects) value="${INPUT_EXCLUDE_TEST_PROJECTS}" ;;
            isBaseUrlPasswordClearText) value="${INPUT_ISBASEURLPASSWORDCLEARTEXT}" ;;
            recursive) value="${INPUT_RECURSIVE}" ;;
            no-serial-number) value="${INPUT_NO_SERIAL_NUMBER}" ;;
            enable-github-licenses) value="${INPUT_ENABLE_GITHUB_LICENSES}" ;;
            disable-package-restore) value="${INPUT_DISABLE_PACKAGE_RESTORE}" ;;
            disable-hash-computation) value="${INPUT_DISABLE_HASH_COMPUTATION}" ;;
            include-project-references) value="${INPUT_INCLUDE_PROJECT_REFERENCES}" ;;
            set-nuget-purl) value="${INPUT_SET_NUGET_PURL}" ;;
          esac
          if [ "$value" = "true" ]; then
            ARGUMENTS="$ARGUMENTS --${param}"
          fi
        done

        # Trim leading space
        ARGUMENTS="${ARGUMENTS# }"

        echo "arguments=$ARGUMENTS" >> $GITHUB_OUTPUT
        echo "✅ Argument list built successfully: $ARGUMENTS"
      env:
        STEP_NORMALIZE_PATH_NORMALIZED: ${{ steps.normalize-path.outputs.normalized }}
        STEP_NORMALIZE_FILENAME_NORMALIZED: ${{ steps.normalize-filename.outputs.normalized }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_BASEURLUSERNAME: ${{ inputs.baseUrlUsername }}
        INPUT_BASEURLUSERPASSWORD: ${{ inputs.baseUrlUserPassword }}
        INPUT_DOTNET_COMMAND_TIMEOUT: ${{ inputs.dotnet-command-timeout }}
        STEP_NORMALIZE_BASE_INTERMEDIATE_OUTPUT_PATH_NORMALIZED: ${{ steps.normalize-base-intermediate-output-path.outputs.normalized }}
        STEP_NORMALIZE_IMPORT_METADATA_PATH_NORMALIZED: ${{ steps.normalize-import-metadata-path.outputs.normalized }}
        INPUT_SET_NAME: ${{ inputs.set-name }}
        INPUT_SET_VERSION: ${{ inputs.set-version }}
        INPUT_SPEC_VERSION: ${{ inputs.spec-version }}
        INPUT_EXCLUDE_FILTER: ${{ inputs.exclude-filter }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_SET_TYPE: ${{ inputs.set-type }}
        INPUT_GITHUB_BEARER_TOKEN: ${{ inputs.github-bearer-token }}
        INPUT_GITHUB_USERNAME: ${{ inputs.github-username }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_EXCLUDE_DEV: ${{ inputs.exclude-dev }}
        INPUT_EXCLUDE_TEST_PROJECTS: ${{ inputs.exclude-test-projects }}
        INPUT_ISBASEURLPASSWORDCLEARTEXT: ${{ inputs.isBaseUrlPasswordClearText }}
        INPUT_RECURSIVE: ${{ inputs.recursive }}
        INPUT_NO_SERIAL_NUMBER: ${{ inputs.no-serial-number }}
        INPUT_ENABLE_GITHUB_LICENSES: ${{ inputs.enable-github-licenses }}
        INPUT_DISABLE_PACKAGE_RESTORE: ${{ inputs.disable-package-restore }}
        INPUT_DISABLE_HASH_COMPUTATION: ${{ inputs.disable-hash-computation }}
        INPUT_INCLUDE_PROJECT_REFERENCES: ${{ inputs.include-project-references }}
        INPUT_SET_NUGET_PURL: ${{ inputs.set-nuget-purl }}

    # ================== 🚀 ==================

    - name: "📦 Install CycloneDX .NET Global Tool"
      id: install-tool
      uses: "laerdal/github_actions/dotnet-tool-install@main"
      with:
        tool-name: "CycloneDX"
        global: ${{ inputs.global }}
        create-manifest-if-needed: "true"
        show-summary: ${{ inputs.show-summary }}

    - name: "🚀 Execute CycloneDX"
      id: run-dotnet
      uses: "laerdal/github_actions/dotnet@main"
      with:
        command: "tool"
        arguments: ${{ steps.build-args.outputs.arguments }}
        working-directory: ${{ inputs.working-directory }}
        framework: ${{ inputs.framework }}
        runtime: ${{ inputs.runtime }}
        output: ${{ inputs.output }}
        show-summary: ${{ inputs.show-summary }}

    # ================== 🔍 ==================

    - name: "🔍 Verify SBOM generation"
      id: verify-sbom
      shell: bash
      run: |
        echo "::debug::Verifying CycloneDX SBOM generation..."

        # Determine the expected output directory and filename
        OUTPUT_DIR="${INPUT_OUTPUT}"
        if [ -z "$OUTPUT_DIR" ]; then
          OUTPUT_DIR="."
        fi

        FILENAME="${STEP_NORMALIZE_FILENAME_NORMALIZED}"
        if [ -z "$FILENAME" ]; then
          # Default filename based on output format
          case "${INPUT_OUTPUT_FORMAT}" in
            Json|UnsafeJson) FILENAME="bom.json" ;;
            Xml) FILENAME="bom.xml" ;;
            Auto) FILENAME="bom.xml" ;;  # Default for Auto
            *) FILENAME="bom.xml" ;;
          esac
        fi

        SBOM_FILE="$OUTPUT_DIR/$FILENAME"

        # Check if SBOM file was generated
        if [ -f "$SBOM_FILE" ]; then
          FILE_SIZE=$(wc -c < "$SBOM_FILE" 2>/dev/null || echo "0")
          echo "✅ SBOM file generated: $SBOM_FILE ($FILE_SIZE bytes)"
          echo "sbom-generated=true" >> $GITHUB_OUTPUT
          echo "sbom-file=$SBOM_FILE" >> $GITHUB_OUTPUT
          echo "sbom-size=$FILE_SIZE" >> $GITHUB_OUTPUT

          # Validate SBOM content (basic check for XML/JSON structure)
          if [[ "$SBOM_FILE" == *.xml ]]; then
            if grep -q "<bom" "$SBOM_FILE" 2>/dev/null; then
              echo "✅ SBOM appears to be valid XML"
              echo "sbom-valid=true" >> $GITHUB_OUTPUT
            else
              echo "⚠️ SBOM file exists but may not be valid XML"
              echo "sbom-valid=false" >> $GITHUB_OUTPUT
            fi
          elif [[ "$SBOM_FILE" == *.json ]]; then
            if command -v jq >/dev/null 2>&1 && jq empty "$SBOM_FILE" >/dev/null 2>&1; then
              echo "✅ SBOM appears to be valid JSON"
              echo "sbom-valid=true" >> $GITHUB_OUTPUT
            else
              echo "⚠️ SBOM file exists but may not be valid JSON"
              echo "sbom-valid=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "sbom-valid=unknown" >> $GITHUB_OUTPUT
          fi
        else
          echo "❌ SBOM file not found: $SBOM_FILE"
          echo "sbom-generated=false" >> $GITHUB_OUTPUT
          echo "sbom-file=" >> $GITHUB_OUTPUT
          echo "sbom-size=0" >> $GITHUB_OUTPUT
          echo "sbom-valid=false" >> $GITHUB_OUTPUT
        fi

        echo "::debug::SBOM generation verification completed"
      env:
        INPUT_OUTPUT: ${{ inputs.output }}
        STEP_NORMALIZE_FILENAME_NORMALIZED: ${{ steps.normalize-filename.outputs.normalized }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}

    # ================== 📊 ==================

    - name: "📊 Action Summary"
      if: always() && inputs.show-summary == 'true'
      shell: bash
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        <details><summary>🔗 CycloneDX ${INPUT_SET_NAME} ${INPUT_SET_VERSION}\`</summary>

        ## 🔧 CycloneDX Specific Parameters
        | Parameter | Value |
        |-----------|-------|
        | 📄 Filename | \`${STEP_NORMALIZE_FILENAME_NORMALIZED}\` |
        | 📋 Output Format | \`${INPUT_OUTPUT_FORMAT}\` |
        | 🚫 Exclude Dev Dependencies | \`${INPUT_EXCLUDE_DEV}\` |
        | 🧪 Exclude Test Projects | \`${INPUT_EXCLUDE_TEST_PROJECTS}\` |
        | 🔄 Recursive Scan | \`${INPUT_RECURSIVE}\` |
        | 🔢 Include Serial Number | \`${INPUT_NO_SERIAL_NUMBER_LABEL}\` |
        | 🐙 GitHub License Resolution | \`${INPUT_ENABLE_GITHUB_LICENSES}\` |
        | 📦 Package Restore | \`${INPUT_DISABLE_PACKAGE_RESTORE_LABEL}\` |
        | 🔗 Include Project References | \`${INPUT_INCLUDE_PROJECT_REFERENCES}\` |
        | 🏷️ Component Name | \`${INPUT_SET_NAME}\` |
        | 📌 Component Version | \`${INPUT_SET_VERSION}\` |
        | 🏗️ Component Type | \`${INPUT_SET_TYPE}\` |
        | 📐 Spec Version | \`${INPUT_SPEC_VERSION}\` |

        ## ⚙️ Process Details
        | Step | Status |
        |------|--------|
        | ✅ Input Validation | \`✅ Completed\` |
        | 📦 Tool Installation | \`${STEP_INSTALL_TOOL_OUTCOME_LABEL}\` |
        | 🏗️ Argument Building | \`${STEP_BUILD_ARGS_OUTCOME_LABEL}\` |
        | 🔧 SBOM Generation | \`${STEP_RUN_DOTNET_OUTCOME_LABEL}\` |
        | 🔍 SBOM Verification | \`${STEP_VERIFY_SBOM_OUTCOME_LABEL}\` |

        ## 📤 Execution Results
        | Metric | Value |
        |--------|-------|
        | ✅ Exit Code | \`${STEP_RUN_DOTNET_EXIT_CODE}\` |
        | 📄 SBOM Generated | \`${STEP_VERIFY_SBOM_SBOM_GENERATED}\` |
        | 📁 SBOM File | \`${STEP_VERIFY_SBOM_SBOM_FILE}\` |
        | 📏 SBOM Size | \`${STEP_VERIFY_SBOM_SBOM_SIZE} bytes\` |
        | ✅ SBOM Valid | \`${STEP_VERIFY_SBOM_SBOM_VALID}\` |
        | 🚀 Tool Installation | \`${STEP_INSTALL_TOOL_HAS_BEEN_INSTALLED_LABEL}\` |
        | 🔧 Generated Command | \`dotnet tool ${STEP_BUILD_ARGS_ARGUMENTS}\` |

        </details>
        EOF
      env:
        INPUT_SET_NAME: ${{ inputs.set-name || 'auto-generated' }}
        INPUT_SET_VERSION: ${{ inputs.set-version || '0.0.0' }}
        STEP_NORMALIZE_FILENAME_NORMALIZED: ${{ steps.normalize-filename.outputs.normalized || 'auto-generated' }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_EXCLUDE_DEV: ${{ inputs.exclude-dev }}
        INPUT_EXCLUDE_TEST_PROJECTS: ${{ inputs.exclude-test-projects }}
        INPUT_RECURSIVE: ${{ inputs.recursive }}
        INPUT_NO_SERIAL_NUMBER_LABEL: ${{ inputs.no-serial-number == 'true' && 'false' || 'true' }}
        INPUT_ENABLE_GITHUB_LICENSES: ${{ inputs.enable-github-licenses }}
        INPUT_DISABLE_PACKAGE_RESTORE_LABEL: ${{ inputs.disable-package-restore == 'true' && 'disabled' || 'enabled' }}
        INPUT_INCLUDE_PROJECT_REFERENCES: ${{ inputs.include-project-references }}
        INPUT_SET_TYPE: ${{ inputs.set-type }}
        INPUT_SPEC_VERSION: ${{ inputs.spec-version || 'tool default' }}
        STEP_INSTALL_TOOL_OUTCOME_LABEL: ${{ steps.install-tool.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_BUILD_ARGS_OUTCOME_LABEL: ${{ steps.build-args.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_RUN_DOTNET_OUTCOME_LABEL: ${{ steps.run-dotnet.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_VERIFY_SBOM_OUTCOME_LABEL: ${{ steps.verify-sbom.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_RUN_DOTNET_EXIT_CODE: ${{ steps.run-dotnet.outputs.exit-code }}
        STEP_VERIFY_SBOM_SBOM_GENERATED: ${{ steps.verify-sbom.outputs.sbom-generated }}
        STEP_VERIFY_SBOM_SBOM_FILE: ${{ steps.verify-sbom.outputs.sbom-file || 'not generated' }}
        STEP_VERIFY_SBOM_SBOM_SIZE: ${{ steps.verify-sbom.outputs.sbom-size }}
        STEP_VERIFY_SBOM_SBOM_VALID: ${{ steps.verify-sbom.outputs.sbom-valid }}
        STEP_INSTALL_TOOL_HAS_BEEN_INSTALLED_LABEL: ${{ steps.install-tool.outputs.has-been-installed == 'true' && '✅ Installed' || steps.install-tool.outputs.is-already-installed == 'true' && '⚠️ Already Installed' || '❌ Failed' }}
        STEP_BUILD_ARGS_ARGUMENTS: ${{ steps.build-args.outputs.arguments }}

branding:
  icon: "file-text"
  color: "blue"


# dotnet cyclonedx --help
# Description:
#   A .NET Core global tool which creates CycloneDX Software Bill-of-Materials (SBOM) from .NET projects.
# 
# Usage:
#   CycloneDX [<path>] [options]
# 
# Arguments:
#   <path>  The path to a .sln, .slnf, .slnx, .csproj, .fsproj, .vbproj, .xsproj, or packages.config file or the path to a directory which will be recursively analyzed for packages.config files.
# 
# Options:
#   -tfm, --framework <framework>                                                                                                                             The target framework to use. If not defined, all will be aggregated.
#   -rt, --runtime <runtime>                                                                                                                                  The runtime to use. If not defined, all will be aggregated.
#   -o, --output <output>                                                                                                                                     The directory to write the BOM
#   -fn, --filename <filename>                                                                                                                                Optionally provide a filename for the BOM (default: bom.xml or bom.json)
#   -ed, --exclude-dev                                                                                                                                        Exclude development dependencies from the BOM (see https://github.com/NuGet/Home/wiki/DevelopmentDependency-support-for-PackageReference)
#   -t, --exclude-test-projects                                                                                                                               Exclude test projects from the BOM
#   -u, --url <url>                                                                                                                                           Alternative NuGet repository URL to https://<yoururl>/nuget/<yourrepository>/v3/index.json
#   -us, --baseUrlUsername <baseUrlUsername>                                                                                                                  Alternative NuGet repository username. Falls back to the CYCLONEDX_NUGET_USERNAME environment variable.
#   -usp, --baseUrlUserPassword <baseUrlUserPassword>                                                                                                         Alternative NuGet repository username password/apikey. Falls back to the CYCLONEDX_NUGET_PASSWORD environment variable.
#   -uspct, --isBaseUrlPasswordClearText                                                                                                                      Alternative NuGet repository password is cleartext
#   -rs, --recursive                                                                                                                                          To be used with a single project file, it will recursively scan project references of the supplied project file
#   -ns, --no-serial-number                                                                                                                                   Optionally omit the serial number from the resulting BOM
#   -gu, --github-username <github-username>                                                                                                                  Optionally provide a GitHub username for license resolution. If set you also need to provide a GitHub personal access token. Falls back to the
#   CYCLONEDX_GITHUB_USERNAME environment variable.
#   -gt, --github-token <github-token>                                                                                                                        Optionally provide a GitHub personal access token for license resolution. If set you also need to provide a GitHub username. Falls back to the
#   CYCLONEDX_GITHUB_TOKEN environment variable.                                       ^^
#   -gbt, --github-bearer-token <github-bearer-token>                                                                                                         Optionally provide a GitHub bearer token for license resolution. This is useful in GitHub actions. Falls back to the CYCLONEDX_GITHUB_BEARER_TOKEN or
#   GITHUB_TOKEN environment variables.
#   -egl, --enable-github-licenses                                                                                                                            Enables GitHub license resolution
#   -dpr, --disable-package-restore                                                                                                                           Optionally disable package restore
#   -dhc, --disable-hash-computation                                                                                                                          Optionally disable hash computation for packages
#   -ilt, --include-license-text                                                                                                                              Embed license file contents as base64-encoded text in the BOM for packages that declare a license file in their package (via <license type="file"> in
#   the nuspec)
#   -dct, --dotnet-command-timeout <dotnet-command-timeout>                                                                                                   dotnet command timeout in milliseconds (primarily used for long dotnet restore operations) [default: 300000]
#   -biop, --base-intermediate-output-path <base-intermediate-output-path>                                                                                    Optionally provide a folder for customized build environment. Required if folder 'obj' is relocated.
#   -imp, --import-metadata-path <import-metadata-path>                                                                                                       Optionally provide a metadata template which has project specific details.
#   -ipr, --include-project-references                                                                                                                        Include project references as components (can only be used with project files).
#   -sn, --set-name <set-name>                                                                                                                                Override the autogenerated BOM metadata component name.
#   -sv, --set-version <set-version>                                                                                                                          Override the default BOM metadata component version (defaults to 0.0.0).
#   -st, --set-type                                                                                                                                           Override the default BOM metadata component type (defaults to application). [default: Application]
#   <Application|Container|Cryptographic_Asset|Data|Device|Device_Driver|File|Firmware|Framework|Library|Machine_Learning_Model|Null|Operating_System|Platfo
#   rm>
#   --set-nuget-purl                                                                                                                                          Override the default BOM metadata component bom ref and PURL as NuGet package.
#   -spv, --spec-version <1.0|1.1|1.2|1.3|1.4|1.5|1.6|1.7>                                                                                                    Which version of CycloneDX spec to use. [default: 1.7]
#   -ef, --exclude-filter <exclude-filter>                                                                                                                    A comma separated list of dependencies to exclude in form 'name1@version1,name2@version2' or 'name1,name2' (to exclude all versions). Transitive
#   dependencies will also be removed.
#   -F, --output-format <Auto|Json|UnsafeJson|Xml>                                                                                                            Select the BOM output format: auto (default), xml, json, or unsafeJson (relaxed escaping).
#   -c, --configuration <configuration>                                                                                                                       The MSBuild configuration to use when restoring packages (e.g. Debug, Release). When set, the configuration is passed to dotnet restore so that
#   conditional PackageReferences (e.g. Condition="'$(Configuration)' == 'Debug'") are evaluated correctly.
#   --out <out>                                                                                                                                               (Deprecated use --output instead) The directory to write the BOM
#   --json                                                                                                                                                    (Deprecated use --output-format instead) Output in JSON format
#   -?, -h, --help                                                                                                                                            Show help and usage information
#   --version                                                                                                                                                 Show version information
# 