name: "🚀 Run .NET Command"
description: "Runs a .NET command with automatic verbosity handling based on debug settings"
author: "Francois Raminosona"

inputs:
  command:
    description: "The dotnet command to run (e.g., 'build', 'restore', 'test')"
    required: true
  path:
    description: "Path to the project file, solution file, or directory to operate on"
    required: false
    default: ""
  arguments:
    description: "Additional arguments to pass to the dotnet command"
    required: false
    default: ""
  working-directory:
    description: "Working directory for the command"
    required: false
    default: "."
  verbosity:
    description: "Force a specific verbosity level (overrides auto-detection)"
    required: false
    default: ""
  nologo:
    description: "Suppress the Microsoft logo and startup information"
    required: false
    default: "true"
  no-restore:
    description: "Skip automatic restore"
    required: false
    default: "false"
  no-build:
    description: "Skip building the project before running"
    required: false
    default: "false"
  configuration:
    description: "Build configuration to use (e.g., 'Debug', 'Release')"
    required: false
    default: "Release"
  framework:
    description: "Target framework (e.g., 'net8.0', 'net6.0')"
    required: false
    default: ""
  runtime:
    description: "Target runtime (e.g., 'win-x64', 'linux-x64', 'osx-arm64')"
    required: false
    default: ""
  arch:
    description: "Target architecture (e.g., 'x64', 'arm64')"
    required: false
    default: ""
  output:
    description: "Output directory path, will convert into "
    required: false
    default: ""
  artifacts-path:
    description: "Path to store artifacts (if applicable)"
    required: false
    default: ""
  show-summary:
    description: "Whether to show the action summary"
    required: false
    default: "false"

outputs:
  exit-code:
    description: "Exit code of the dotnet command"
    value: ${{ steps.run-command.outputs.exit-code }}
  executed-command:
    description: "The actual command that was executed"
    value: ${{ steps.run-command.outputs.executed-command }}

runs:
  using: "composite"
  steps:

    # ================== ℹ️ ==================

    - name: "ℹ️ Gather environment information"
      shell: bash
      run: |
        echo "::debug::Operating System: $(uname -a)"
        echo "::debug::GitHub Runner OS: $RUNNER_OS"
        echo "::debug::GitHub Runner Version: $RUNNER_VERSION"
        echo "::debug::.NET SDK Version: $(dotnet --version || echo 'Not installed')"
        echo "::debug::Available runtimes: $(dotnet --list-runtimes 2>/dev/null || echo 'None')"

    # ================== 🔒 ==================

    - name: "🔒 Mask sensitive data"
      shell: bash
      run: |
        # No sensitive inputs to mask in this action
        echo "✅ No sensitive data to mask"

    # ================== 📁 ==================

    - name: "💯 Normalize arguments"
      id: normalize-arguments
      uses: laerdal/github_actions/normalize-arguments@main
      with:
        arguments: ${{ inputs.arguments }}

    - name: "📁 Normalize output"
      id: normalize-output
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.output }}

    - name: "📁 Normalize artifacts-path"
      id: normalize-artifacts-path
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.artifacts-path }}

    - name: "📁 Normalize working-directory"
      id: normalize-working-directory
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.working-directory }}

    - name: "📁 Normalize path"
      id: normalize-path
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.path }}

    # ================== ✅ ==================

    - name: "✅ Validate input : working-directory"
      shell: bash
      run: |
        echo "::debug::Validating working-directory input: ${STEP_NORMALIZE_WORKING_DIRECTORY_NORMALIZED}"

        if [ -z "${STEP_NORMALIZE_WORKING_DIRECTORY_NORMALIZED}" ]; then
          echo "::error::Working directory input is required"
          exit 1
        fi

        if [ "${STEP_NORMALIZE_WORKING_DIRECTORY_EXISTS}" != "true" ]; then
          echo "::error file=${STEP_NORMALIZE_WORKING_DIRECTORY_NORMALIZED}::Working directory does not exist or is not a directory: ${STEP_NORMALIZE_WORKING_DIRECTORY_NORMALIZED}"
          exit 1
        fi

        echo "✅ Working directory validation completed successfully"
      env:
        STEP_NORMALIZE_WORKING_DIRECTORY_NORMALIZED: ${{ steps.normalize-working-directory.outputs.normalized }}
        STEP_NORMALIZE_WORKING_DIRECTORY_EXISTS: ${{ steps.normalize-working-directory.outputs.exists }}

    - name: "✅ Validate input : path"
      if: ${{ inputs.path != '' }}
      shell: bash
      run: |
        echo "::debug::Validating path input: ${STEP_NORMALIZE_PATH_EXISTS}"

        if [ "${STEP_NORMALIZE_PATH_EXISTS}" != "true" ]; then
          echo "::error file=${STEP_NORMALIZE_PATH_EXISTS}::Specified path does not exist: ${STEP_NORMALIZE_PATH_EXISTS}"
          exit 1
        fi

        echo "✅ Path validation completed successfully"
      env:
        STEP_NORMALIZE_PATH_EXISTS: ${{ steps.normalize-path.outputs.exists }}

    - name: "✅ Validate input : booleans"
      shell: bash
      run: |
        echo "::debug::Validating boolean inputs..."
        for param in nologo no-restore no-build; do
          case $param in
            nologo) value="${INPUT_NOLOGO}" ;;
            no-restore) value="${INPUT_NO_RESTORE}" ;;
            no-build) value="${INPUT_NO_BUILD}" ;;
          esac
          if [ -n "$value" ] && [ "$value" != "true" ] && [ "$value" != "false" ]; then
            echo "::error::Parameter $param must be 'true' or 'false', got: $value"
            exit 1
          fi
        done

        echo "✅ Boolean inputs validation completed successfully"
      env:
        INPUT_NOLOGO: ${{ inputs.nologo }}
        INPUT_NO_RESTORE: ${{ inputs.no-restore }}
        INPUT_NO_BUILD: ${{ inputs.no-build }}

    - name: "✅ Validate input : command"
      shell: bash
      run: |
        echo "::debug::Validating command input: ${INPUT_COMMAND}"

        if [ -z "${INPUT_COMMAND}" ]; then
          echo "::error::Command input is required"
          exit 1
        fi

        echo "✅ Command validation completed successfully"
      env:
        INPUT_COMMAND: ${{ inputs.command }}

    - name: "✅ Validate input : verbosity"
      if: ${{ inputs.verbosity != '' }}
      shell: bash
      run: |
        echo "::debug::Validating verbosity input: ${INPUT_VERBOSITY}"

        case "${INPUT_VERBOSITY}" in
          quiet|minimal|normal|detailed|diagnostic) ;;
          *) echo "::error::Invalid verbosity level: ${INPUT_VERBOSITY}. Must be one of: quiet, minimal, normal, detailed, diagnostic"; exit 1 ;;
        esac

        echo "✅ Verbosity validation completed successfully"
      env:
        INPUT_VERBOSITY: ${{ inputs.verbosity }}

    - name: "✅ Validate input : configuration"
      if: ${{ inputs.configuration != '' }}
      shell: bash
      run: |
        echo "::debug::Validating configuration input: ${INPUT_CONFIGURATION}"

        case "${INPUT_CONFIGURATION}" in
          Debug|Release|MinSizeRel|RelWithDebInfo) ;;
          *) echo "::warning::Unusual configuration value: ${INPUT_CONFIGURATION}" ;;
        esac

        echo "✅ Configuration validation completed successfully"
      env:
        INPUT_CONFIGURATION: ${{ inputs.configuration }}

    - name: "✅ Validate input : framework"
      if: ${{ inputs.framework != '' }}
      shell: bash
      run: |
        echo "::debug::Validating framework input: ${INPUT_FRAMEWORK}"

        if ! [[ "${INPUT_FRAMEWORK}" =~ ^(net[0-9]+\.[0-9]+|netstandard[0-9]+\.[0-9]+|netcoreapp[0-9]+\.[0-9]+|netframework[0-9]+\.[0-9]+)$ ]]; then
          echo "::warning::Framework format may be invalid: ${INPUT_FRAMEWORK}"
        fi

        echo "✅ Framework validation completed successfully"
      env:
        INPUT_FRAMEWORK: ${{ inputs.framework }}

    - name: "✅ Validate input : runtime"
      if: ${{ inputs.runtime != '' }}
      shell: bash
      run: |
        echo "::debug::Validating runtime input: ${INPUT_RUNTIME}"

        if ! [[ "${INPUT_RUNTIME}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
          echo "::warning::Runtime identifier format may be invalid: ${INPUT_RUNTIME}"
        fi

        echo "✅ Runtime validation completed successfully"
      env:
        INPUT_RUNTIME: ${{ inputs.runtime }}

    - name: "✅ Validate input : arch"
      if: ${{ inputs.arch != '' }}
      shell: bash
      run: |
        echo "::debug::Validating arch input: ${INPUT_ARCH}"

        if ! [[ "${INPUT_ARCH}" =~ ^(x86|x64|arm|arm64)$ ]]; then
          echo "::warning::Arch format may be invalid: ${INPUT_ARCH}"
        fi

        echo "✅ Arch validation completed successfully"
      env:
        INPUT_ARCH: ${{ inputs.arch }}

    # ================== 🏗️ ==================

    - name: "🔧 Set verbosity level"
      id: validate-verbosity
      shell: bash
      run: |
        if [ -n "${INPUT_VERBOSITY}" ]; then
          echo "verbosity=${INPUT_VERBOSITY}" >> $GITHUB_OUTPUT
        elif [ "$RUNNER_DEBUG" == "true" ] || [ "$ACTIONS_STEP_DEBUG" == "true" ]; then
          echo "verbosity=diagnostic" >> $GITHUB_OUTPUT
        else
          echo "verbosity=minimal" >> $GITHUB_OUTPUT
        fi
      env:
        INPUT_VERBOSITY: ${{ inputs.verbosity }}

    - name: "🏗️ Build argument list"
      id: build-args
      shell: bash
      run: |
        echo "::debug::Building argument list..."

        # Function to check command support. Uses a case statement rather than an
        # associative array (`declare -A`) because macOS runners ship Apple's system
        # Bash 3.2 (frozen pre-GPLv3), which does not support `declare -A` at all.
        supports_option() {
          local option="$1"
          local command="${INPUT_COMMAND}"
          local pattern=""
          case "$option" in
            verbosity)      pattern="build|restore|pack|publish|test|clean|msbuild|workload" ;;
            configuration)  pattern="build|publish|test|pack|run" ;;
            framework)      pattern="build|publish|test|pack|run" ;;
            runtime)        pattern="build|publish|test|pack|run" ;;
            arch)           pattern="build|publish|run" ;;
            output)         pattern="build|publish|pack|run|tool" ;;
            nologo)         pattern="build|restore|pack|publish|test|clean|msbuild|run|add|remove|list" ;;
            no-restore)     pattern="build|test|publish|pack" ;;
            no-build)       pattern="test|publish" ;;
            artifacts-path) pattern="build|restore|publish|pack|test|clean|run" ;;
          esac
          echo "$command" | grep -iqE "^($pattern)$"
        }

        # Start building arguments
        ARGUMENTS="${INPUT_COMMAND}"

        if [ -n "${INPUT_PATH}" ]; then
          ARGUMENTS="$ARGUMENTS '${STEP_NORMALIZE_PATH_NORMALIZED}'"
        fi

        # Add normalized arguments
        if [ -n "${STEP_NORMALIZE_ARGUMENTS_NORMALIZED}" ]; then
          NORMALIZED_ARGS="${STEP_NORMALIZE_ARGUMENTS_NORMALIZED}"
          echo "::debug::Original arguments: ${INPUT_ARGUMENTS}"
          echo "::debug::Normalized arguments: $NORMALIZED_ARGS"
          ARGUMENTS="$ARGUMENTS $NORMALIZED_ARGS"
        fi

        # Boolean flags
        for param in nologo no-restore no-build; do
          case $param in
            nologo) value="${INPUT_NOLOGO}" ;;
            no-restore) value="${INPUT_NO_RESTORE}" ;;
            no-build) value="${INPUT_NO_BUILD}" ;;
          esac
          if [ "$value" = "true" ] && supports_option "$param"; then
            ARGUMENTS="$ARGUMENTS --${param}"
          fi
        done

        # Key-value options
        for param in verbosity configuration framework runtime output arch artifacts-path; do
          case $param in
            verbosity) value="${STEP_VALIDATE_VERBOSITY_VERBOSITY}" ;;
            configuration) value="${INPUT_CONFIGURATION}" ;;
            framework) value="${INPUT_FRAMEWORK}" ;;
            runtime) value="${INPUT_RUNTIME}" ;;
            output) value="${STEP_NORMALIZE_OUTPUT_NORMALIZED}" ;;
            arch) value="${INPUT_ARCH}" ;;
            artifacts-path) value="${STEP_NORMALIZE_ARTIFACTS_PATH_NORMALIZED}" ;;
          esac
          if [ -n "$value" ] && supports_option "$param"; then
            ARGUMENTS="$ARGUMENTS --$param '$value'"
          fi
        done

        # Trim leading space
        ARGUMENTS="${ARGUMENTS# }"

        # Store in environment for the next step
        echo "arguments=$ARGUMENTS" >> $GITHUB_OUTPUT

        echo "✅ Argument list built successfully: $ARGUMENTS"
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_PATH: ${{ inputs.path }}
        STEP_NORMALIZE_PATH_NORMALIZED: ${{ steps.normalize-path.outputs.normalized }}
        STEP_NORMALIZE_ARGUMENTS_NORMALIZED: ${{ steps.normalize-arguments.outputs.normalized }}
        INPUT_ARGUMENTS: ${{ inputs.arguments }}
        INPUT_NOLOGO: ${{ inputs.nologo }}
        INPUT_NO_RESTORE: ${{ inputs.no-restore }}
        INPUT_NO_BUILD: ${{ inputs.no-build }}
        STEP_VALIDATE_VERBOSITY_VERBOSITY: ${{ steps.validate-verbosity.outputs.verbosity }}
        INPUT_CONFIGURATION: ${{ inputs.configuration }}
        INPUT_FRAMEWORK: ${{ inputs.framework }}
        INPUT_RUNTIME: ${{ inputs.runtime }}
        STEP_NORMALIZE_OUTPUT_NORMALIZED: ${{ steps.normalize-output.outputs.normalized }}
        INPUT_ARCH: ${{ inputs.arch }}
        STEP_NORMALIZE_ARTIFACTS_PATH_NORMALIZED: ${{ steps.normalize-artifacts-path.outputs.normalized }}

    # ================== 🚀 ==================

    - name: "🚀 Run dotnet command with auto-verbosity"
      id: run-command
      shell: bash
      working-directory: ${{ steps.normalize-working-directory.outputs.normalized }}
      run: |
        echo "::debug::Building final command from environment: ${STEP_BUILD_ARGS_ARGUMENTS}"

        # Build the full command string
        FULL_COMMAND="dotnet ${STEP_BUILD_ARGS_ARGUMENTS}"
        echo "::debug::Final command: $FULL_COMMAND"

        # Execute the command using eval for proper argument handling.
        # NOTE: this step runs under `set -e` (GitHub Actions' default shell options for
        # composite `shell: bash` steps). Running eval as a bare statement would let `-e`
        # abort the script the moment the command fails, skipping every line below -
        # including the `exit-code`/`executed-command` GITHUB_OUTPUT writes - which left
        # those outputs empty on any failure and broke downstream consumers (e.g. the
        # "Verify command execution" step below, and dotnet-nuget-upload's own
        # "Verify package upload" step). Guarding the eval in an if/else keeps `-e` from
        # firing so we always capture the real exit code.
        echo "✅ Executing: $FULL_COMMAND"
        if eval "$FULL_COMMAND"; then
          EXIT_CODE=0
        else
          EXIT_CODE=$?
        fi

        # Enhanced status reporting
        if [ $EXIT_CODE -eq 0 ]; then
          echo "✅ Command completed successfully with exit code 0"
        else
          echo "::error::Command failed with exit code $EXIT_CODE"
        fi

        # Set outputs
        echo "exit-code=$EXIT_CODE" >> $GITHUB_OUTPUT
        echo "executed-command=$FULL_COMMAND" >> $GITHUB_OUTPUT

        # Exit with the same code as the dotnet command
        exit $EXIT_CODE
      env:
        STEP_BUILD_ARGS_ARGUMENTS: ${{ steps.build-args.outputs.arguments }}

    # ================== 🔍 ==================

    - name: "🔍 Verify command execution"
      if: always()
      shell: bash
      run: |
        echo "::debug::Verifying command execution results..."

        # Check if the command executed (has exit code output)
        if [ -z "${STEP_RUN_COMMAND_EXIT_CODE}" ]; then
          echo "::error::Command execution failed - no exit code available"
          exit 1
        fi

        # Report final status
        EXIT_CODE="${STEP_RUN_COMMAND_EXIT_CODE}"
        if [ "$EXIT_CODE" = "0" ]; then
          echo "::debug::✅ .NET command '${INPUT_COMMAND}' completed successfully"
        else
          echo "::error::❌ .NET command '${INPUT_COMMAND}' failed with exit code $EXIT_CODE"
        fi

        echo "✅ Command execution verification completed"
      env:
        STEP_RUN_COMMAND_EXIT_CODE: ${{ steps.run-command.outputs.exit-code }}
        INPUT_COMMAND: ${{ inputs.command }}

    # ================== 📊 ==================

    - name: "📊 Action Summary"
      if: always() && inputs.show-summary == 'true'
      shell: bash
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        <details><summary>⚙️ .NET command : ${INPUT_COMMAND}</summary>

        ## 🔧 Input Parameters
        | Parameter | Value |
        |-----------|-------|
        | 🚀 Command | \`${INPUT_COMMAND}\` |
        | 📍 Path | \`${STEP_NORMALIZE_PATH_NORMALIZED}\` |
        | 📁 Working Directory | \`${STEP_NORMALIZE_WORKING_DIRECTORY_NORMALIZED}\` |
        | ⚙️ Configuration | \`${INPUT_CONFIGURATION}\` |
        | 🎯 Framework | \`${INPUT_FRAMEWORK}\` |
        | 🖥️ Runtime | \`${INPUT_RUNTIME}\` |
        | 🔧 Arguments | \`${STEP_NORMALIZE_ARGUMENTS_NORMALIZED}\` |
        | 🔇 No Logo | \`${INPUT_NOLOGO}\` |
        | 🚫 No Restore | \`${INPUT_NO_RESTORE}\` |
        | 🚫 No Build | \`${INPUT_NO_BUILD}\` |
        | 📤 Output Path | \`${STEP_NORMALIZE_OUTPUT_NORMALIZED}\` |
        | 🗂️ Artifacts Path | \`${STEP_NORMALIZE_ARTIFACTS_PATH_NORMALIZED}\` |
        | 🔊 Force Verbosity | \`${INPUT_VERBOSITY}\` |

        ## ⚙️ Process Details
        | Step | Status |
        |------|--------|
        | ✅ Input Validation | \`✅ Completed\` |
        | 🚀 Command Construction | \`${STEP_BUILD_ARGS_OUTCOME_LABEL}\` |
        | 🔧 Compiled Arguments | \`${STEP_BUILD_ARGS_ARGUMENTS}\` |
        | 🚀 Command Execution | \`${STEP_RUN_COMMAND_OUTCOME_LABEL}\` |

        ## 📤 Execution Results
        | Metric | Value |
        |--------|-------|
        | ✅ Exit Code | \`${STEP_RUN_COMMAND_EXIT_CODE}\` |
        | 📊 Status | \`${STEP_RUN_COMMAND_OUTCOME}\` |
        | 🚀 Executed Command | \`${STEP_RUN_COMMAND_EXECUTED_COMMAND}\` |

        </details>
        EOF
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        STEP_NORMALIZE_PATH_NORMALIZED: ${{ steps.normalize-path.outputs.normalized || 'none' }}
        STEP_NORMALIZE_WORKING_DIRECTORY_NORMALIZED: ${{ steps.normalize-working-directory.outputs.normalized }}
        INPUT_CONFIGURATION: ${{ inputs.configuration }}
        INPUT_FRAMEWORK: ${{ inputs.framework || 'none' }}
        INPUT_RUNTIME: ${{ inputs.runtime || 'none' }}
        STEP_NORMALIZE_ARGUMENTS_NORMALIZED: ${{ steps.normalize-arguments.outputs.normalized || 'none' }}
        INPUT_NOLOGO: ${{ inputs.nologo }}
        INPUT_NO_RESTORE: ${{ inputs.no-restore }}
        INPUT_NO_BUILD: ${{ inputs.no-build }}
        STEP_NORMALIZE_OUTPUT_NORMALIZED: ${{ steps.normalize-output.outputs.normalized || 'none' }}
        STEP_NORMALIZE_ARTIFACTS_PATH_NORMALIZED: ${{ steps.normalize-artifacts-path.outputs.normalized || 'none' }}
        INPUT_VERBOSITY: ${{ inputs.verbosity || 'auto' }}
        STEP_BUILD_ARGS_OUTCOME_LABEL: ${{ steps.build-args.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_BUILD_ARGS_ARGUMENTS: ${{ steps.build-args.outputs.arguments }}
        STEP_RUN_COMMAND_OUTCOME_LABEL: ${{ steps.run-command.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_RUN_COMMAND_EXIT_CODE: ${{ steps.run-command.outputs.exit-code }}
        STEP_RUN_COMMAND_OUTCOME: ${{ steps.run-command.outcome }}
        STEP_RUN_COMMAND_EXECUTED_COMMAND: ${{ steps.run-command.outputs.executed-command }}

branding:
  icon: "terminal"
  color: "blue"

# dotnet --help
# Usage: dotnet [runtime-options] [path-to-application] [arguments]

# Execute a .NET application.

# runtime-options:
#   --additionalprobingpath <path>   Path containing probing policy and assemblies to probe for.
#   --additional-deps <path>         Path to additional deps.json file.
#   --depsfile                       Path to <application>.deps.json file.
#   --fx-version <version>           Version of the installed Shared Framework to use to run the application.
#   --roll-forward <setting>         Roll forward to framework version  (LatestPatch, Minor, LatestMinor, Major, LatestMajor, Disable).
#   --runtimeconfig                  Path to <application>.runtimeconfig.json file.

# path-to-application:
#   The path to an application .dll file to execute.

# Usage: dotnet [sdk-options] [command] [command-options] [arguments]

# Execute a .NET SDK command.

# sdk-options:
#   -d|--diagnostics  Enable diagnostic output.
#   -h|--help         Show command line help.
#   --info            Display .NET information.
#   --list-runtimes   Display the installed runtimes.
#   --list-sdks       Display the installed SDKs.
#   --version         Display .NET SDK version in use.

# SDK commands:
#   build             Build a .NET project.
#   build-server      Interact with servers started by a build.
#   clean             Clean build outputs of a .NET project.
#   format            Apply style preferences to a project or solution.
#   help              Opens the reference page in a browser for the specified command.
#   msbuild           Run Microsoft Build Engine (MSBuild) commands.
#   new               Create a new .NET project or file.
#   nuget             Provides additional NuGet commands.
#   pack              Create a NuGet package.
#   package           Search for, add, remove, or list PackageReferences for a .NET project.
#   publish           Publish a .NET project for deployment.
#   reference         Add, remove, or list ProjectReferences for a .NET project.
#   restore           Restore dependencies specified in a .NET project.
#   run               Build and run a .NET project output.
#   sdk               Manage .NET SDK installation.
#   solution          Modify Visual Studio solution files.
#   store             Store the specified assemblies in the runtime package store.
#   test              Run unit tests using the test runner specified in a .NET project.
#   tool              Install or manage tools that extend the .NET experience.
#   vstest            Run Microsoft Test Engine (VSTest) commands.
#   workload          Manage optional workloads.

# Additional commands from bundled tools:
#   dev-certs         Create and manage development certificates.
#   fsi               Start F# Interactive / execute F# scripts.
#   user-jwts         Manage JSON Web Tokens in development.
#   user-secrets      Manage development user secrets.
#   watch             Start a file watcher that runs a command when files change.

# Run 'dotnet [command] --help' for more information on a command.
