name: "📖 Generate DocFX Metadata"
description: "Generates YAML metadata files from source code using DocFX .NET Global Tool"
author: "Francois Raminosona"

inputs:
  # Arguments passed to dotnet
  working-directory:
    description: "Working directory for the command"
    required: false
    default: "."
  global:
    description: "Install the DocFX .NET global tool if not already installed"
    required: false
    default: "false"
  show-summary:
    description: "Whether to show the action summary"
    required: false
    default: "false"

  # Arguments unique to DocFX Metadata
  config:
    description: "Path to the docfx configuration file (default: docfx.json)"
    required: false
    default: "docfx.json"
  output:
    description: "Specify the output base directory"
    required: false
    default: "api"
  logLevel:
    description: "Set log level to error, warning, info, verbose or diagnostic"
    required: false
    default: "info"
  logFile:
    description: "Save log as structured JSON to the specified file"
    required: false
    default: ""
  verbose:
    description: "Set log level to verbose"
    required: false
    default: "false"
  warningsAsErrors:
    description: "Treats warnings as errors"
    required: false
    default: "false"
  shouldSkipMarkup:
    description: "Skip to markup the triple slash comments"
    required: false
    default: "false"
  outputFormat:
    description: "Specify the output type (mref, markdown, apiPage)"
    required: false
    default: "mref"
  filterFile:
    description: "Specify the filter config file"
    required: false
    default: ""
  globalNamespaceId:
    description: "Specify the name to use for the global namespace"
    required: false
    default: ""
  property:
    description: "MSBuild properties in JSON format (e.g., {'Configuration':'Release','Platform':'Any CPU'})"
    required: false
    default: ""
  disableGitFeatures:
    description: "Disable fetching Git related information for articles"
    required: false
    default: "false"
  disableDefaultFilter:
    description: "Disable the default API filter (default filter only generate public or protected APIs)"
    required: false
    default: "false"
  noRestore:
    description: "Do not run dotnet restore before building the projects"
    required: false
    default: "false"
  namespaceLayout:
    description: "Determines the namespace layout in table of contents (Flattened, Nested)"
    required: false
    default: "Flattened"
  memberLayout:
    description: "Determines the member page layout (SamePage, SeparatePages)"
    required: false
    default: "SamePage"
  useClrTypeNames:
    description: "Indicates whether the CLR type names or the language aliases must be used"
    required: false
    default: "false"
  docfx-version:
    description: "Version of DocFX tool to install"
    required: false
    default: ""

outputs:
  exit-code:
    description: "Exit code of the dotnet command"
    value: ${{ steps.run-dotnet.outputs.exit-code }}
  executed-command:
    description: "The actual command that was executed"
    value: ${{ steps.run-dotnet.outputs.executed-command }}

runs:
  using: "composite"
  steps:

    # ================== ℹ️ ==================

    - name: "ℹ️ Gather environment information"
      shell: bash
      run: |
        echo "::debug::Operating System: $(uname -a)"
        echo "::debug::GitHub Runner OS: $RUNNER_OS"
        echo "::debug::GitHub Runner Version: $RUNNER_VERSION"
        echo "::debug::.NET SDK Version: $(dotnet --version || echo 'Not installed')"

    # ================== 🔒 ==================

    - name: "🔒 Mask sensitive data"
      shell: bash
      run: |
        # No sensitive inputs to mask in this action
        echo "✅ No sensitive data to mask"

    # ================== 📁 ==================

    - name: "📁 Normalize config"
      id: normalize-config
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.config }}

    - name: "📁 Normalize output"
      id: normalize-output
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.output }}

    - name: "📁 Normalize filter"
      id: normalize-filter
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.filter }}

    - name: "📁 Normalize logFile"
      id: normalize-logfile
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.logFile }}

    # ================== ✅ ==================

    - name: "✅ Validate input : booleans"
      shell: bash
      run: |
        echo "::debug::Validating boolean inputs for DocFX metadata generation"

        for param in verbose warningsAsErrors shouldSkipMarkup disableGitFeatures disableDefaultFilter noRestore useClrTypeNames; do
          case $param in
            verbose) value="${INPUT_VERBOSE}" ;;
            warningsAsErrors) value="${INPUT_WARNINGSASERRORS}" ;;
            shouldSkipMarkup) value="${INPUT_SHOULDSKIPMARKUP}" ;;
            disableGitFeatures) value="${INPUT_DISABLEGITFEATURES}" ;;
            disableDefaultFilter) value="${INPUT_DISABLEDEFAULTFILTER}" ;;
            noRestore) value="${INPUT_NORESTORE}" ;;
            useClrTypeNames) value="${INPUT_USECLRTYPENAMES}" ;;
          esac
          if [ -n "$value" ] && [ "$value" != "true" ] && [ "$value" != "false" ]; then
            echo "::error::Parameter $param must be 'true' or 'false', got: $value"
            exit 1
          fi
        done

        echo "✅ Boolean input validation completed successfully"
      env:
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_WARNINGSASERRORS: ${{ inputs.warningsAsErrors }}
        INPUT_SHOULDSKIPMARKUP: ${{ inputs.shouldSkipMarkup }}
        INPUT_DISABLEGITFEATURES: ${{ inputs.disableGitFeatures }}
        INPUT_DISABLEDEFAULTFILTER: ${{ inputs.disableDefaultFilter }}
        INPUT_NORESTORE: ${{ inputs.noRestore }}
        INPUT_USECLRTYPENAMES: ${{ inputs.useClrTypeNames }}

    - name: "✅ Validate input : config"
      if: ${{ inputs.config != '' }}
      shell: bash
      run: |
        echo "::debug::Validating config input for DocFX metadata generation"

        if [ ! -f "${STEP_NORMALIZE_CONFIG_NORMALIZED}" ]; then
          echo "::error file=${STEP_NORMALIZE_CONFIG_NORMALIZED}::DocFX configuration file not found: ${STEP_NORMALIZE_CONFIG_NORMALIZED}"
          exit 1
        fi

        echo "✅ Config input validation completed successfully"
      env:
        STEP_NORMALIZE_CONFIG_NORMALIZED: ${{ steps.normalize-config.outputs.normalized }}

    - name: "✅ Validate input : logLevel"
      if: ${{ inputs.logLevel != '' && inputs.logLevel != 'info' }}
      shell: bash
      run: |
        echo "::debug::Validating logLevel input for DocFX metadata generation"

        case "${INPUT_LOGLEVEL}" in
          error|warning|info|verbose|diagnostic) ;;
          *) echo "::error::Invalid logLevel. Must be one of: error, warning, info, verbose, diagnostic"; exit 1 ;;
        esac

        echo "✅ Log-level input validation completed successfully"
      env:
        INPUT_LOGLEVEL: ${{ inputs.logLevel }}

    - name: "✅ Validate input : outputFormat"
      if: ${{ inputs.outputFormat != '' && inputs.outputFormat != 'mref' }}
      shell: bash
      run: |
        echo "::debug::Validating outputFormat input for DocFX metadata generation"

        case "${INPUT_OUTPUTFORMAT}" in
          mref|markdown|apiPage) ;;
          *) echo "::error::Invalid output format. Must be one of: mref, markdown, apiPage"; exit 1 ;;
        esac

        echo "✅ Output format validation completed successfully"
      env:
        INPUT_OUTPUTFORMAT: ${{ inputs.outputFormat }}

    - name: "✅ Validate input : namespaceLayout"
      if: ${{ inputs.namespaceLayout != '' && inputs.namespaceLayout != 'Flattened' }}
      shell: bash
      run: |
        echo "::debug::Validating namespaceLayout input for DocFX metadata generation"

        case "${INPUT_NAMESPACELAYOUT}" in
          Flattened|Nested) ;;
          *) echo "::error::Invalid namespace layout. Must be one of: Flattened, Nested"; exit 1 ;;
        esac

        echo "✅ Namespace layout validation completed successfully"
      env:
        INPUT_NAMESPACELAYOUT: ${{ inputs.namespaceLayout }}

    - name: "✅ Validate input : memberLayout"
      if: ${{ inputs.memberLayout != '' && inputs.memberLayout != 'SamePage' }}
      shell: bash
      run: |
        echo "::debug::Validating memberLayout input for DocFX metadata generation"

        case "${INPUT_MEMBERLAYOUT}" in
          SamePage|SeparatePages) ;;
          *) echo "::error::Invalid member layout. Must be one of: SamePage, SeparatePages"; exit 1 ;;
        esac

        echo "✅ Member layout validation completed successfully"
      env:
        INPUT_MEMBERLAYOUT: ${{ inputs.memberLayout }}

    - name: "✅ Validate input : property"
      if: ${{ inputs.property != '' }}
      shell: bash
      run: |
        echo "::debug::Validating property input for DocFX metadata generation"

        if ! echo "${INPUT_PROPERTY}" | jq empty >/dev/null 2>&1; then
          echo "::error::Property must be a valid JSON string, got: ${INPUT_PROPERTY}"
          exit 1
        fi

        echo "✅ Property input validation completed successfully"
      env:
        INPUT_PROPERTY: ${{ inputs.property }}

    - name: "✅ Validate input : filter"
      if: ${{ inputs.filter != '' }}
      shell: bash
      run: |
        echo "::debug::Validating filter input for DocFX metadata generation"

        if [ ! -f "${STEP_NORMALIZE_FILTER_NORMALIZED}" ]; then
          echo "::error file=${STEP_NORMALIZE_FILTER_NORMALIZED}::Filter config file not found: ${STEP_NORMALIZE_FILTER_NORMALIZED}"
          exit 1
        fi

        echo "✅ Filter input validation completed successfully"
      env:
        STEP_NORMALIZE_FILTER_NORMALIZED: ${{ steps.normalize-filter.outputs.normalized }}

    - name: "✅ Validate input : docfx-version"
      if: ${{ inputs.docfx-version != '' }}
      shell: bash
      run: |
        echo "::debug::Validating docfx-version input for DocFX metadata generation"

        if ! [[ "${INPUT_DOCFX_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::warning::Version format may be invalid. Expected format: X.Y.Z, got: ${INPUT_DOCFX_VERSION}"
        fi

        echo "✅ docfx-version input validation completed successfully"
      env:
        INPUT_DOCFX_VERSION: ${{ inputs.docfx-version }}

    # ================== 🏗️ ==================

    - name: "🔧 Build arguments"
      id: build-args
      shell: bash
      run: |
        echo "::debug::Building arguments for DocFX metadata generation"

        # Start with base command
        ARGS="run docfx metadata"

        # Add config file path
        if [ -n "${STEP_NORMALIZE_CONFIG_NORMALIZED}" ]; then
          ARGS="$ARGS '${STEP_NORMALIZE_CONFIG_NORMALIZED}'"
        fi

        # Key-value options (only add if not empty)
        for param in filter globalNamespaceId output log property; do
          case $param in
            filter) value="${STEP_NORMALIZE_FILTER_NORMALIZED}" ;;
            globalNamespaceId) value="${INPUT_GLOBALNAMESPACEID}" ;;
            output) value="${STEP_NORMALIZE_OUTPUT_NORMALIZED}" ;;
            log) value="${STEP_NORMALIZE_LOGFILE_NORMALIZED}" ;;
            property) value="${INPUT_PROPERTY}" ;;
          esac
          if [ -n "$value" ]; then
            ARGS="$ARGS --$param '$value'"
          fi
        done

        # Boolean flags
        for param in verbose warningsAsErrors shouldSkipMarkup disableGitFeatures disableDefaultFilter noRestore useClrTypeNames; do
          case $param in
            verbose) value="${INPUT_VERBOSE}" ;;
            warningsAsErrors) value="${INPUT_WARNINGSASERRORS}" ;;
            shouldSkipMarkup) value="${INPUT_SHOULDSKIPMARKUP}" ;;
            disableGitFeatures) value="${INPUT_DISABLEGITFEATURES}" ;;
            disableDefaultFilter) value="${INPUT_DISABLEDEFAULTFILTER}" ;;
            noRestore) value="${INPUT_NORESTORE}" ;;
            useClrTypeNames) value="${INPUT_USECLRTYPENAMES}" ;;
          esac
          if [ "$value" == "true" ]; then
            ARGS="$ARGS --${param}"
          fi
        done

        # Handle parameters with meaningful defaults
        if [ "${INPUT_LOGLEVEL}" != "info" ]; then
          ARGS="$ARGS --logLevel '${INPUT_LOGLEVEL}'"
        fi

        if [ "${INPUT_OUTPUTFORMAT}" != "mref" ]; then
          ARGS="$ARGS --outputFormat '${INPUT_OUTPUTFORMAT}'"
        fi

        if [ "${INPUT_NAMESPACELAYOUT}" != "Flattened" ]; then
          ARGS="$ARGS --namespaceLayout '${INPUT_NAMESPACELAYOUT}'"
        fi

        if [ "${INPUT_MEMBERLAYOUT}" != "SamePage" ]; then
          ARGS="$ARGS --memberLayout '${INPUT_MEMBERLAYOUT}'"
        fi

        echo "::debug::Generated arguments: $ARGS"
        echo "arguments=$ARGS" >> $GITHUB_OUTPUT
        echo "✅ Arguments built successfully"
      env:
        STEP_NORMALIZE_CONFIG_NORMALIZED: ${{ steps.normalize-config.outputs.normalized }}
        STEP_NORMALIZE_FILTER_NORMALIZED: ${{ steps.normalize-filter.outputs.normalized }}
        INPUT_GLOBALNAMESPACEID: ${{ inputs.globalNamespaceId }}
        STEP_NORMALIZE_OUTPUT_NORMALIZED: ${{ steps.normalize-output.outputs.normalized }}
        STEP_NORMALIZE_LOGFILE_NORMALIZED: ${{ steps.normalize-logfile.outputs.normalized }}
        INPUT_PROPERTY: ${{ inputs.property }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_WARNINGSASERRORS: ${{ inputs.warningsAsErrors }}
        INPUT_SHOULDSKIPMARKUP: ${{ inputs.shouldSkipMarkup }}
        INPUT_DISABLEGITFEATURES: ${{ inputs.disableGitFeatures }}
        INPUT_DISABLEDEFAULTFILTER: ${{ inputs.disableDefaultFilter }}
        INPUT_NORESTORE: ${{ inputs.noRestore }}
        INPUT_USECLRTYPENAMES: ${{ inputs.useClrTypeNames }}
        INPUT_LOGLEVEL: ${{ inputs.logLevel }}
        INPUT_OUTPUTFORMAT: ${{ inputs.outputFormat }}
        INPUT_NAMESPACELAYOUT: ${{ inputs.namespaceLayout }}
        INPUT_MEMBERLAYOUT: ${{ inputs.memberLayout }}

    # ================== 🚀 ==================

    - name: "📦 Install DocFX tool"
      uses: "laerdal/github_actions/dotnet-tool-install@main"
      with:
        tool-name: "docfx"
        global: ${{ inputs.global }}
        create-manifest-if-needed: "true"
        version: ${{ inputs.docfx-version }}

    - name: "📖 Generate metadata with DocFX"
      id: run-dotnet
      uses: "laerdal/github_actions/dotnet@main"
      with:
        command: "tool"
        working-directory: ${{ inputs.working-directory }}
        arguments: ${{ steps.build-args.outputs.arguments }}
        show-summary: "${{ inputs.show-summary }}"

    # ================== 📊 ==================

    - name: "📊 Action Summary"
      if: always() && inputs.show-summary == 'true'
      shell: bash
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        <details><summary>📄 DocFX Metadata</summary>

        ## 🔧 Input Parameters
        | Parameter | Value |
        |-----------|-------|
        | 📋 Config File | \`${STEP_NORMALIZE_CONFIG_NORMALIZED}\` |
        | 📁 Output Directory | \`${STEP_NORMALIZE_OUTPUT_NORMALIZED}\` |
        | 📊 Log Level | \`${INPUT_LOGLEVEL}\` |
        | 📄 Log File | \`${STEP_NORMALIZE_LOGFILE_NORMALIZED}\` |
        | 📄 Output Format | \`${INPUT_OUTPUTFORMAT}\` |
        | 🌐 Namespace Layout | \`${INPUT_NAMESPACELAYOUT}\` |
        | 👥 Member Layout | \`${INPUT_MEMBERLAYOUT}\` |

        ## 📤 Generation Results
        | Metric | Value |
        |--------|-------|
        | 📄 Output Format | \`${INPUT_OUTPUTFORMAT}\` |

        ## ⚙️ Configuration Options
        | Option | Status |
        |--------|--------|
        | 🔍 Verbose Logging | \`${INPUT_VERBOSE}\` |
        | ⚠️ Warnings as Errors | \`${INPUT_WARNINGSASERRORS}\` |
        | 📝 Skip Markup | \`${INPUT_SHOULDSKIPMARKUP}\` |
        | 🚫 Disable Git Features | \`${INPUT_DISABLEGITFEATURES}\` |
        | 🚫 Disable Default Filter | \`${INPUT_DISABLEDEFAULTFILTER}\` |
        | 🚫 No Restore | \`${INPUT_NORESTORE}\` |
        | 🔤 Use CLR Type Names | \`${INPUT_USECLRTYPENAMES}\` |

        ## 🔧 Process Details
        | Step | Status |
        |------|--------|
        | ✅ Input Validation | \`✅ Completed\` |
        | 📦 Tool Installation | \`✅ Completed\` |
        | 📖 Metadata Generation | \`${STEP_RUN_DOTNET_OUTCOME_LABEL}\` |

        </details>
        EOF
      env:
        STEP_NORMALIZE_CONFIG_NORMALIZED: ${{ steps.normalize-config.outputs.normalized }}
        STEP_NORMALIZE_OUTPUT_NORMALIZED: ${{ steps.normalize-output.outputs.normalized }}
        INPUT_LOGLEVEL: ${{ inputs.logLevel }}
        STEP_NORMALIZE_LOGFILE_NORMALIZED: ${{ steps.normalize-logfile.outputs.normalized }}
        INPUT_OUTPUTFORMAT: ${{ inputs.outputFormat }}
        INPUT_NAMESPACELAYOUT: ${{ inputs.namespaceLayout }}
        INPUT_MEMBERLAYOUT: ${{ inputs.memberLayout }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_WARNINGSASERRORS: ${{ inputs.warningsAsErrors }}
        INPUT_SHOULDSKIPMARKUP: ${{ inputs.shouldSkipMarkup }}
        INPUT_DISABLEGITFEATURES: ${{ inputs.disableGitFeatures }}
        INPUT_DISABLEDEFAULTFILTER: ${{ inputs.disableDefaultFilter }}
        INPUT_NORESTORE: ${{ inputs.noRestore }}
        INPUT_USECLRTYPENAMES: ${{ inputs.useClrTypeNames }}
        STEP_RUN_DOTNET_OUTCOME_LABEL: ${{ steps.run-dotnet.outcome == 'success' && '✅ Completed' || '❌ Failed' }}

branding:
  icon: "file-text"
  color: "blue"

# dotnet docfx metadata --help
# USAGE:
#     docfx metadata [config] [OPTIONS]

# ARGUMENTS:
#     [config]    Path to docfx.json

# OPTIONS:
#     -h, --help                    Prints help information
#     -l, --log                     Save log as structured JSON to the specified file
#         --logLevel                Set log level to error, warning, info, verbose or diagnostic
#         --verbose                 Set log level to verbose
#         --warningsAsErrors        Treats warnings as errors
#         --shouldSkipMarkup        Skip to markup the triple slash comments
#     -o, --output                  Specify the output base directory
#         --outputFormat            Specify the output type
#         --filter                   Specify the filter config file
#         --globalNamespaceId       Specify the name to use for the global namespace
#         --property                --property <n1>=<v1>;<n2>=<v2> An optional set of MSBuild properties used when interpreting project files. These are the same properties that are passed to MSBuild via
#                                   the /property:<n1>=<v1>;<n2>=<v2> command line argument
#         --disableGitFeatures      Disable fetching Git related information for articles. By default it is enabled and may have side effect on performance when the repo is large
#         --disableDefaultFilter    Disable the default API filter (default filter only generate public or protected APIs)
#         --noRestore               Do not run `dotnet restore` before building the projects
#         --categoryLayout          Determines the category layout in table of contents
#         --namespaceLayout         Determines the namespace layout in table of contents
#         --memberLayout            Determines the member page layout
