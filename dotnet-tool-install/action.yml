name: "🔧 Install .NET Tool"
description: "Installs a .NET global or local tool with automatic tool manifest creation"
author: "Francois Raminosona"

inputs:
  # Arguments passed to dotnet
  working-directory:
    description: "Working directory for the installation (only relevant for local tools)"
    required: false
    default: "."
  framework:
    description: "Target framework for the tool"
    required: false
    default: ""
  verbosity:
    description: "Verbosity level (quiet, minimal, normal, detailed, diagnostic)"
    required: false
    default: ""
  arch:
    description: "Target architecture (e.g., 'x64', 'arm64')"
    required: false
    default: ""
  arguments:
    description: "Additional arguments to pass to the dotnet command"
    required: false
    default: ""
  show-summary:
    description: "Whether to show the action summary"
    required: false
    default: "false"

  # Arguments unique to command
  tool-name:
    description: "Name of the .NET tool to install (e.g., 'dotnet-ef', 'dotnet-outdated')"
    required: true
  version:
    description: "Specific version of the tool to install (optional, uses latest if not specified)"
    required: false
    default: ""
  global:
    description: "Install as global tool (true) or local tool (false)"
    required: false
    default: "false"
  prerelease:
    description: "Include prerelease versions when searching for the tool"
    required: false
    default: "false"
  disable-parallel:
    description: "Disable parallel restore (only relevant for local tools)"
    required: false
    default: "false"
  ignore-failed-sources:
    description: "Ignore failed sources (only relevant for local tools)"
    required: false
    default: "false"
  no-http-cache:
    description: "Disable HTTP cache (only relevant for local tools)"
    required: false
    default: "false"
  create-manifest-if-needed:
    description: "Create a tool manifest if one does not exist (only relevant for local tools)"
    required: false
    default: "true"
  allow-downgrade:
    description: "Allow package downgrade when installing the tool"
    required: false
    default: "false"
  allow-roll-forward:
    description: "Allow the tool to roll forward to newer versions of the .NET runtime"
    required: false
    default: "false"
  tool-path:
    description: "Custom tool path for global tool installation"
    required: false
    default: ""
  add-source:
    description: "Additional NuGet source to use when installing the tool"
    required: false
    default: ""
  source:
    description: "NuGet source to use when installing the tool (replaces all default sources)"
    required: false
    default: ""
  configfile:
    description: "NuGet configuration file to use"
    required: false
    default: ""
  tool-manifest:
    description: "Path to the manifest file for local tools"
    required: false
    default: ""

outputs:
  exit-code:
    description: "Exit code of the tool installation command"
    value: ${{ steps.run-dotnet.outputs.exit-code }}
  executed-command:
    description: "The actual command that was executed"
    value: ${{ steps.run-dotnet.outputs.executed-command }}
  tool-installed:
    description: "Whether the tool was successfully installed"
    value: ${{ steps.check-installed.outputs.has-been-installed }}

runs:
  using: "composite"
  steps:
    # ================== ℹ️ ==================

    - name: "ℹ️ Gather environment information"
      shell: bash
      run: |
        echo "::debug::Operating System: $(uname -a)"
        echo "::debug::GitHub Runner OS: $RUNNER_OS"
        echo "::debug::GitHub Runner Version: $RUNNER_VERSION"
        echo "::debug::.NET SDK Version: $(dotnet --version || echo 'Not installed')"

    # ================== 🔒 ==================

    - name: "🔒 Mask sensitive data"
      shell: bash
      run: |
        # No sensitive inputs to mask in this action
        echo "✅ No sensitive data to mask"

    # ================== 📁 ==================

    - name: "💯 Normalize arguments"
      id: normalize-arguments
      uses: laerdal/github_actions/normalize-arguments@main
      with:
        arguments: ${{ inputs.arguments }}

    - name: "📁 Normalize working-directory"
      id: normalize-working-directory
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.working-directory }}

    - name: "📁 Normalize tool-path"
      id: normalize-tool-path
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.tool-path }}

    - name: "📁 Normalize configfile"
      id: normalize-configfile
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.configfile }}

    - name: "📁 Normalize tool-manifest"
      id: normalize-tool-manifest
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.tool-manifest }}

    # ================== ✅ ==================

    - name: "✅ Validate input : tool-name"
      shell: bash
      run: |
        echo "::debug::Validating tool name input: ${INPUT_TOOL_NAME}"

        if [ -z "${INPUT_TOOL_NAME}" ]; then
          echo "::error::Tool name is required"
          exit 1
        fi

        echo "✅ Tool name validation completed successfully"
      env:
        INPUT_TOOL_NAME: ${{ inputs.tool-name }}

    - name: "✅ Validate input : booleans"
      shell: bash
      run: |
        echo "::debug::Validating boolean inputs..."
        for param in global prerelease disable-parallel ignore-failed-sources no-http-cache create-manifest-if-needed allow-downgrade allow-roll-forward; do
          case $param in
            global) value="${INPUT_GLOBAL}" ;;
            prerelease) value="${INPUT_PRERELEASE}" ;;
            disable-parallel) value="${INPUT_DISABLE_PARALLEL}" ;;
            ignore-failed-sources) value="${INPUT_IGNORE_FAILED_SOURCES}" ;;
            no-http-cache) value="${INPUT_NO_HTTP_CACHE}" ;;
            create-manifest-if-needed) value="${INPUT_CREATE_MANIFEST_IF_NEEDED}" ;;
            allow-downgrade) value="${INPUT_ALLOW_DOWNGRADE}" ;;
            allow-roll-forward) value="${INPUT_ALLOW_ROLL_FORWARD}" ;;
          esac
          if [ -n "$value" ] && [ "$value" != "true" ] && [ "$value" != "false" ]; then
            echo "::error::Parameter $param must be 'true' or 'false', got: $value"
            exit 1
          fi
        done

        echo "✅ Boolean inputs validation completed successfully"
      env:
        INPUT_GLOBAL: ${{ inputs.global }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
        INPUT_DISABLE_PARALLEL: ${{ inputs.disable-parallel }}
        INPUT_IGNORE_FAILED_SOURCES: ${{ inputs.ignore-failed-sources }}
        INPUT_NO_HTTP_CACHE: ${{ inputs.no-http-cache }}
        INPUT_CREATE_MANIFEST_IF_NEEDED: ${{ inputs.create-manifest-if-needed }}
        INPUT_ALLOW_DOWNGRADE: ${{ inputs.allow-downgrade }}
        INPUT_ALLOW_ROLL_FORWARD: ${{ inputs.allow-roll-forward }}

    - name: "✅ Validate input : version"
      if: ${{ inputs.version != '' }}
      shell: bash
      run: |
        echo "::debug::Validating tool version input: ${INPUT_VERSION}"

        if ! [[ "${INPUT_VERSION}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.-]+)?$ ]]; then
          echo "::error::Tool version must be a valid semantic version (e.g., '1.2.3' or '1.2.3-beta')"
          exit 1
        fi

        echo "✅ Tool version validation completed successfully"
      env:
        INPUT_VERSION: ${{ inputs.version }}

    - name: "✅ Validate input : configfile"
      if: ${{ inputs.configfile != '' }}
      shell: bash
      run: |
        echo "::debug::Validating configfile input: ${STEP_NORMALIZE_CONFIGFILE_NORMALIZED}"

        if [ "${STEP_NORMALIZE_CONFIGFILE_EXISTS}" != "true" ]; then
          echo "::error file=${STEP_NORMALIZE_CONFIGFILE_NORMALIZED}::Configuration file not found: ${STEP_NORMALIZE_CONFIGFILE_NORMALIZED}"
          exit 1
        fi

        echo "✅ Configfile validation completed successfully"
      env:
        STEP_NORMALIZE_CONFIGFILE_NORMALIZED: ${{ steps.normalize-configfile.outputs.normalized }}
        STEP_NORMALIZE_CONFIGFILE_EXISTS: ${{ steps.normalize-configfile.outputs.exists }}

    - name: "✅ Validate input : tool-path"
      if: ${{ inputs.tool-path != '' }}
      shell: bash
      run: |
        echo "::debug::Validating tool-path input: ${STEP_NORMALIZE_TOOL_PATH_NORMALIZED}"

        # Check if parent directory exists (tool-path directory will be created if needed)
        PARENT_DIR=$(dirname "${STEP_NORMALIZE_TOOL_PATH_NORMALIZED}")
        if [ ! -d "$PARENT_DIR" ]; then
          echo "::error::Parent directory for tool path does not exist: $PARENT_DIR"
          exit 1
        fi

        echo "✅ Tool path validation completed successfully"
      env:
        STEP_NORMALIZE_TOOL_PATH_NORMALIZED: ${{ steps.normalize-tool-path.outputs.normalized }}

    - name: "✅ Validate input : add-source"
      if: ${{ inputs.add-source != '' }}
      shell: bash
      run: |
        echo "::debug::Validating add-source input: ${INPUT_ADD_SOURCE}"

        if [[ ! "${INPUT_ADD_SOURCE}" =~ ^https?:// ]]; then
          echo "::error::Additional source must be a valid URL starting with http:// or https://: ${INPUT_ADD_SOURCE}"
          exit 1
        fi

        echo "✅ Add-source validation completed successfully"
      env:
        INPUT_ADD_SOURCE: ${{ inputs.add-source }}

    - name: "✅ Validate input : source"
      if: ${{ inputs.source != '' }}
      shell: bash
      run: |
        echo "::debug::Validating source input: ${INPUT_SOURCE}"

        if [[ ! "${INPUT_SOURCE}" =~ ^https?:// ]]; then
          echo "::error::Source must be a valid URL starting with http:// or https://: ${INPUT_SOURCE}"
          exit 1
        fi

        echo "✅ Source validation completed successfully"
      env:
        INPUT_SOURCE: ${{ inputs.source }}

    # ================== 🏗️ ==================

    - name: "🏗️ Build argument list"
      id: build-args
      shell: bash
      run: |
        echo "::debug::Building argument list..."

        # Start with base arguments
        ARGUMENTS="install '${INPUT_TOOL_NAME}'"

        # Boolean flags
        for param in prerelease disable-parallel ignore-failed-sources no-http-cache create-manifest-if-needed allow-downgrade allow-roll-forward; do
          case $param in
            prerelease) value="${INPUT_PRERELEASE}" ;;
            disable-parallel) value="${INPUT_DISABLE_PARALLEL}" ;;
            ignore-failed-sources) value="${INPUT_IGNORE_FAILED_SOURCES}" ;;
            no-http-cache) value="${INPUT_NO_HTTP_CACHE}" ;;
            create-manifest-if-needed) value="${INPUT_CREATE_MANIFEST_IF_NEEDED}" ;;
            allow-downgrade) value="${INPUT_ALLOW_DOWNGRADE}" ;;
            allow-roll-forward) value="${INPUT_ALLOW_ROLL_FORWARD}" ;;
          esac
          if [ "$value" = "true" ]; then
            ARGUMENTS="$ARGUMENTS --${param}"
          fi
        done

        if [ -n "${INPUT_GLOBAL}" ]; then
          if [ "${INPUT_GLOBAL}" = "true" ]; then
            ARGUMENTS="$ARGUMENTS --global"
          else
            ARGUMENTS="$ARGUMENTS --local"
          fi
        fi

        # Key-value options with normalized paths
        for param in version tool-path add-source source configfile tool-manifest; do
          case $param in
            version) value="${INPUT_VERSION}" ;;
            tool-path) value="${STEP_NORMALIZE_TOOL_PATH_NORMALIZED}" ;;
            add-source) value="${INPUT_ADD_SOURCE}" ;;
            source) value="${INPUT_SOURCE}" ;;
            configfile) value="${STEP_NORMALIZE_CONFIGFILE_NORMALIZED}" ;;
            tool-manifest) value="${STEP_NORMALIZE_TOOL_MANIFEST_NORMALIZED}" ;;
          esac
          if [ -n "$value" ]; then
            ARGUMENTS="$ARGUMENTS --$param '$value'"
          fi
        done

        # Add normalized arguments
        if [ -n "${STEP_NORMALIZE_ARGUMENTS_NORMALIZED}" ]; then
          NORMALIZED_ARGS="${STEP_NORMALIZE_ARGUMENTS_NORMALIZED}"
          echo "::debug::Original arguments: ${INPUT_ARGUMENTS}"
          echo "::debug::Normalized arguments: $NORMALIZED_ARGS"
          ARGUMENTS="$ARGUMENTS $NORMALIZED_ARGS"
        fi

        # Trim leading space
        ARGUMENTS="${ARGUMENTS# }"

        echo "arguments=$ARGUMENTS" >> $GITHUB_OUTPUT
        echo "✅ Argument list built successfully: $ARGUMENTS"
      env:
        INPUT_TOOL_NAME: ${{ inputs.tool-name }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
        INPUT_DISABLE_PARALLEL: ${{ inputs.disable-parallel }}
        INPUT_IGNORE_FAILED_SOURCES: ${{ inputs.ignore-failed-sources }}
        INPUT_NO_HTTP_CACHE: ${{ inputs.no-http-cache }}
        INPUT_CREATE_MANIFEST_IF_NEEDED: ${{ inputs.create-manifest-if-needed }}
        INPUT_ALLOW_DOWNGRADE: ${{ inputs.allow-downgrade }}
        INPUT_ALLOW_ROLL_FORWARD: ${{ inputs.allow-roll-forward }}
        INPUT_GLOBAL: ${{ inputs.global }}
        INPUT_VERSION: ${{ inputs.version }}
        STEP_NORMALIZE_TOOL_PATH_NORMALIZED: ${{ steps.normalize-tool-path.outputs.normalized }}
        INPUT_ADD_SOURCE: ${{ inputs.add-source }}
        INPUT_SOURCE: ${{ inputs.source }}
        STEP_NORMALIZE_CONFIGFILE_NORMALIZED: ${{ steps.normalize-configfile.outputs.normalized }}
        STEP_NORMALIZE_TOOL_MANIFEST_NORMALIZED: ${{ steps.normalize-tool-manifest.outputs.normalized }}
        STEP_NORMALIZE_ARGUMENTS_NORMALIZED: ${{ steps.normalize-arguments.outputs.normalized }}
        INPUT_ARGUMENTS: ${{ inputs.arguments }}

    # ================== 🚀 ==================

    - name: "🔧 Install .NET tool"
      id: run-dotnet
      uses: "laerdal/github_actions/dotnet@main"
      with:
        command: "tool"
        working-directory: ${{ steps.normalize-working-directory.outputs.normalized }}
        framework: ${{ inputs.framework }}
        verbosity: ${{ inputs.verbosity }}
        arch: ${{ inputs.arch }}
        arguments: ${{ steps.build-args.outputs.arguments }}
        show-summary: ${{ inputs.show-summary }}

    # ================== 🔍 ==================

    - name: "🔍 Verify tool installation"
      id: check-installed
      shell: bash
      working-directory: ${{ steps.normalize-working-directory.outputs.normalized }}
      run: |
        echo "::debug::Verifying installation of tool '${INPUT_TOOL_NAME}'..."

        if [ "${INPUT_GLOBAL}" == "true" ]; then
          if dotnet tool list -g | grep -iq "^${INPUT_TOOL_NAME} "; then
            echo "✅ Tool '${INPUT_TOOL_NAME}' is now installed globally."
            echo "has-been-installed=true" >> $GITHUB_OUTPUT
          else
            echo "::error::Tool '${INPUT_TOOL_NAME}' installation failed or tool not found globally."
            echo "has-been-installed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        else
          if dotnet tool list | grep -iq "^${INPUT_TOOL_NAME} "; then
            echo "✅ Tool '${INPUT_TOOL_NAME}' is now installed locally."
            echo "has-been-installed=true" >> $GITHUB_OUTPUT
          else
            echo "::error::Tool '${INPUT_TOOL_NAME}' installation failed or tool not found locally."
            echo "has-been-installed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        fi

        echo "✅ Tool '${INPUT_TOOL_NAME}' installation verification completed"
      env:
        INPUT_TOOL_NAME: ${{ inputs.tool-name }}
        INPUT_GLOBAL: ${{ inputs.global }}

    # ================== 📊 ==================

    - name: "📊 Action Summary"
      if: always() && inputs.show-summary == 'true'
      shell: bash
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        <details><summary>🔧 .NET Tool Install : ${INPUT_TOOL_NAME} ${INPUT_VERSION}</summary>

        ## 🔧 Input Parameters
        | Parameter | Value |
        |-----------|-------|
        | � Working Directory | \`${STEP_NORMALIZE_WORKING_DIRECTORY_NORMALIZED}\` |
        | ⚙️ Framework | \`${INPUT_FRAMEWORK}\` |
        | 🔊 Verbosity | \`${INPUT_VERBOSITY}\` |
        | 🏗️ Architecture | \`${INPUT_ARCH}\` |
        | 🔧 Arguments | \`${STEP_NORMALIZE_ARGUMENTS_NORMALIZED}\` |
        | �🔧 Tool Name | \`${INPUT_TOOL_NAME}\` |
        | 📦 Tool Version | \`${INPUT_VERSION}\` |
        | 🌍 Global Install | \`${INPUT_GLOBAL}\` |
        | 🧪 Include Prerelease | \`${INPUT_PRERELEASE}\` |
        | 🛤️ Tool Path | \`${STEP_NORMALIZE_TOOL_PATH_NORMALIZED}\` |
        | 🔗 Additional Source | \`${INPUT_ADD_SOURCE}\` |
        | 🔄 Replace Sources | \`${INPUT_SOURCE}\` |
        | ⚙️ Config File | \`${STEP_NORMALIZE_CONFIGFILE_NORMALIZED}\` |
        | 📄 Tool Manifest | \`${STEP_NORMALIZE_TOOL_MANIFEST_NORMALIZED}\` |
        | 📊 Allow Downgrade | \`${INPUT_ALLOW_DOWNGRADE}\` |
        | ➡️ Allow Roll Forward | \`${INPUT_ALLOW_ROLL_FORWARD}\` |
        | 🛠️ Disable Parallel Restore | \`${INPUT_DISABLE_PARALLEL}\` |
        | ⚠️ Ignore Failed Sources | \`${INPUT_IGNORE_FAILED_SOURCES}\` |
        | 🚫 No HTTP Cache | \`${INPUT_NO_HTTP_CACHE}\` |
        | 🆕 Create Manifest If Needed | \`${INPUT_CREATE_MANIFEST_IF_NEEDED}\` |

        ## 📤 Execution Results
        | Metric | Value |
        |--------|-------|
        | ✅ Exit Code | \`${STEP_RUN_DOTNET_EXIT_CODE}\` |
        | 📊 Status | \`${STEP_RUN_DOTNET_OUTCOME}\` |
        | 🚀 Executed Command | \`${STEP_RUN_DOTNET_EXECUTED_COMMAND}\` |
        | 🔧 Tool Installed | \`${STEP_CHECK_INSTALLED_HAS_BEEN_INSTALLED}\` |

        ## ⚙️ Process Details
        | Step | Status |
        |------|--------|
        | ✅ Input Validation | \`✅ Completed\` |
        | 🏗️ Argument Building | \`${STEP_BUILD_ARGS_OUTCOME_LABEL}\` |
        | � Tool Installation | \`${STEP_RUN_DOTNET_OUTCOME_LABEL}\` |
        | � Installation Verification | \`${STEP_CHECK_INSTALLED_OUTCOME_LABEL}\` |
        </details>
        EOF
      env:
        INPUT_TOOL_NAME: ${{ inputs.tool-name }}
        INPUT_VERSION: ${{ inputs.version || 'latest' }}
        STEP_NORMALIZE_WORKING_DIRECTORY_NORMALIZED: ${{ steps.normalize-working-directory.outputs.normalized }}
        INPUT_FRAMEWORK: ${{ inputs.framework || 'none' }}
        INPUT_VERBOSITY: ${{ inputs.verbosity || 'auto' }}
        INPUT_ARCH: ${{ inputs.arch || 'none' }}
        STEP_NORMALIZE_ARGUMENTS_NORMALIZED: ${{ steps.normalize-arguments.outputs.normalized || 'none' }}
        INPUT_GLOBAL: ${{ inputs.global }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
        STEP_NORMALIZE_TOOL_PATH_NORMALIZED: ${{ steps.normalize-tool-path.outputs.normalized || 'default' }}
        INPUT_ADD_SOURCE: ${{ inputs.add-source || 'none' }}
        INPUT_SOURCE: ${{ inputs.source || 'none' }}
        STEP_NORMALIZE_CONFIGFILE_NORMALIZED: ${{ steps.normalize-configfile.outputs.normalized || 'default' }}
        STEP_NORMALIZE_TOOL_MANIFEST_NORMALIZED: ${{ steps.normalize-tool-manifest.outputs.normalized || 'default' }}
        INPUT_ALLOW_DOWNGRADE: ${{ inputs.allow-downgrade }}
        INPUT_ALLOW_ROLL_FORWARD: ${{ inputs.allow-roll-forward }}
        INPUT_DISABLE_PARALLEL: ${{ inputs.disable-parallel }}
        INPUT_IGNORE_FAILED_SOURCES: ${{ inputs.ignore-failed-sources }}
        INPUT_NO_HTTP_CACHE: ${{ inputs.no-http-cache }}
        INPUT_CREATE_MANIFEST_IF_NEEDED: ${{ inputs.create-manifest-if-needed }}
        STEP_RUN_DOTNET_EXIT_CODE: ${{ steps.run-dotnet.outputs.exit-code }}
        STEP_RUN_DOTNET_OUTCOME: ${{ steps.run-dotnet.outcome }}
        STEP_RUN_DOTNET_EXECUTED_COMMAND: ${{ steps.run-dotnet.outputs.executed-command }}
        STEP_CHECK_INSTALLED_HAS_BEEN_INSTALLED: ${{ steps.check-installed.outputs.has-been-installed }}
        STEP_BUILD_ARGS_OUTCOME_LABEL: ${{ steps.build-args.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_RUN_DOTNET_OUTCOME_LABEL: ${{ steps.run-dotnet.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_CHECK_INSTALLED_OUTCOME_LABEL: ${{ steps.check-installed.outcome == 'success' && '✅ Completed' || '❌ Failed' }}

branding:
  icon: "settings"
  color: "blue"

# dotnet tool install --help
# Description:
#   Install global or local tool. Local tools are added to manifest and restored.

# Usage:
#   dotnet tool install <packageId> [options]

# Arguments:
#   <PACKAGE_ID>  The NuGet Package Id of the tool to install.

# Options:
#   --global                 Install the tool for the current user.
#   --local                      Install the tool and add to the local tool manifest (default).
#   --tool-path <PATH>           The directory where the tool will be installed. The directory will be created if it does not exist.
#   --version <VERSION>          The version of the tool package to install.
#   --configfile <FILE>          The NuGet configuration file to use.
#   --tool-manifest <PATH>       Path to the manifest file.
#   --add-source <ADDSOURCE>     Add an additional NuGet package source to use during installation.
#   --source <SOURCE>            Replace all NuGet package sources to use during installation with these.
#   --framework <FRAMEWORK>      The target framework to install the tool for.
#   --prerelease                 Include pre-release packages.
#   --disable-parallel           Prevent restoring multiple projects in parallel.
#   --ignore-failed-sources      Treat package source failures as warnings.
#   --no-http-cache              Do not cache packages and http requests.
#   --interactive                Allows the command to stop and wait for user input or action (for example to complete authentication).
#   --verbosity <LEVEL>      Set the MSBuild verbosity level. Allowed values are q[uiet], m[inimal], n[ormal], d[etailed], and diag[nostic].
#   --arch <arch>            The target architecture.
#   --create-manifest-if-needed  Create a tool manifest if one isn't found during tool installation. For information on how manifests are located, see https://aka.ms/dotnet/tools/create-manifest-if-needed
#   --allow-downgrade            Allow package downgrade when installing a .NET tool package.
#   --allow-roll-forward         Allow a .NET tool to roll forward to newer versions of the .NET runtime if the runtime it targets isn't installed.
#   -h, --help               Show command line help.

