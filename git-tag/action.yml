name: "🏷️ Create Git Tag"
description: "Creates and pushes Git tags with validation and configuration"
author: "Francois Raminosona"

inputs:
  tag:
    description: "Tag name to create"
    required: true
  message:
    description: "Tag message (for annotated tags)"
    required: false
    default: ""
  prefix:
    description: "Prefix to add to the tag name"
    required: false
    default: ""
  annotated:
    description: "Create an annotated tag instead of lightweight tag"
    required: false
    default: "true"
  push:
    description: "Push the tag to remote repository"
    required: false
    default: "true"
  force:
    description: "Force create/update tag if it already exists"
    required: false
    default: "false"
  fail-if-exists:
    description: "Fail if tag already exists (ignored if force is true)"
    required: false
    default: "true"
  git-user-name:
    description: "Git user name for commits"
    required: false
    default: ${{ github.actor }}
  git-user-email:
    description: "Git user email for commits"
    required: false
    default: ${{ github.actor }}@users.noreply.github.com
  target:
    description: "Target commit/branch/SHA for the tag (defaults to current HEAD)"
    required: false
    default: ""
  github-token:
    description: "GitHub token for authentication"
    required: false
    default: ${{ github.token }}
  show-summary:
    description: "Whether to show the action summary"
    required: false
    default: "false"

outputs:
  tag-name:
    description: "Full name of the created tag (including prefix)"
    value: ${{ steps.create.outputs.tag-name }}
  tag-exists:
    description: "Whether the tag already existed before creation"
    value: ${{ steps.create.outputs.tag-exists }}
  tag-sha:
    description: "SHA of the commit the tag points to"
    value: ${{ steps.create.outputs.tag-sha }}
  tag-created:
    description: "Whether a new tag was created"
    value: ${{ steps.create.outputs.tag-created }}
  tag-pushed:
    description: "Whether the tag was pushed to remote"
    value: ${{ steps.create.outputs.tag-pushed }}
  tag-url:
    description: "URL to the tag on GitHub"
    value: ${{ steps.create.outputs.tag-url }}

runs:
  using: "composite"
  steps:
    # ================== ℹ️ ==================

    - name: "ℹ️ Gather environment information"
      shell: bash
      run: |
        echo "::debug::Operating System: $(uname -a)"
        echo "::debug::GitHub Runner OS: $RUNNER_OS"
        echo "::debug::GitHub Runner Version: $RUNNER_VERSION"
        echo "::debug::Git Version: $(git --version || echo 'Not installed')"
        echo "::debug::Current Git Repository: $(git remote get-url origin 2>/dev/null || echo 'Not a git repository')"
        echo "::debug::Current Branch: $(git branch --show-current 2>/dev/null || echo 'Unknown')"

    # ================== 🔒 ==================

    - name: "🔒 Mask sensitive data"
      shell: bash
      run: |
        if [ -n "${INPUT_GITHUB_TOKEN}" ]; then
          echo "::add-mask::${INPUT_GITHUB_TOKEN}"
        fi

        echo "::debug::Masked sensitive inputs"
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}

    # ================== 📁 ==================

    - name: "📁 Normalize paths"
      shell: bash
      run: |
        # No file paths to normalize in this action
        echo "✅ No file paths to normalize"

    # ================== ✅ ==================

    - name: "✅ Validate input : required parameters"
      shell: bash
      run: |
        echo "::debug::Validating required parameters..."

        # Validate tag name is provided and not empty
        if [ -z "${INPUT_TAG}" ]; then
          echo "::error::Tag name cannot be empty"
          exit 1
        fi

        echo "✅ Required parameters validation completed successfully"
      env:
        INPUT_TAG: ${{ inputs.tag }}

    - name: "✅ Validate input : booleans"
      shell: bash
      run: |
        echo "::debug::Validating boolean inputs..."
        for param in annotated push force fail-if-exists show-summary; do
          case $param in
            annotated) value="${INPUT_ANNOTATED}" ;;
            push) value="${INPUT_PUSH}" ;;
            force) value="${INPUT_FORCE}" ;;
            fail-if-exists) value="${INPUT_FAIL_IF_EXISTS}" ;;
            show-summary) value="${INPUT_SHOW_SUMMARY}" ;;
          esac
          if [ -n "$value" ] && [ "$value" != "true" ] && [ "$value" != "false" ]; then
            echo "::error::Parameter $param must be 'true' or 'false', got: $value"
            exit 1
          fi
        done

        echo "✅ Boolean inputs validation completed successfully"
      env:
        INPUT_ANNOTATED: ${{ inputs.annotated }}
        INPUT_PUSH: ${{ inputs.push }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_FAIL_IF_EXISTS: ${{ inputs.fail-if-exists }}
        INPUT_SHOW_SUMMARY: ${{ inputs.show-summary }}

    - name: "✅ Validate input : tag"
      shell: bash
      run: |
        echo "::debug::Validating tag input: ${INPUT_TAG}"

        # Validate tag name format (comprehensive Git tag validation)
        if [[ "${INPUT_TAG}" =~ [[:space:]] ]]; then
          echo "::error::Tag name cannot contain spaces: ${INPUT_TAG}"
          exit 1
        fi

        if [[ "${INPUT_TAG}" =~ \.\.|\.\.\. ]]; then
          echo "::error::Tag name cannot contain '..' sequences: ${INPUT_TAG}"
          exit 1
        fi

        if [[ "${INPUT_TAG}" == *"/"* ]] && [[ "${INPUT_TAG}" == "/"* || "${INPUT_TAG}" == *"/" ]]; then
          echo "::error::Tag name cannot start or end with '/': ${INPUT_TAG}"
          exit 1
        fi

        # Additional Git tag safety checks
        if [[ "${INPUT_TAG}" =~ ^[.-] ]] || [[ "${INPUT_TAG}" =~ [.-]$ ]]; then
          echo "::error::Tag name cannot start or end with '.' or '-': ${INPUT_TAG}"
          exit 1
        fi

        if [[ "${INPUT_TAG}" =~ [\\\~\^\:\*\?\[\]] ]]; then
          echo "::error::Tag name contains invalid characters (\\, ~, ^, :, *, ?, [, ]): ${INPUT_TAG}"
          exit 1
        fi

        echo "✅ Tag validation completed successfully"
      env:
        INPUT_TAG: ${{ inputs.tag }}

    - name: "✅ Validate input : prefix"
      if: ${{ inputs.prefix != '' }}
      shell: bash
      run: |
        echo "::debug::Validating prefix input: ${INPUT_PREFIX}"

        # Prefix should follow similar rules as tag names
        if [[ "${INPUT_PREFIX}" =~ [[:space:]] ]]; then
          echo "::error::Tag prefix cannot contain spaces: ${INPUT_PREFIX}"
          exit 1
        fi

        if [[ "${INPUT_PREFIX}" =~ [\\\~\^\:\*\?\[\]] ]]; then
          echo "::error::Tag prefix contains invalid characters: ${INPUT_PREFIX}"
          exit 1
        fi

        echo "✅ Prefix validation completed successfully"
      env:
        INPUT_PREFIX: ${{ inputs.prefix }}

    - name: "✅ Validate input : git-user-email"
      shell: bash
      run: |
        echo "::debug::Validating git-user-email input: ${INPUT_GIT_USER_EMAIL}"

        if ! [[ "${INPUT_GIT_USER_EMAIL}" =~ ^[^@]+@[^@]+\.[^@]+$ ]]; then
          echo "::error::Invalid email format: ${INPUT_GIT_USER_EMAIL}"
          exit 1
        fi

        echo "✅ Git user email validation completed successfully"
      env:
        INPUT_GIT_USER_EMAIL: ${{ inputs.git-user-email }}

    - name: "✅ Validate input : git-user-name"
      shell: bash
      run: |
        echo "::debug::Validating git-user-name input: ${INPUT_GIT_USER_NAME}"

        # Basic validation for Git user name
        if [ -z "${INPUT_GIT_USER_NAME}" ]; then
          echo "::error::Git user name cannot be empty"
          exit 1
        fi

        if [[ "${INPUT_GIT_USER_NAME}" =~ ^[[:space:]]+$ ]]; then
          echo "::error::Git user name cannot be only whitespace"
          exit 1
        fi

        echo "✅ Git user name validation completed successfully"
      env:
        INPUT_GIT_USER_NAME: ${{ inputs.git-user-name }}

    - name: "✅ Validate input : target"
      if: ${{ inputs.target != '' }}
      shell: bash
      run: |
        echo "::debug::Validating target input: ${INPUT_TARGET}"

        # Check if target exists (commit, branch, or tag)
        if ! git rev-parse --verify "${INPUT_TARGET}" >/dev/null 2>&1; then
          echo "::error::Target commit/branch/tag does not exist: ${INPUT_TARGET}"
          exit 1
        fi

        TARGET_SHA=$(git rev-parse "${INPUT_TARGET}")
        echo "::debug::Target '${INPUT_TARGET}' resolves to SHA: $TARGET_SHA"

        echo "✅ Target validation completed successfully"
      env:
        INPUT_TARGET: ${{ inputs.target }}

    - name: "✅ Validate input : github-token"
      shell: bash
      run: |
        echo "::debug::Validating GitHub token..."

        if [ -z "${INPUT_GITHUB_TOKEN}" ]; then
          echo "::warning::No GitHub token provided - push operations may fail"
        fi

        echo "✅ GitHub token validation completed successfully"
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}

    # ================== 🏗️ ==================

    # ================== 🚀 ==================

    - name: "🔧 Configure Git"
      shell: bash
      run: |
        echo "::debug::Configuring Git user settings..."

        # Set Git user configuration
        git config --local user.name "${INPUT_GIT_USER_NAME}"
        git config --local user.email "${INPUT_GIT_USER_EMAIL}"

        # Verify configuration was set
        CONFIGURED_NAME=$(git config --local user.name)
        CONFIGURED_EMAIL=$(git config --local user.email)

        if [ "$CONFIGURED_NAME" != "${INPUT_GIT_USER_NAME}" ]; then
          echo "::error::Failed to set Git user name"
          exit 1
        fi

        if [ "$CONFIGURED_EMAIL" != "${INPUT_GIT_USER_EMAIL}" ]; then
          echo "::error::Failed to set Git user email"
          exit 1
        fi

        echo "👤 Git user: ${INPUT_GIT_USER_NAME} <${INPUT_GIT_USER_EMAIL}>"
        echo "✅ Git configuration completed successfully"
      env:
        INPUT_GIT_USER_NAME: ${{ inputs.git-user-name }}
        INPUT_GIT_USER_EMAIL: ${{ inputs.git-user-email }}

    - name: "🏷️ Create and push Git tag"
      id: create
      shell: bash
      run: |
        echo "::debug::Creating Git tag..."

        # Build full tag name with prefix
        TAG_NAME="${INPUT_PREFIX}${INPUT_TAG}"
        echo "::debug::Full tag name: $TAG_NAME"
        echo "tag-name=$TAG_NAME" >> $GITHUB_OUTPUT

        # Set default values for outputs
        echo "tag-exists=false" >> $GITHUB_OUTPUT
        echo "tag-created=false" >> $GITHUB_OUTPUT
        echo "tag-pushed=false" >> $GITHUB_OUTPUT

        # Check if tag already exists
        if git tag -l "$TAG_NAME" | grep -q "^$TAG_NAME$"; then
          echo "::warning::Tag $TAG_NAME already exists"
          echo "tag-exists=true" >> $GITHUB_OUTPUT

          if [ "${INPUT_FORCE}" = "true" ]; then
            echo "::debug::Force mode enabled - will update existing tag"
          elif [ "${INPUT_FAIL_IF_EXISTS}" = "true" ]; then
            echo "::error::Tag $TAG_NAME already exists and fail-if-exists is true"
            exit 1
          else
            echo "::debug::Tag exists but continuing without error"
            # Get existing tag information
            TAG_SHA=$(git rev-list -n 1 "$TAG_NAME")
            echo "tag-sha=$TAG_SHA" >> $GITHUB_OUTPUT
            echo "tag-url=https://github.com/${GH_REPOSITORY}/releases/tag/$TAG_NAME" >> $GITHUB_OUTPUT
            echo "✅ Using existing tag $TAG_NAME"
            exit 0
          fi
        fi

        # Determine target for the tag
        if [ -n "${INPUT_TARGET}" ]; then
          TARGET="${INPUT_TARGET}"
          echo "::debug::Using specified target: $TARGET"
        else
          TARGET="HEAD"
          echo "::debug::Using HEAD as target"
        fi

        # Get the SHA of the target
        TAG_SHA=$(git rev-parse "$TARGET")
        echo "::debug::Target SHA: $TAG_SHA"
        echo "tag-sha=$TAG_SHA" >> $GITHUB_OUTPUT

        # Create the tag
        if [ "${INPUT_ANNOTATED}" = "true" ]; then
          # Create annotated tag
          if [ -n "${INPUT_MESSAGE}" ]; then
            TAG_MESSAGE="${INPUT_MESSAGE}"
          else
            TAG_MESSAGE="Tag $TAG_NAME"
          fi

          echo "::debug::Creating annotated tag with message: $TAG_MESSAGE"

          if [ "${INPUT_FORCE}" = "true" ]; then
            git tag -f -a "$TAG_NAME" -m "$TAG_MESSAGE" "$TARGET"
          else
            git tag -a "$TAG_NAME" -m "$TAG_MESSAGE" "$TARGET"
          fi
        else
          # Create lightweight tag
          echo "::debug::Creating lightweight tag"

          if [ "${INPUT_FORCE}" = "true" ]; then
            git tag -f "$TAG_NAME" "$TARGET"
          else
            git tag "$TAG_NAME" "$TARGET"
          fi
        fi

        echo "✅ Tag $TAG_NAME created successfully"
        echo "tag-created=true" >> $GITHUB_OUTPUT

        # Push the tag if requested
        if [ "${INPUT_PUSH}" = "true" ]; then
          echo "::debug::Pushing tag to remote repository..."

          # Configure authentication if token is provided
          if [ -n "${INPUT_GITHUB_TOKEN}" ]; then
            echo "::debug::Configuring Git authentication with token"
            git remote set-url origin "https://x-access-token:${INPUT_GITHUB_TOKEN}@github.com/${GH_REPOSITORY}.git"
          fi

          # Push with proper error handling
          if [ "${INPUT_FORCE}" = "true" ]; then
            if git push --force origin "$TAG_NAME"; then
              echo "✅ Tag $TAG_NAME force pushed to remote"
              echo "tag-pushed=true" >> $GITHUB_OUTPUT
            else
              echo "::error::Failed to force push tag $TAG_NAME"
              exit 1
            fi
          else
            if git push origin "$TAG_NAME"; then
              echo "✅ Tag $TAG_NAME pushed to remote"
              echo "tag-pushed=true" >> $GITHUB_OUTPUT
            else
              echo "::error::Failed to push tag $TAG_NAME"
              exit 1
            fi
          fi
        else
          echo "::debug::Skipping push (push disabled)"
        fi

        # Set GitHub URL for the tag
        echo "tag-url=https://github.com/${GH_REPOSITORY}/releases/tag/$TAG_NAME" >> $GITHUB_OUTPUT

        echo "✅ Git tag operation completed successfully"
      env:
        INPUT_PREFIX: ${{ inputs.prefix }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_FAIL_IF_EXISTS: ${{ inputs.fail-if-exists }}
        GH_REPOSITORY: ${{ github.repository }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_ANNOTATED: ${{ inputs.annotated }}
        INPUT_MESSAGE: ${{ inputs.message }}
        INPUT_PUSH: ${{ inputs.push }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}

    # ================== 🔍 ==================

    - name: "🔍 Verify tag creation"
      id: verify
      shell: bash
      run: |
        echo "::debug::Verifying tag creation..."

        TAG_NAME="${STEP_CREATE_TAG_NAME}"

        # Verify tag exists locally
        if git tag -l "$TAG_NAME" | grep -q "^$TAG_NAME$"; then
          echo "✅ Tag $TAG_NAME exists locally"

          # Get tag information with error handling
          if git cat-file -t "$TAG_NAME" 2>/dev/null | grep -q "tag"; then
            echo "::debug::Annotated tag detected"
            echo "::debug::Tag details:"
            git cat-file -p "$TAG_NAME" 2>/dev/null | head -10 | sed 's/^/  /' || echo "  Could not read tag details"
          else
            echo "::debug::Lightweight tag detected"
            TAG_COMMIT=$(git rev-list -n 1 "$TAG_NAME" 2>/dev/null)
            if [ -n "$TAG_COMMIT" ]; then
              echo "::debug::Points to commit: $TAG_COMMIT"
            else
              echo "::warning::Could not determine tag commit"
            fi
          fi
        else
          echo "::error::Tag $TAG_NAME not found locally"
          exit 1
        fi

        # Verify remote push if it was requested and successful
        if [ "${INPUT_PUSH}" = "true" ] && [ "${STEP_CREATE_TAG_PUSHED}" = "true" ]; then
          echo "::debug::Verifying remote tag..."

          # Try to fetch the tag from remote to verify it exists
          if git ls-remote --tags origin 2>/dev/null | grep -q "refs/tags/$TAG_NAME$"; then
            echo "✅ Tag $TAG_NAME verified on remote"
          else
            echo "::warning::Tag may not be fully propagated to remote yet, or remote verification failed"
          fi
        fi

        echo "✅ Tag verification completed successfully"
      env:
        STEP_CREATE_TAG_NAME: ${{ steps.create.outputs.tag-name }}
        INPUT_PUSH: ${{ inputs.push }}
        STEP_CREATE_TAG_PUSHED: ${{ steps.create.outputs.tag-pushed }}

    # ================== 📊 ==================

    - name: "📊 Action Summary"
      if: always() && inputs.show-summary == 'true'
      shell: bash
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        <details><summary>🏷️ Git Tag : ${STEP_CREATE_TAG_NAME}</summary>

        ## 🔧 Input Parameters
        | Parameter | Value |
        |-----------|-------|
        | 🏷️ Tag Name | \`${INPUT_TAG}\` |
        | 🏷️ Full Tag | \`${STEP_CREATE_TAG_NAME}\` |
        | 📝 Message | \`${INPUT_MESSAGE}\` |
        | 📎 Prefix | \`${INPUT_PREFIX}\` |
        | 📝 Annotated | \`${INPUT_ANNOTATED}\` |
        | 🚀 Push | \`${INPUT_PUSH}\` |
        | 🔄 Force | \`${INPUT_FORCE}\` |
        | 🎯 Target | \`${INPUT_TARGET}\` |

        ## 📤 Tag Results
        | Metric | Value |
        |--------|-------|
        | 🏷️ Tag Name | \`${STEP_CREATE_TAG_NAME}\` |
        | 📍 Tag SHA | \`${STEP_CREATE_TAG_SHA}\` |
        | 🔗 Tag URL | \`${STEP_CREATE_TAG_URL}\` |
        | ⚠️ Already Existed | \`${STEP_CREATE_TAG_EXISTS}\` |
        | ✅ Created | \`${STEP_CREATE_TAG_CREATED}\` |
        | 🚀 Pushed | \`${STEP_CREATE_TAG_PUSHED}\` |

        ## ⚙️ Configuration
        | Setting | Value |
        |---------|-------|
        | 👤 Git User | \`${INPUT_GIT_USER_NAME}\` |
        | 📧 Git Email | \`${INPUT_GIT_USER_EMAIL}\` |
        | 🛡️ Fail if Exists | \`${INPUT_FAIL_IF_EXISTS}\` |

        ## 🔧 Process Details
        | Step | Status |
        |------|--------|
        | ✅ Input Validation | \`✅ Completed\` |
        | 🔧 Git Configuration | \`✅ Completed\` |
        | 🏷️ Tag Creation | \`${STEP_CREATE_OUTCOME_LABEL}\` |
        | 🔍 Tag Verification | \`${STEP_VERIFY_OUTCOME_LABEL}\` |

        </details>
        EOF
      env:
        STEP_CREATE_TAG_NAME: ${{ steps.create.outputs.tag-name }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_MESSAGE: ${{ inputs.message || 'auto-generated' }}
        INPUT_PREFIX: ${{ inputs.prefix || 'none' }}
        INPUT_ANNOTATED: ${{ inputs.annotated }}
        INPUT_PUSH: ${{ inputs.push }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_TARGET: ${{ inputs.target || 'HEAD' }}
        STEP_CREATE_TAG_SHA: ${{ steps.create.outputs.tag-sha }}
        STEP_CREATE_TAG_URL: ${{ steps.create.outputs.tag-url }}
        STEP_CREATE_TAG_EXISTS: ${{ steps.create.outputs.tag-exists }}
        STEP_CREATE_TAG_CREATED: ${{ steps.create.outputs.tag-created }}
        STEP_CREATE_TAG_PUSHED: ${{ steps.create.outputs.tag-pushed }}
        INPUT_GIT_USER_NAME: ${{ inputs.git-user-name }}
        INPUT_GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        INPUT_FAIL_IF_EXISTS: ${{ inputs.fail-if-exists }}
        STEP_CREATE_OUTCOME_LABEL: ${{ steps.create.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_VERIFY_OUTCOME_LABEL: ${{ steps.verify.outcome == 'success' && '✅ Completed' || '❌ Failed' }}

branding:
  icon: "tag"
  color: "blue"
