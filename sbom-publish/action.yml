name: "📤 Upload SBOM"
description: "Uploads Software Bill of Materials (SBOM) files to dependency tracking systems with retry logic and comprehensive validation"
author: "Kyriakos Sidiropoulos, Francois Raminosona"

inputs:
  sbom-file-path:
    description: "Path to the SBOM file to upload"
    required: true

  project-name:
    description: "Name of the project"
    required: true

  project-tags:
    description: "Comma-separated tags to associate with the project in the dependency tracker"
    required: false

  project-version:
    description: "Version of the project"
    required: true

  dependency-tracker-url:
    description: "URL of the Dependency Tracker API endpoint"
    required: true

  dependency-tracker-api-key:
    description: "API key for the Dependency Tracker"
    required: true

  parent-project-name:
    description: "Name of the parent project"
    required: false

  parent-project-version:
    description: "Version of the parent project"
    required: false

  auto-create:
    description: "Automatically create the project if it does not exist"
    required: false
    default: "true"

  timeout-seconds:
    description: "Timeout for the upload request in seconds"
    required: false
    default: "300"

  retry-attempts:
    description: "Number of retry attempts if upload fails"
    required: false
    default: "3"

  retry-delay-seconds:
    description: "Delay between retry attempts in seconds"
    required: false
    default: "10"

  show-summary:
    description: "Whether to show the action summary"
    required: false
    default: "false"

outputs:
  upload-status:
    description: "Status of the upload (success/failed)"
    value: ${{ steps.upload.outputs.status }}

  http-status-code:
    description: "HTTP status code from the upload request"
    value: ${{ steps.upload.outputs.http-code }}

  response-body:
    description: "Response body from the upload request"
    value: ${{ steps.upload.outputs.response-body }}

  upload-timestamp:
    description: "ISO timestamp when the upload was completed"
    value: ${{ steps.upload.outputs.timestamp }}

  project-url:
    description: "URL to view the project in the dependency tracker"
    value: ${{ steps.upload.outputs.project-url }}

  file-size:
    description: "Size of the uploaded SBOM file in bytes"
    value: ${{ steps.build-args.outputs.file-size }}

  upload-duration:
    description: "Duration of the upload request in seconds"
    value: ${{ steps.upload.outputs.duration }}

runs:
  using: "composite"
  steps:
    # ================== ℹ️ ==================

    - name: "ℹ️ Gather environment information"
      shell: bash
      run: |
        echo "::debug::Operating System: $(uname -a)"
        echo "::debug::GitHub Runner OS: $RUNNER_OS"
        echo "::debug::GitHub Runner Version: $RUNNER_VERSION"
        echo "::debug::curl Version: $(curl --version | head -n 1 || echo 'Not installed')"

    # ================== 🔒 ==================

    - name: "🔒 Mask sensitive data"
      shell: bash
      run: |
        if [ -n "${INPUT_DEPENDENCY_TRACKER_API_KEY}" ]; then
          echo "::add-mask::${INPUT_DEPENDENCY_TRACKER_API_KEY}"
        fi

        echo "::debug::Masked sensitive inputs"
      env:
        INPUT_DEPENDENCY_TRACKER_API_KEY: ${{ inputs.dependency-tracker-api-key }}

    # ================== 📁 ==================

    - name: "📁 Normalize sbom-file-path"
      id: normalize-sbom-file
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.sbom-file-path }}

    # ================== ✅ ==================

    - name: "✅ Validate input : required parameters"
      shell: bash
      run: |
        echo "::debug::Validating required inputs..."
        has_errors=false

        for param in sbom-file-path project-name project-version dependency-tracker-url dependency-tracker-api-key; do
          case $param in
            sbom-file-path) value="${INPUT_SBOM_FILE_PATH}" ;;
            project-name) value="${INPUT_PROJECT_NAME}" ;;
            project-version) value="${INPUT_PROJECT_VERSION}" ;;
            dependency-tracker-url) value="${INPUT_DEPENDENCY_TRACKER_URL}" ;;
            dependency-tracker-api-key) value="${INPUT_DEPENDENCY_TRACKER_API_KEY}" ;;
          esac
          if [ -z "$value" ]; then
            echo "::error::Parameter $param is required but was not provided."
            has_errors=true
          fi
        done

        if [ "$has_errors" = "true" ]; then
          echo "::error::Please provide all required inputs for SBOM upload"
          exit 1
        fi

        echo "✅ Required input validation passed"
      env:
        INPUT_SBOM_FILE_PATH: ${{ inputs.sbom-file-path }}
        INPUT_PROJECT_NAME: ${{ inputs.project-name }}
        INPUT_PROJECT_VERSION: ${{ inputs.project-version }}
        INPUT_DEPENDENCY_TRACKER_URL: ${{ inputs.dependency-tracker-url }}
        INPUT_DEPENDENCY_TRACKER_API_KEY: ${{ inputs.dependency-tracker-api-key }}

    - name: "✅ Validate input : booleans"
      shell: bash
      run: |
        echo "::debug::Validating boolean inputs..."
        for param in auto-create show-summary; do
          case $param in
            auto-create) value="${INPUT_AUTO_CREATE}" ;;
            show-summary) value="${INPUT_SHOW_SUMMARY}" ;;
          esac
          if [ -n "$value" ] && [ "$value" != "true" ] && [ "$value" != "false" ]; then
            echo "::error::Parameter $param must be 'true' or 'false', got: $value"
            exit 1
          fi
        done

        echo "✅ Boolean inputs validation completed successfully"
      env:
        INPUT_AUTO_CREATE: ${{ inputs.auto-create }}
        INPUT_SHOW_SUMMARY: ${{ inputs.show-summary }}

    - name: "✅ Validate input : numeric parameters"
      shell: bash
      run: |
        echo "::debug::Validating numeric inputs..."
        has_errors=false

        for param in timeout-seconds retry-attempts retry-delay-seconds; do
          case $param in
            timeout-seconds) value="${INPUT_TIMEOUT_SECONDS}" ;;
            retry-attempts) value="${INPUT_RETRY_ATTEMPTS}" ;;
            retry-delay-seconds) value="${INPUT_RETRY_DELAY_SECONDS}" ;;
          esac
          if ! [[ "$value" =~ ^[0-9]+$ ]]; then
            echo "::error::Parameter $param must be a positive integer, got: $value"
            has_errors=true
          fi
        done

        if [ "$has_errors" = "true" ]; then
          exit 1
        fi

        echo "✅ Numeric inputs validation completed successfully"
      env:
        INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        INPUT_RETRY_ATTEMPTS: ${{ inputs.retry-attempts }}
        INPUT_RETRY_DELAY_SECONDS: ${{ inputs.retry-delay-seconds }}

    - name: "✅ Validate input : file and URL"
      shell: bash
      run: |
        echo "::debug::Validating SBOM file and dependency tracker URL..."
        has_errors=false

        if [ ! -f "${STEP_NORMALIZE_SBOM_FILE_ABSOLUTE}" ]; then
          echo "::error file=${STEP_NORMALIZE_SBOM_FILE_NORMALIZED}::SBOM file not found at: ${STEP_NORMALIZE_SBOM_FILE_NORMALIZED}"
          has_errors=true
        fi

        if [[ ! "${INPUT_DEPENDENCY_TRACKER_URL}" =~ ^https?:// ]]; then
          echo "::error::Dependency tracker URL must start with http:// or https://. Provided URL: ${INPUT_DEPENDENCY_TRACKER_URL}"
          has_errors=true
        fi

        if [ "$has_errors" = "true" ]; then
          exit 1
        fi

        echo "✅ File and URL validation passed"
      env:
        STEP_NORMALIZE_SBOM_FILE_ABSOLUTE: ${{ steps.normalize-sbom-file.outputs.absolute }}
        STEP_NORMALIZE_SBOM_FILE_NORMALIZED: ${{ steps.normalize-sbom-file.outputs.normalized }}
        INPUT_DEPENDENCY_TRACKER_URL: ${{ inputs.dependency-tracker-url }}

    # ================== 🏗️ ==================

    - name: "🏗️ Build argument list"
      id: build-args
      shell: bash
      run: |
        echo "::debug::Building upload parameters and metadata..."

        # Optional project tags
        project_tags_params=""
        if [ -n "${INPUT_PROJECT_TAGS}" ]; then
          project_tags_params="--form projectTags='${INPUT_PROJECT_TAGS}'"
          echo "::debug::Project-Tags: ${INPUT_PROJECT_TAGS}"
        fi
        echo "project-tags-params=$project_tags_params" >> $GITHUB_OUTPUT

        # Optional parent project parameters (quoted to survive values containing spaces)
        parent_params=""
        if [ -n "${INPUT_PARENT_PROJECT_NAME}" ]; then
          parent_params="$parent_params --form parentName='${INPUT_PARENT_PROJECT_NAME}'"
          echo "::debug::Parent project: ${INPUT_PARENT_PROJECT_NAME}"
        fi
        if [ -n "${INPUT_PARENT_PROJECT_VERSION}" ]; then
          parent_params="$parent_params --form parentVersion='${INPUT_PARENT_PROJECT_VERSION}'"
          echo "::debug::Parent version: ${INPUT_PARENT_PROJECT_VERSION}"
        fi
        parent_params="${parent_params# }"
        echo "parent-params=$parent_params" >> $GITHUB_OUTPUT

        # File information and validation
        file_size=$(stat -c%s "${STEP_NORMALIZE_SBOM_FILE_ABSOLUTE}" 2>/dev/null || stat -f%z "${STEP_NORMALIZE_SBOM_FILE_ABSOLUTE}")
        echo "file-size=$file_size" >> $GITHUB_OUTPUT
        echo "::debug::SBOM file size: $file_size bytes"

        if [ "$file_size" -gt 10485760 ]; then # 10MB
          echo "::warning::SBOM file is larger than 10MB, upload may take longer"
        fi

        echo "✅ Upload parameters built successfully"
      env:
        INPUT_PROJECT_TAGS: ${{ inputs.project-tags }}
        INPUT_PARENT_PROJECT_NAME: ${{ inputs.parent-project-name }}
        INPUT_PARENT_PROJECT_VERSION: ${{ inputs.parent-project-version }}
        STEP_NORMALIZE_SBOM_FILE_ABSOLUTE: ${{ steps.normalize-sbom-file.outputs.absolute }}

    # ================== 🚀 ==================

    - name: "📤 Upload SBOM with retry logic"
      id: upload
      shell: bash
      run: |
        echo "🚀 Starting SBOM upload to dependency tracker..."
        echo "🎯 Target URL: ${INPUT_DEPENDENCY_TRACKER_URL}"
        echo "📦 Project: ${INPUT_PROJECT_NAME} v${INPUT_PROJECT_VERSION}"
        echo "📄 SBOM file: ${STEP_NORMALIZE_SBOM_FILE_NORMALIZED} (${STEP_BUILD_ARGS_FILE_SIZE} bytes)"

        if [ -n "${INPUT_PARENT_PROJECT_NAME}" ]; then
          if [ -n "${INPUT_PARENT_PROJECT_VERSION}" ]; then
            echo "👨‍👩‍👧‍👦 Parent project: ${INPUT_PARENT_PROJECT_NAME} v${INPUT_PARENT_PROJECT_VERSION}"
          else
            echo "👨‍👩‍👧‍👦 Parent project: ${INPUT_PARENT_PROJECT_NAME}"
          fi
        fi

        max_attempts=${INPUT_RETRY_ATTEMPTS}
        retry_delay=${INPUT_RETRY_DELAY_SECONDS}
        timeout_seconds=${INPUT_TIMEOUT_SECONDS}

        echo "⚙️ Max attempts: $max_attempts | Retry delay: ${retry_delay}s | Timeout: ${timeout_seconds}s"

        # Create temporary file for response
        response_file=$(mktemp)

        for attempt in $(seq 1 $max_attempts); do
          echo ""
          echo "🔄 Upload attempt $attempt of $max_attempts"

          curl_cmd=(
            "curl"
            "--location"
            "--request" "POST"
            "--header" "Content-Type: multipart/form-data"
            "--header" "X-API-Key: ${INPUT_DEPENDENCY_TRACKER_API_KEY}"
            "--form" "bom=@${STEP_NORMALIZE_SBOM_FILE_ABSOLUTE}"
            "--form" "autoCreate=${INPUT_AUTO_CREATE}"
            "--form" "projectName=${INPUT_PROJECT_NAME}"
            "--form" "projectVersion=${INPUT_PROJECT_VERSION}"
            "--max-time" "$timeout_seconds"
            "--output" "$response_file"
            "--write-out" "%{http_code}|%{time_total}|%{size_upload}"
            "--silent"
            "--show-error"
          )

          # Add project tags if provided
          if [ -n "${STEP_BUILD_ARGS_PROJECT_TAGS_PARAMS}" ]; then
            eval "curl_cmd+=(${STEP_BUILD_ARGS_PROJECT_TAGS_PARAMS})"
          fi

          # Add parent project parameters if provided
          if [ -n "${STEP_BUILD_ARGS_PARENT_PARAMS}" ]; then
            eval "curl_cmd+=(${STEP_BUILD_ARGS_PARENT_PARAMS})"
          fi

          curl_cmd+=("${INPUT_DEPENDENCY_TRACKER_URL}")

          echo "🚀 Executing upload command..."

          curl_output=$("${curl_cmd[@]}" 2>&1)
          curl_exit_code=$?

          # Parse curl output (format: http_code|time_total|size_upload)
          IFS='|' read -r http_code time_total size_upload <<< "$curl_output"

          echo "📊 Upload metrics:"
          echo "  HTTP Status: $http_code"
          echo "  Time taken: ${time_total}s"
          echo "  Bytes uploaded: $size_upload"
          echo "  Curl exit code: $curl_exit_code"

          response_body=""
          if [[ -f "$response_file" && -s "$response_file" ]]; then
            response_body=$(head -c 1000 "$response_file") # Limit to prevent log overflow
            echo "📝 Response preview: ${response_body:0:200}..."
          fi

          if [[ $curl_exit_code -eq 0 && -n "$http_code" && $http_code -ge 200 && $http_code -lt 300 ]]; then
            echo "✅ Upload successful!"

            timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            base_url="${INPUT_DEPENDENCY_TRACKER_URL}"
            project_base_url="${base_url%/api/v1/bom}"
            project_url="${project_base_url}/projects"

            echo "status=success" >> $GITHUB_OUTPUT
            echo "http-code=$http_code" >> $GITHUB_OUTPUT
            echo "response-body=$response_body" >> $GITHUB_OUTPUT
            echo "timestamp=$timestamp" >> $GITHUB_OUTPUT
            echo "project-url=$project_url" >> $GITHUB_OUTPUT
            echo "duration=$time_total" >> $GITHUB_OUTPUT

            echo "🔗 Project URL: $project_url"
            echo "⏱️ Completed at: $timestamp"

            rm -f "$response_file"
            exit 0

          elif [[ $attempt -eq $max_attempts ]]; then
            echo "::error::Upload failed after $max_attempts attempts (HTTP $http_code, curl exit code $curl_exit_code)"

            if [[ -n "$response_body" ]]; then
              echo "📝 Final response: $response_body"
            fi

            echo "status=failed" >> $GITHUB_OUTPUT
            echo "http-code=$http_code" >> $GITHUB_OUTPUT
            echo "response-body=$response_body" >> $GITHUB_OUTPUT
            echo "duration=$time_total" >> $GITHUB_OUTPUT

            rm -f "$response_file"
            echo "::notice::Check API key permissions and dependency tracker configuration"
            exit 1

          else
            echo "⚠️ Upload attempt $attempt failed, retrying in ${retry_delay}s..."
            sleep $retry_delay
          fi
        done
      env:
        INPUT_DEPENDENCY_TRACKER_URL: ${{ inputs.dependency-tracker-url }}
        INPUT_PROJECT_NAME: ${{ inputs.project-name }}
        INPUT_PROJECT_VERSION: ${{ inputs.project-version }}
        STEP_NORMALIZE_SBOM_FILE_NORMALIZED: ${{ steps.normalize-sbom-file.outputs.normalized }}
        STEP_BUILD_ARGS_FILE_SIZE: ${{ steps.build-args.outputs.file-size }}
        INPUT_PARENT_PROJECT_NAME: ${{ inputs.parent-project-name }}
        INPUT_PARENT_PROJECT_VERSION: ${{ inputs.parent-project-version }}
        INPUT_RETRY_ATTEMPTS: ${{ inputs.retry-attempts }}
        INPUT_RETRY_DELAY_SECONDS: ${{ inputs.retry-delay-seconds }}
        INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        INPUT_DEPENDENCY_TRACKER_API_KEY: ${{ inputs.dependency-tracker-api-key }}
        STEP_NORMALIZE_SBOM_FILE_ABSOLUTE: ${{ steps.normalize-sbom-file.outputs.absolute }}
        INPUT_AUTO_CREATE: ${{ inputs.auto-create }}
        STEP_BUILD_ARGS_PROJECT_TAGS_PARAMS: ${{ steps.build-args.outputs.project-tags-params }}
        STEP_BUILD_ARGS_PARENT_PARAMS: ${{ steps.build-args.outputs.parent-params }}

    # ================== 🔍 ==================

    - name: "🔍 Validate upload result"
      shell: bash
      run: |
        echo "🔍 Validating upload result..."

        if [ "${STEP_UPLOAD_STATUS}" = "success" ]; then
          echo "✅ SBOM upload validation passed"
          echo "🔢 HTTP Status: ${STEP_UPLOAD_HTTP_CODE}"
          echo "⏱️ Timestamp: ${STEP_UPLOAD_TIMESTAMP}"
        else
          echo "::error::SBOM upload validation failed (status: ${STEP_UPLOAD_STATUS})"
          exit 1
        fi
      env:
        STEP_UPLOAD_STATUS: ${{ steps.upload.outputs.status }}
        STEP_UPLOAD_HTTP_CODE: ${{ steps.upload.outputs.http-code }}
        STEP_UPLOAD_TIMESTAMP: ${{ steps.upload.outputs.timestamp }}

    # ================== 📊 ==================

    - name: "📊 Action Summary"
      if: always() && inputs.show-summary == 'true'
      shell: bash
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        <details><summary>Expand for details - 📊 SBOM Publish Summary</summary>

        ## 🔧 Configuration
        | Parameter | Value |
        |-----------|-------|
        | 📦 **Project Name** | \`${INPUT_PROJECT_NAME}\` |
        | 🏷️ **Project Version** | \`${INPUT_PROJECT_VERSION}\` |
        | 📄 **SBOM File** | \`${STEP_NORMALIZE_SBOM_FILE_NORMALIZED}\` |
        | 🎯 **Tracker URL** | \`${INPUT_DEPENDENCY_TRACKER_URL}\` |
        | 👨‍👩‍👧‍👦 **Parent Project** | \`${INPUT_PARENT_PROJECT_NAME}\` |
        | 🏷️ **Project Tags** | \`${INPUT_PROJECT_TAGS}\` |
        | 🔄 **Auto Create** | \`${INPUT_AUTO_CREATE}\` |

        ## 📤 Upload Results
        | Metric | Value |
        |--------|-------|
        | ✅ **Status** | \`${STEP_UPLOAD_STATUS}\` |
        | 🔢 **HTTP Code** | \`${STEP_UPLOAD_HTTP_CODE}\` |
        | 📊 **File Size** | \`${STEP_BUILD_ARGS_FILE_SIZE} bytes\` |
        | ⏱️ **Duration** | \`${STEP_UPLOAD_DURATION}s\` |
        | 🕐 **Completion** | \`${STEP_UPLOAD_TIMESTAMP}\` |
        | 🔗 **Project URL** | \`${STEP_UPLOAD_PROJECT_URL}\` |

        ## ⚙️ Upload Configuration
        | Setting | Value |
        |---------|-------|
        | ⏱️ **Timeout** | \`${INPUT_TIMEOUT_SECONDS}s\` |
        | 🔁 **Max Attempts** | \`${INPUT_RETRY_ATTEMPTS}\` |
        | ⏳ **Retry Delay** | \`${INPUT_RETRY_DELAY_SECONDS}s\` |

        ---

        > 💡 **Tip**: For troubleshooting, check the dependency tracker logs and verify API key permissions.

        </details>
        EOF
      env:
        INPUT_PROJECT_NAME: ${{ inputs.project-name }}
        INPUT_PROJECT_VERSION: ${{ inputs.project-version }}
        STEP_NORMALIZE_SBOM_FILE_NORMALIZED: ${{ steps.normalize-sbom-file.outputs.normalized }}
        INPUT_DEPENDENCY_TRACKER_URL: ${{ inputs.dependency-tracker-url }}
        INPUT_PARENT_PROJECT_NAME: ${{ inputs.parent-project-name || 'None specified' }}
        INPUT_PROJECT_TAGS: ${{ inputs.project-tags || 'None specified' }}
        INPUT_AUTO_CREATE: ${{ inputs.auto-create }}
        STEP_UPLOAD_STATUS: ${{ steps.upload.outputs.status || 'Not executed' }}
        STEP_UPLOAD_HTTP_CODE: ${{ steps.upload.outputs.http-code || 'N/A' }}
        STEP_BUILD_ARGS_FILE_SIZE: ${{ steps.build-args.outputs.file-size || 'Unknown' }}
        STEP_UPLOAD_DURATION: ${{ steps.upload.outputs.duration || 'N/A' }}
        STEP_UPLOAD_TIMESTAMP: ${{ steps.upload.outputs.timestamp || 'Not completed' }}
        STEP_UPLOAD_PROJECT_URL: ${{ steps.upload.outputs.project-url || 'Not available' }}
        INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        INPUT_RETRY_ATTEMPTS: ${{ inputs.retry-attempts }}
        INPUT_RETRY_DELAY_SECONDS: ${{ inputs.retry-delay-seconds }}

branding:
  icon: "upload-cloud"
  color: "blue"
