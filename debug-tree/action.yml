name: "🌳 Debug Directory Tree"
description: "Simple directory tree display for debugging"
author: "Francois Raminosona"

inputs:
  path:
    description: "Path to display"
    required: false
    default: "."
  depth:
    description: "Maximum depth (0 for unlimited)"
    required: false
    default: "5"
  show-hidden:
    description: "Show hidden files"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:

    # ================== 📁 ==================

    - name: "📁 Normalize path"
      id: normalize-path
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.path }}

    # ================== ✅ ==================

    - name: "✅ Validate input : booleans"
      shell: bash
      run: |
        for param in show-hidden; do
          case $param in
            show-hidden) value="${INPUT_SHOW_HIDDEN}" ;;
          esac
          if [ -n "$value" ] && [ "$value" != "true" ] && [ "$value" != "false" ]; then
            echo "::error::Parameter $param must be 'true' or 'false', got: $value"
            exit 1
          fi
        done
      env:
        INPUT_SHOW_HIDDEN: ${{ inputs.show-hidden }}

    - name: "✅ Validate input : depth"
      shell: bash
      run: |
        if ! [[ "${INPUT_DEPTH}" =~ ^[0-9]+$ ]]; then
          echo "::error::Depth must be a non-negative integer, got: ${INPUT_DEPTH}"
          exit 1
        fi
      env:
        INPUT_DEPTH: ${{ inputs.depth }}

    # ================== 🚀 ==================

    - name: "🌳 Show directory tree"
      shell: bash
      run: |
        path="${INPUT_PATH}"
        depth="${INPUT_DEPTH}"
        show_hidden="${INPUT_SHOW_HIDDEN}"

        echo "� Directory tree for: $path"
        echo ""

        # Try tree command first
        if command -v tree >/dev/null 2>&1; then
          args=""

          if [ "$depth" != "0" ]; then
            args="$args -L $depth"
          fi

          if [ "$show_hidden" = "true" ]; then
            args="$args -a"
          fi

          tree $args "$path"
        else
          # Fallback to find
          find_args="$path"

          if [ "$depth" != "0" ]; then
            find_args="$find_args -maxdepth $depth"
          fi

          if [ "$show_hidden" = "false" ]; then
            find_args="$find_args ! -path '*/.*'"
          fi

          find $find_args | sort
        fi
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_DEPTH: ${{ inputs.depth }}
        INPUT_SHOW_HIDDEN: ${{ inputs.show-hidden }}

branding:
  icon: "folder"
  color: "green"
