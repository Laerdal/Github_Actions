name: "🚀 Create GitHub Release"
description: "Creates GitHub releases using GitHub CLI"
author: "Francois Raminosona"

inputs:
  # Common parameters
  show-summary:
    description: "Whether to show the action summary"
    required: false
    default: "false"

  # GitHub CLI specific parameters
  tag:
    description: "Git tag for the release (if not provided, will be auto-generated)"
    required: false
    default: ""
  assets:
    description: "Newline-separated list of asset file paths to upload to the release"
    required: false
    default: ""
  title:
    description: "Release title"
    required: false
    default: ""
  notes:
    description: "Release notes content"
    required: false
    default: ""
  notes-file:
    description: "Path to file containing release notes"
    required: false
    default: ""
  notes-from-tag:
    description: "Use tag annotation or commit message as release notes"
    required: false
    default: "false"
  notes-start-tag:
    description: "Tag to use as starting point for generating release notes"
    required: false
    default: ""
  generate-notes:
    description: "Automatically generate title and notes via GitHub Release Notes API"
    required: false
    default: "false"
  draft:
    description: "Save the release as a draft instead of publishing it"
    required: false
    default: "false"
  prerelease:
    description: "Mark the release as a prerelease"
    required: false
    default: "false"
  latest:
    description: "Mark this release as 'Latest' (true/false/auto)"
    required: false
    default: "auto"
  target:
    description: "Target branch or full commit SHA for automatic tag creation"
    required: false
    default: ""
  verify-tag:
    description: "Abort if the git tag does not already exist in the remote repository"
    required: false
    default: "false"
  discussion-category:
    description: "Start a discussion in the specified category"
    required: false
    default: ""
  fail-on-no-commits:
    description: "Fail if there are no commits since the last release"
    required: false
    default: "false"
  repo:
    description: "Target repository in OWNER/REPO format (defaults to current repository)"
    required: false
    default: ""
  github-token:
    description: "GitHub token for authentication"
    required: false
    default: ${{ github.token }}

outputs:
  release-id:
    description: "ID of the created release"
    value: ${{ steps.execute.outputs.release-id }}
  release-url:
    description: "URL of the created release"
    value: ${{ steps.execute.outputs.release-url }}
  release-tag:
    description: "Tag of the created release"
    value: ${{ steps.execute.outputs.release-tag }}
  release-name:
    description: "Name/title of the created release"
    value: ${{ steps.execute.outputs.release-name }}
  upload-url:
    description: "Upload URL for the release"
    value: ${{ steps.execute.outputs.upload-url }}

runs:
  using: "composite"
  steps:
    # ================== ℹ️ ==================

    - name: "ℹ️ Gather environment information"
      shell: bash
      run: |
        echo "::debug::Operating System: $(uname -a)"
        echo "::debug::GitHub Runner OS: $RUNNER_OS"
        echo "::debug::GitHub Runner Version: $RUNNER_VERSION"
        echo "::debug::GitHub CLI Version: $(gh --version || echo 'Not installed')"
        echo "::debug::jq Version: $(jq --version || echo 'Not installed')"
        echo "::debug::Git Version: $(git --version || echo 'Not installed')"

    # ================== 🔒 ==================

    - name: "🔒 Mask sensitive data"
      shell: bash
      run: |
        if [ -n "${INPUT_GITHUB_TOKEN}" ]; then
          echo "::add-mask::${INPUT_GITHUB_TOKEN}"
        fi

        echo "::debug::Masked sensitive inputs"
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}

    # ================== 📁 ==================

    - name: "📁 Normalize notes-file path"
      id: normalize-notes-file
      uses: laerdal/github_actions/normalize-path@main
      with:
        path: ${{ inputs.notes-file }}

    - name: "📁 Normalize assets paths"
      id: normalize-assets
      uses: laerdal/github_actions/normalize-arguments@main
      with:
        arguments: ${{ inputs.assets }}

    # ================== ✅ ==================

    - name: "✅ Validate input : booleans"
      shell: bash
      run: |
        echo "::debug::Validating boolean inputs..."
        for param in notes-from-tag generate-notes draft prerelease verify-tag fail-on-no-commits show-summary; do
          case $param in
            notes-from-tag) value="${INPUT_NOTES_FROM_TAG}" ;;
            generate-notes) value="${INPUT_GENERATE_NOTES}" ;;
            draft) value="${INPUT_DRAFT}" ;;
            prerelease) value="${INPUT_PRERELEASE}" ;;
            verify-tag) value="${INPUT_VERIFY_TAG}" ;;
            fail-on-no-commits) value="${INPUT_FAIL_ON_NO_COMMITS}" ;;
            show-summary) value="${INPUT_SHOW_SUMMARY}" ;;
          esac
          if [ -n "$value" ] && [ "$value" != "true" ] && [ "$value" != "false" ]; then
            echo "::error::Parameter $param must be 'true' or 'false', got: $value"
            exit 1
          fi
        done

        echo "✅ Boolean inputs validation completed successfully"
      env:
        INPUT_NOTES_FROM_TAG: ${{ inputs.notes-from-tag }}
        INPUT_GENERATE_NOTES: ${{ inputs.generate-notes }}
        INPUT_DRAFT: ${{ inputs.draft }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
        INPUT_VERIFY_TAG: ${{ inputs.verify-tag }}
        INPUT_FAIL_ON_NO_COMMITS: ${{ inputs.fail-on-no-commits }}
        INPUT_SHOW_SUMMARY: ${{ inputs.show-summary }}


    - name: "✅ Validate input : latest"
      if: ${{ inputs.latest != '' && inputs.latest != 'auto' }}
      shell: bash
      run: |
        echo "::debug::Validating latest input: ${INPUT_LATEST}"

        case "${INPUT_LATEST}" in
          true|false|auto) ;;
          *) echo "::error::latest must be 'true', 'false', or 'auto'"; exit 1 ;;
        esac

        echo "✅ Latest parameter validation completed successfully"
      env:
        INPUT_LATEST: ${{ inputs.latest }}

    - name: "✅ Validate input : notes-file"
      if: ${{ inputs.notes-file != '' }}
      shell: bash
      run: |
        echo "::debug::Validating notes-file input: ${STEP_NORMALIZE_NOTES_FILE_NORMALIZED}"

        if [ ! -f "${STEP_NORMALIZE_NOTES_FILE_NORMALIZED}" ]; then
          echo "::error file=${STEP_NORMALIZE_NOTES_FILE_NORMALIZED}::Notes file not found: ${STEP_NORMALIZE_NOTES_FILE_NORMALIZED}"
          exit 1
        fi

        echo "✅ Notes file validation completed successfully"
      env:
        STEP_NORMALIZE_NOTES_FILE_NORMALIZED: ${{ steps.normalize-notes-file.outputs.normalized }}

    - name: "✅ Validate input : repo"
      if: ${{ inputs.repo != '' }}
      shell: bash
      run: |
        echo "::debug::Validating repo input: ${INPUT_REPO}"

        if ! [[ "${INPUT_REPO}" =~ ^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$ ]]; then
          echo "::error::Invalid repository format. Must be OWNER/REPO"
          exit 1
        fi

        echo "✅ Repository format validation completed successfully"
      env:
        INPUT_REPO: ${{ inputs.repo }}

    - name: "✅ Validate input : tag"
      if: ${{ inputs.tag != '' }}
      shell: bash
      run: |
        echo "::debug::Validating tag input: ${INPUT_TAG}"

        if [[ "${INPUT_TAG}" =~ [[:space:]] ]]; then
          echo "::error::Tag name cannot contain spaces"
          exit 1
        fi

        echo "✅ Tag format validation completed successfully"
      env:
        INPUT_TAG: ${{ inputs.tag }}

    - name: "✅ Validate input : discussion-category"
      if: ${{ inputs.discussion-category != '' }}
      shell: bash
      run: |
        echo "::debug::Validating discussion-category input: ${INPUT_DISCUSSION_CATEGORY}"

        # Discussion category should be alphanumeric with hyphens and spaces allowed
        if ! [[ "${INPUT_DISCUSSION_CATEGORY}" =~ ^[a-zA-Z0-9\ \-]+$ ]]; then
          echo "::error::Discussion category contains invalid characters. Use alphanumeric, spaces, and hyphens only"
          exit 1
        fi

        echo "✅ Discussion category validation completed successfully"
      env:
        INPUT_DISCUSSION_CATEGORY: ${{ inputs.discussion-category }}

    - name: "✅ Validate input : notes sources"
      shell: bash
      run: |
        echo "::debug::Validating notes source configuration..."

        # Count how many notes sources are provided
        NOTES_COUNT=0
        [ -n "${INPUT_NOTES}" ] && NOTES_COUNT=$((NOTES_COUNT + 1))
        [ -n "${INPUT_NOTES_FILE}" ] && NOTES_COUNT=$((NOTES_COUNT + 1))
        [ "${INPUT_NOTES_FROM_TAG}" = "true" ] && NOTES_COUNT=$((NOTES_COUNT + 1))
        [ "${INPUT_GENERATE_NOTES}" = "true" ] && NOTES_COUNT=$((NOTES_COUNT + 1))

        if [ $NOTES_COUNT -gt 1 ]; then
          echo "::error::Multiple notes sources specified. Use only one of: notes, notes-file, notes-from-tag, or generate-notes"
          exit 1
        elif [ $NOTES_COUNT -eq 0 ]; then
          echo "::warning::No release notes specified. Consider using notes, notes-file, notes-from-tag, or generate-notes"
        fi

        echo "✅ Notes sources validation completed successfully"
      env:
        INPUT_NOTES: ${{ inputs.notes }}
        INPUT_NOTES_FILE: ${{ inputs.notes-file }}
        INPUT_NOTES_FROM_TAG: ${{ inputs.notes-from-tag }}
        INPUT_GENERATE_NOTES: ${{ inputs.generate-notes }}

    - name: "⚙️ Setup GitHub CLI"
      shell: bash
      run: |
        echo "::debug::Setting up GitHub CLI authentication..."

        # Authenticate with GitHub CLI
        echo "${INPUT_GITHUB_TOKEN}" | gh auth login --with-token

        # Verify authentication
        if gh auth status >/dev/null 2>&1; then
          echo "::debug::GitHub CLI authentication verified"
          echo "✅ GitHub CLI setup completed successfully"
        else
          echo "::error::GitHub CLI authentication failed"
          exit 1
        fi
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}

    # ================== 🏗️ ==================

    - name: "🏗️ Build argument list"
      id: build-args
      shell: bash
      run: |
        echo "::debug::Building argument list for GitHub release creation..."

        # Start with base command
        ARGUMENTS="release create"

        # Add tag if provided
        if [ -n "${INPUT_TAG}" ]; then
          ARGUMENTS="$ARGUMENTS '${INPUT_TAG}'"
        fi

        # Add asset files if provided
        if [ -n "${INPUT_ASSETS}" ]; then
          NORMALIZED_ASSETS="${STEP_NORMALIZE_ASSETS_NORMALIZED}"
          if [ -n "$NORMALIZED_ASSETS" ]; then
            while IFS= read -r asset_file; do
              # Skip empty lines
              [ -z "$asset_file" ] && continue
              ARGUMENTS="$ARGUMENTS '$asset_file'"
            done <<< "$NORMALIZED_ASSETS"
          fi
        fi

        # Add repository if provided
        if [ -n "${INPUT_REPO}" ]; then
          ARGUMENTS="$ARGUMENTS --repo '${INPUT_REPO}'"
        fi

        # Add title if provided
        if [ -n "${INPUT_TITLE}" ]; then
          ARGUMENTS="$ARGUMENTS --title '${INPUT_TITLE}'"
        fi

        # Add notes options (mutually exclusive)
        if [ -n "${INPUT_NOTES}" ]; then
          ARGUMENTS="$ARGUMENTS --notes '${INPUT_NOTES}'"
        elif [ -n "${INPUT_NOTES_FILE}" ]; then
          ARGUMENTS="$ARGUMENTS --notes-file '${STEP_NORMALIZE_NOTES_FILE_NORMALIZED}'"
        elif [ "${INPUT_NOTES_FROM_TAG}" = "true" ]; then
          ARGUMENTS="$ARGUMENTS --notes-from-tag"
        elif [ "${INPUT_GENERATE_NOTES}" = "true" ]; then
          ARGUMENTS="$ARGUMENTS --generate-notes"
        fi

        # Add notes start tag if provided
        if [ -n "${INPUT_NOTES_START_TAG}" ]; then
          ARGUMENTS="$ARGUMENTS --notes-start-tag '${INPUT_NOTES_START_TAG}'"
        fi

        # Add boolean flags
        for param in draft prerelease verify-tag fail-on-no-commits; do
          case $param in
            draft) value="${INPUT_DRAFT}" ;;
            prerelease) value="${INPUT_PRERELEASE}" ;;
            verify-tag) value="${INPUT_VERIFY_TAG}" ;;
            fail-on-no-commits) value="${INPUT_FAIL_ON_NO_COMMITS}" ;;
          esac
          if [ "$value" = "true" ]; then
            ARGUMENTS="$ARGUMENTS --${param}"
          fi
        done

        # Add latest flag
        if [ "${INPUT_LATEST}" = "true" ]; then
          ARGUMENTS="$ARGUMENTS --latest"
        elif [ "${INPUT_LATEST}" = "false" ]; then
          ARGUMENTS="$ARGUMENTS --latest=false"
        fi

        # Add target if provided
        if [ -n "${INPUT_TARGET}" ]; then
          ARGUMENTS="$ARGUMENTS --target '${INPUT_TARGET}'"
        fi

        # Add discussion category if provided
        if [ -n "${INPUT_DISCUSSION_CATEGORY}" ]; then
          ARGUMENTS="$ARGUMENTS --discussion-category '${INPUT_DISCUSSION_CATEGORY}'"
        fi

        # Trim leading space
        ARGUMENTS="${ARGUMENTS# }"

        echo "arguments=$ARGUMENTS" >> $GITHUB_OUTPUT
        echo "::debug::Argument list built successfully: $ARGUMENTS"
        echo "✅ Argument list built successfully"
      env:
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_ASSETS: ${{ inputs.assets }}
        STEP_NORMALIZE_ASSETS_NORMALIZED: ${{ steps.normalize-assets.outputs.normalized }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_NOTES: ${{ inputs.notes }}
        INPUT_NOTES_FILE: ${{ inputs.notes-file }}
        STEP_NORMALIZE_NOTES_FILE_NORMALIZED: ${{ steps.normalize-notes-file.outputs.normalized }}
        INPUT_NOTES_FROM_TAG: ${{ inputs.notes-from-tag }}
        INPUT_GENERATE_NOTES: ${{ inputs.generate-notes }}
        INPUT_NOTES_START_TAG: ${{ inputs.notes-start-tag }}
        INPUT_DRAFT: ${{ inputs.draft }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
        INPUT_VERIFY_TAG: ${{ inputs.verify-tag }}
        INPUT_FAIL_ON_NO_COMMITS: ${{ inputs.fail-on-no-commits }}
        INPUT_LATEST: ${{ inputs.latest }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_DISCUSSION_CATEGORY: ${{ inputs.discussion-category }}

    # ================== 🚀 ==================

    - name: "🚀 Execute GitHub release creation"
      id: execute
      shell: bash
      run: |
        echo "::debug::Executing GitHub release creation..."
        echo "🚀 Creating GitHub release..."

        # Execute GitHub CLI command and capture output
        if RELEASE_OUTPUT=$(eval "gh ${STEP_BUILD_ARGS_ARGUMENTS}" 2>&1); then
          echo "::debug::Release creation command executed successfully"
          echo "$RELEASE_OUTPUT"

          # Extract release information from output
          RELEASE_URL=$(echo "$RELEASE_OUTPUT" | grep -o 'https://github.com/[^/]*/[^/]*/releases/tag/[^[:space:]]*' | head -1)

          if [ -n "$RELEASE_URL" ]; then
            echo "release-url=$RELEASE_URL" >> $GITHUB_OUTPUT

            # Extract tag from URL
            RELEASE_TAG=$(echo "$RELEASE_URL" | sed 's|.*/tag/||')
            echo "release-tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

            # Get additional release information via API
            REPO_PARAM=""
            if [ -n "${INPUT_REPO}" ]; then
              REPO_PARAM="--repo ${INPUT_REPO}"
            fi

            # Get release info from GitHub API
            if RELEASE_INFO=$(gh api repos/{owner}/{repo}/releases/tags/$RELEASE_TAG $REPO_PARAM 2>/dev/null); then
              RELEASE_ID=$(echo "$RELEASE_INFO" | jq -r '.id // "unknown"')
              RELEASE_NAME=$(echo "$RELEASE_INFO" | jq -r '.name // "unknown"')
              UPLOAD_URL=$(echo "$RELEASE_INFO" | jq -r '.upload_url // "unknown"' | sed 's/{?name,label}//')

              echo "release-id=$RELEASE_ID" >> $GITHUB_OUTPUT
              echo "release-name=$RELEASE_NAME" >> $GITHUB_OUTPUT
              echo "upload-url=$UPLOAD_URL" >> $GITHUB_OUTPUT
            else
              echo "release-id=unknown" >> $GITHUB_OUTPUT
              echo "release-name=unknown" >> $GITHUB_OUTPUT
              echo "upload-url=unknown" >> $GITHUB_OUTPUT
            fi
          else
            echo "::warning::Could not extract release URL from output"
            echo "release-url=unknown" >> $GITHUB_OUTPUT
            echo "release-tag=${INPUT_TAG}" >> $GITHUB_OUTPUT
            echo "release-id=unknown" >> $GITHUB_OUTPUT
            echo "release-name=unknown" >> $GITHUB_OUTPUT
            echo "upload-url=unknown" >> $GITHUB_OUTPUT
          fi

          echo "✅ GitHub release created successfully"
        else
          echo "::error title=Release creation failed::$RELEASE_OUTPUT"
          exit 1
        fi
      env:
        STEP_BUILD_ARGS_ARGUMENTS: ${{ steps.build-args.outputs.arguments }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_TAG: ${{ inputs.tag }}

    - name: "✅ Verify release creation"
      id: verify
      shell: bash
      run: |
        echo "::debug::Verifying release creation..."

        RELEASE_TAG="${STEP_EXECUTE_RELEASE_TAG}"
        if [ -z "$RELEASE_TAG" ]; then
          RELEASE_TAG="${INPUT_TAG}"
        fi

        if [ -n "$RELEASE_TAG" ]; then
          # Verify release exists
          REPO_PARAM=""
          if [ -n "${INPUT_REPO}" ]; then
            REPO_PARAM="--repo ${INPUT_REPO}"
          fi

          if gh release view "$RELEASE_TAG" $REPO_PARAM >/dev/null 2>&1; then
            echo "::debug::Release found: $RELEASE_TAG"

            # Get release details for verification
            RELEASE_DETAILS=$(gh release view "$RELEASE_TAG" $REPO_PARAM --json id,name,tagName,url,isDraft,isPrerelease 2>/dev/null || echo '{}')

            if [ "$RELEASE_DETAILS" != "{}" ]; then
              DRAFT_STATUS=$(echo "$RELEASE_DETAILS" | jq -r '.isDraft // "unknown"')
              PRERELEASE_STATUS=$(echo "$RELEASE_DETAILS" | jq -r '.isPrerelease // "unknown"')

              echo "::debug::Release Status:"
              echo "::debug::  🏷️ Tag: $RELEASE_TAG"
              echo "::debug::  📋 Draft: $DRAFT_STATUS"
              echo "::debug::  🚧 Prerelease: $PRERELEASE_STATUS"
            fi

            echo "✅ Release verification completed successfully"
          else
            echo "::error::Release verification failed - release not found: $RELEASE_TAG"
            exit 1
          fi
        else
          echo "::warning::No release tag available for verification"
        fi
      env:
        STEP_EXECUTE_RELEASE_TAG: ${{ steps.execute.outputs.release-tag }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_REPO: ${{ inputs.repo }}

    # ================== 📊 ==================

    - name: "📊 Action Summary"
      if: always() && inputs.show-summary == 'true'
      shell: bash
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        <details><summary>🚀 GitHub Release : ${INPUT_TAG}</summary>

        ## 🔧 Input Parameters
        | Parameter | Value |
        |-----------|-------|
        | 🏷️ Tag | \`${INPUT_TAG}\` |
        | 📦 Assets | \`${INPUT_ASSETS}\` |
        | 📝 Title | \`${INPUT_TITLE}\` |
        | 📋 Draft | \`${INPUT_DRAFT}\` |
        | 🚧 Prerelease | \`${INPUT_PRERELEASE}\` |
        | ⭐ Latest | \`${INPUT_LATEST}\` |
        | 🎯 Target | \`${INPUT_TARGET}\` |
        | 📁 Repository | \`${INPUT_REPO}\` |

        ## 📤 Release Results
        | Metric | Value |
        |--------|---------|
        | 🆔 Release ID | \`${STEP_EXECUTE_RELEASE_ID}\` |
        | 🔗 Release URL | \`${STEP_EXECUTE_RELEASE_URL}\` |
        | 🏷️ Release Tag | \`${STEP_EXECUTE_RELEASE_TAG}\` |
        | 📝 Release Name | \`${STEP_EXECUTE_RELEASE_NAME}\` |
        | 🔗 Upload URL | \`${STEP_EXECUTE_UPLOAD_URL}\` |

        ## ⚙️ Release Configuration
        | Option | Status |
        |--------|---------|
        | 📄 Generate Notes | \`${INPUT_GENERATE_NOTES}\` |
        | 📄 Notes from Tag | \`${INPUT_NOTES_FROM_TAG}\` |
        | ✅ Verify Tag | \`${INPUT_VERIFY_TAG}\` |
        | 🔍 Fail on No Commits | \`${INPUT_FAIL_ON_NO_COMMITS}\` |
        | 💬 Discussion Category | \`${INPUT_DISCUSSION_CATEGORY}\` |

        ## ⚙️ Process Details
        | Step | Status |
        |------|---------|
        | ✅ Input Validation | \`✅ Completed\` |
        | 🏗️ Argument Building | \`${STEP_BUILD_ARGS_OUTCOME_LABEL}\` |
        | ⚙️ GitHub CLI Setup | \`✅ Completed\` |
        | 🚀 Release Creation | \`${STEP_EXECUTE_OUTCOME_LABEL}\` |
        | 🔍 Release Verification | \`${STEP_VERIFY_OUTCOME_LABEL}\` |

        </details>
        EOF
      env:
        INPUT_TAG: ${{ inputs.tag || 'auto-generated' }}
        INPUT_ASSETS: ${{ inputs.assets || 'none' }}
        INPUT_TITLE: ${{ inputs.title || 'auto-generated' }}
        INPUT_DRAFT: ${{ inputs.draft }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
        INPUT_LATEST: ${{ inputs.latest }}
        INPUT_TARGET: ${{ inputs.target || 'default branch' }}
        INPUT_REPO: ${{ inputs.repo || 'current' }}
        STEP_EXECUTE_RELEASE_ID: ${{ steps.execute.outputs.release-id }}
        STEP_EXECUTE_RELEASE_URL: ${{ steps.execute.outputs.release-url }}
        STEP_EXECUTE_RELEASE_TAG: ${{ steps.execute.outputs.release-tag }}
        STEP_EXECUTE_RELEASE_NAME: ${{ steps.execute.outputs.release-name }}
        STEP_EXECUTE_UPLOAD_URL: ${{ steps.execute.outputs.upload-url }}
        INPUT_GENERATE_NOTES: ${{ inputs.generate-notes }}
        INPUT_NOTES_FROM_TAG: ${{ inputs.notes-from-tag }}
        INPUT_VERIFY_TAG: ${{ inputs.verify-tag }}
        INPUT_FAIL_ON_NO_COMMITS: ${{ inputs.fail-on-no-commits }}
        INPUT_DISCUSSION_CATEGORY: ${{ inputs.discussion-category || 'none' }}
        STEP_BUILD_ARGS_OUTCOME_LABEL: ${{ steps.build-args.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_EXECUTE_OUTCOME_LABEL: ${{ steps.execute.outcome == 'success' && '✅ Completed' || '❌ Failed' }}
        STEP_VERIFY_OUTCOME_LABEL: ${{ steps.verify.outcome == 'success' && '✅ Completed' || '❌ Failed' }}

branding:
  icon: "tag"
  color: "blue"

# gh release create --help
# Create a new GitHub Release for a repository.

# A list of asset files may be given to upload to the new release. To define a
# display label for an asset, append text starting with `#` after the file name.

# If a matching git tag does not yet exist, one will automatically get created
# from the latest state of the default branch.
# Use `--target` to point to a different branch or commit for the automatic tag creation.
# Use `--verify-tag` to abort the release if the tag doesn't already exist.
# To fetch the new tag locally after the release, do `git fetch --tags origin`.

# To create a release from an annotated git tag, first create one locally with
# git, push the tag to GitHub, then run this command.
# Use `--notes-from-tag` to get the release notes from the annotated git tag.
# If the tag is not annotated, the commit message will be used instead.

# Use `--generate-notes` to automatically generate notes using GitHub Release Notes API.
# When using automatically generated release notes, a release title will also be automatically
# generated unless a title was explicitly passed. Additional release notes can be prepended to
# automatically generated notes by using the `--notes` flag.

# By default, the release is created even if there are no new commits since the last release.
# This may result in the same or duplicate release which may not be desirable in some cases.
# Use `--fail-on-no-commits` to fail if no new commits are available. This flag has no
# effect if there are no existing releases or this is the very first release.


# USAGE
#   gh release create [<tag>] [<filename>... | <pattern>...]

# ALIASES
#   gh release new

# FLAGS
#       --discussion-category string   Start a discussion in the specified category
#   -d, --draft                        Save the release as a draft instead of publishing it
#       --fail-on-no-commits           Fail if there are no commits since the last release (no impact on the first release)
#       --generate-notes               Automatically generate title and notes for the release via GitHub Release Notes API
#       --latest                       Mark this release as "Latest" (default [automatic based on date and version]). --latest=false to explicitly NOT set as latest
#   -n, --notes string                 Release notes
#   -F, --notes-file file              Read release notes from file (use "-" to read from standard input)
#       --notes-from-tag               Fetch notes from the tag annotation or message of commit associated with tag
#       --notes-start-tag string       Tag to use as the starting point for generating release notes
#   -p, --prerelease                   Mark the release as a prerelease
#       --target branch                Target branch or full commit SHA (default [main branch])
#   -t, --title string                 Release title
#       --verify-tag                   Abort in case the git tag doesn't already exist in the remote repository

# INHERITED FLAGS
#       --help                     Show help for command
#   -R, --repo [HOST/]OWNER/REPO   Select another repository using the [HOST/]OWNER/REPO format

# EXAMPLES
#   # Interactively create a release
#   $ gh release create

#   # Interactively create a release from specific tag
#   $ gh release create v1.2.3

#   # Non-interactively create a release
#   $ gh release create v1.2.3 --notes "bugfix release"

#   # Use automatically generated via GitHub Release Notes API release notes
#   $ gh release create v1.2.3 --generate-notes

#   # Use release notes from a file
#   $ gh release create v1.2.3 -F release-notes.md

#   # Use tag annotation or associated commit message as notes
#   $ gh release create v1.2.3 --notes-from-tag

#   # Don't mark the release as latest
#   $ gh release create v1.2.3 --latest=false

#   # Upload all tarballs in a directory as release assets
#   $ gh release create v1.2.3 ./dist/*.tgz

#   # Upload a release asset with a display label
#   $ gh release create v1.2.3 '/path/to/asset.zip#My display label'

#   # Create a release and start a discussion
